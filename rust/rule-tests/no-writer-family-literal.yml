id: no-writer-family-literal
valid:
  - 'fn unrelated() { let _ = "discovers"; let _ = "kit-catalogue.yaml"; let _ = "my-manifests/file"; }'
  - 'fn unrelated() { /* "covers" */ let _ = "source-covers"; }'
  - '#[cfg(test)] mod fixtures { fn helper() { let _ = "covers"; } }'
  - '#[test] fn fixture() { let _ = "kit-catalog.yaml"; }'
  - '#[cfg(all(test, unix))] fn fixture() { let _ = "path-hints"; }'
  - '#[cfg(any(test))] fn fixture() { let _ = "manifests"; }'
  - '#![cfg(test)] fn fixture() { let _ = "covers"; }'
  - 'mod fixtures { #![cfg(all(test, unix))] fn fixture() { let _ = "covers"; } }'
  - '#[cfg(any())] fn disabled() { let _ = "covers"; }'
invalid:
  - 'fn helper() { let _ = "covers"; }'
  - 'const NAME: &str = "kit-catalog.yaml";'
  - 'fn helper() { let _ = "path-hints.yaml"; }'
  - 'fn helper() { let _ = format!("{}/manifests/{}.yaml", root, id); }'
  - 'fn helper() { let _ = concat!("covers", "/file.png"); }'
  - 'fn helper() { let _ = r#"COVERS/file.png"#; }'
  - 'fn helper() { let _ = b"Kit-Catalog.json"; }'
  - 'fn helper() { let _ = br#"PATH-HINTS.yaml"#; }'
  - 'fn helper() { let _ = "root\\manifests\\file.yaml"; }'
  - '#[cfg(any(test, unix))] fn production() { let _ = "covers"; }'
  - '#[cfg(not(test))] fn production() { let _ = "covers"; }'
  - '#[cfg(test)] fn fixture() {} fn production() { let _ = "covers"; }'
  - '#[cfg(any())] fn disabled() {} fn production() { let _ = "covers"; }'
  - 'struct S { #[cfg(test)] field: bool } fn production() { let _ = "covers"; }'
  - 'fn production(#[cfg(test)] arg: bool) { let _ = "covers"; }'
