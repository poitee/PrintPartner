id: runtime-process-command
valid:
  - 'fn production() { std::process::id(); }'
  - 'use std::process::{id, ExitCode};'
  - 'use crate::process::Command;'
  - 'fn production() { let text = "std::process::Command"; }'
  - 'use std::process; fn production() { process::id(); }'
  - 'use std::process as p; fn production() { p::id(); }'
  - 'mod process { pub struct Command; } fn production(_: process::Command) {}'
  - 'use std::process as p; mod q { pub struct Command; } fn production(_: q::Command) {}'
  - 'use foo::process::{self}; fn production(_: process::Command) {}'
  - 'use std::process::{self as p}; mod process { pub struct Command; } fn production(_: process::Command) {}'
  - 'use std::fs::{self}; mod process { pub struct Command; } fn production(_: process::Command) {}'
  - 'use std::process::{id as Command};'
  - 'fn production() { println!("std::process::Command"); }'
  - 'use std::process; mod nested { mod process { pub struct Command; } fn production(_: process::Command) {} }'
  - 'use std::process as p; fn production() { use foo as p; let _: p::Command; }'
  - 'mod a { use std::process as p; } mod b { mod p { pub struct Command; } fn production(_: p::Command) {} }'
  - 'use std as standard; fn production() { use other as standard; let _: standard::process::Command; }'
  - 'use std::process; fn production() { use crate::process; let _: process::Command; }'
  - 'use std::process; fn production() { mod process { pub struct Command; } let _: process::Command; }'
  - 'use other::{self as standard}; fn production(_: standard::process::Command) {}'
invalid:
  - 'fn production() { std::process::Command::new("sh"); }'
  - 'use std::process::Command;'
  - 'use std::process::Command as Spawn;'
  - 'use std::process::{id, Command};'
  - 'use std::process::{Command as Spawn, id};'
  - 'use std::{fs, process::Command};'
  - 'use std::{process::{Command as Spawn, id}, fs};'
  - 'fn production(command: std::process::Command) {}'
  - 'use std::process; fn production() { process::Command::new("sh"); }'
  - 'use std::process; fn production(_: process::Command) {}'
  - 'use ::std::process as p; fn production() { p::Command::new("sh"); }'
  - 'use std::process as p; fn production(_: p::Command) {}'
  - 'use std::{process, fs}; fn production() { process::Command::new("sh"); }'
  - 'use std::{process as p, fs}; fn production() { p::Command::new("sh"); }'
  - 'use std::process::*;'
  - 'use std::{process::*};'
  - 'use std::process::{self, id}; fn production() { process::Command::new("sh"); }'
  - 'use std::process::{self}; fn production(_: process::Command) {}'
  - 'use std::process::{self as p}; fn production() { p::Command::new("sh"); }'
  - 'use std::{process::{self as p}}; fn production() { p::Command::new("sh"); }'
  - 'pub use std::process; fn production() { process::Command::new("sh"); }'
  - 'pub(crate) use std::process as p; fn production() { p::Command::new("sh"); }'
  - 'fn production() { vec![std::process::Command::new("sh")]; }'
  - 'use std::process as p; fn production() { vec![p::Command::new("sh")]; }'
  - 'use std::process; fn production() { { process::Command::new("sh"); } }'
  - 'mod nested { use std::process; fn production() { process::Command::new("sh"); } }'
  - 'use std as standard; fn production() { standard::process::Command::new("sh"); }'
  - 'use ::std as standard; fn production(_: standard::process::Command) {}'
  - 'use std as standard; fn production() { vec![standard::process::Command::new("sh")]; }'
  - 'use std::process; fn production() { use std::io::Write; process::Command::new("sh"); }'
  - 'use std::process; fn production() { struct Bar; process::Command::new("sh"); }'
  - 'use std::process as p; fn production() { use std::io; p::Command::new("sh"); }'
  - 'use std as standard; fn production() { use std::io::Read; standard::process::Command::new("sh"); }'
  - 'use std::process; fn production() { use std::io::Write; vec![process::Command::new("sh")]; }'
  - 'use std::process; fn production() { use std::process::Stdio; process::Command::new("sh"); }'
  - 'use std::{self as standard}; fn production() { standard::process::Command::new("sh"); }'
  - 'use ::std::{self as standard, io}; fn production() { vec![standard::process::Command::new("sh")]; }'
