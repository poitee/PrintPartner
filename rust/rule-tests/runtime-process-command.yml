id: runtime-process-command
valid:
  - 'fn production() { std::process::id(); }'
  - 'use std::process::{id, ExitCode};'
  - 'use crate::process::Command;'
  - 'fn production() { let text = "std::process::Command"; }'
  - 'use std::process; fn production() { process::id(); }'
  - 'use std::process as p; fn production() { p::id(); }'
  - 'mod process { pub struct Command; } fn production(_: process::Command) {}'
  - 'use std::process as p; mod q { pub struct Command; } fn production(_: q::Command) {}'
invalid:
  - 'fn production() { std::process::Command::new("sh"); }'
  - 'use std::process::Command;'
  - 'use std::process::Command as Spawn;'
  - 'use std::process::{id, Command};'
  - 'use std::process::{Command as Spawn, id};'
  - 'use std::{fs, process::Command};'
  - 'use std::{process::{Command as Spawn, id}, fs};'
  - 'fn production(command: std::process::Command) {}'
  - 'use std::process; fn production() { process::Command::new("sh"); }'
  - 'use std::process; fn production(_: process::Command) {}'
  - 'use ::std::process as p; fn production() { p::Command::new("sh"); }'
  - 'use std::process as p; fn production(_: p::Command) {}'
  - 'use std::{process, fs}; fn production() { process::Command::new("sh"); }'
  - 'use std::{process as p, fs}; fn production() { p::Command::new("sh"); }'
  - 'use std::process::*;'
  - 'use std::{process::*};'
