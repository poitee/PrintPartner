id: no-unwrap-expect
valid:
  - '#[cfg(/* test-only */ test)] fn fixture() { value.unwrap(); }'
  - '#[/* attribute */ cfg /* predicate */ (test /* fixture */)] fn fixture() { value.expect("fixture"); }'
  - '#![cfg(/* test-only */ test)] fn fixture() { value.unwrap(); }'
  - 'mod fixture { #![cfg(test /* fixture */)] fn helper() { value.unwrap(); } }'
  - '#[r#cfg(/* fixture */ r#test)] fn fixture() { value.unwrap(); }'
  - '#[r#cfg(r#test)] fn fixture() { value.unwrap(); }'
  - '#[r#test] fn fixture() { value.expect("fixture"); }'
  - '#[r#cfg(r#all(r#test, unix))] fn fixture() { value.unwrap(); }'
  - '#![r#cfg(r#test)] fn fixture() { value.unwrap(); }'
  - 'fn production() { r#stringify!(value.unwrap()); }'
  - 'fn production() { r#std::r#stringify!(value.unwrap()); }'
  - 'fn production() { outer!(r#core::r#stringify!(value.unwrap())); }'
  - '#![cfg(all(test, unix))] fn fixture() { value.unwrap(); }'
  - 'mod fixture { #![cfg(all(unix, test))] fn fixture() { value.expect("fixture"); } }'
  - 'fn production() { outer!(::std::stringify!(value.unwrap())); }'
  - 'fn production() { outer!(::core::stringify!(value.expect("name"))); }'
  - '#![cfg(test)] fn fixture() { Some(1).unwrap(); }'
  - 'mod fixture { #![cfg(test)] fn helper() { value.unwrap(); } fn case() { value.expect("fixture"); } }'
  - 'fn production() { let function = (Option::unwrap); }'
  - 'fn production() -> Option<()> { value()?; Some(()) }'
  - 'fn production() { let text = "value.unwrap()"; /* value.expect("reason") */ }'
  - '#[cfg(test)] mod arbitrary_name { fn helper() { value.unwrap(); } }'
  - '#[cfg(test)] #[inline] fn helper() { value.expect("fixture"); }'
  - '#[cfg(test)] /* fixture helpers */ fn helper() { value.unwrap(); }'
  - '#[test] fn case() { value.unwrap(); }'
  - '#[tokio::test(flavor = "current_thread")] async fn case() { value.expect("fixture"); }'
  - 'fn production() { println!("value.unwrap()", unwrap()); }'
  - 'fn production() { println!("{}", "value.unwrap()" /* value.expect("reason") */); }'
  - '#[cfg(test)] mod tests { fn helper() { println!("{}", value.unwrap()); } }'
  - 'fn production() { let function = Option::unwrap; }'
  - 'fn production() { let name = stringify!(value.unwrap()); }'
  - 'fn production() { println!("{}", stringify!(Result::expect(value, "reason"))); }'
  - 'fn production() { let name = std::stringify!(value.r#unwrap()); }'
  - 'fn production() { println!("{}", std::stringify!(value.unwrap())); }'
  - '#[cfg(all(test, unix))] fn helper() { value.unwrap(); }'
  - '#[cfg(all(unix, test))] mod tests { fn helper() { value.expect("fixture"); } }'
  - '#[cfg(all(test, any(unix, windows)))] fn helper() { println!("{}", value.unwrap()); }'
  - '#[cfg(all /* platform */ (test, unix))] fn helper() { value.unwrap(); }'
invalid:
  - '#[cfg(test /* feature */ = "fixture")] fn production() { value.unwrap(); }'
  - '#![cfg(test /* feature */ = "fixture")] fn production() { value.unwrap(); }'
  - '#[cfg(/* fixture */ test)] fn fixture() {} fn production() { value.unwrap(); }'
  - 'mod fixture { #![cfg(/* fixture */ test)] fn helper() { value.unwrap(); } } fn production() { value.unwrap(); }'
  - '#[r#cfg(r#all(r#test = "fixture", unix))] fn production() { value.unwrap(); }'
  - 'fn production() { outer!(custom::r#std::r#stringify!(value.unwrap())); }'
  - '#![cfg(all(not(test), unix))] fn production() { value.unwrap(); }'
  - '#![cfg(all(test = "fixture", unix))] fn production() { value.unwrap(); }'
  - 'mod fixture { #![cfg(all(test, unix))] fn helper() { value.unwrap(); } } fn production() { value.unwrap(); }'
  - 'fn production() { outer!(custom::std::stringify!(value.unwrap())); }'
  - 'fn production() { outer!(custom::core::stringify!(value.expect("reason"))); }'
  - 'fn production() { (Option::unwrap)(Some(1)); }'
  - 'fn production() { (Result::expect)(value, "reason"); }'
  - 'fn production() { (Option::r#unwrap)(Some(1)); }'
  - 'fn production() { (Result::r#expect)(value, "reason"); }'
  - 'mod fixture { #![cfg(test)] fn helper() { value.unwrap(); } } fn production() { value.unwrap(); }'
  - '#![cfg(any(test, feature = "runtime"))] fn production() { value.unwrap(); }'
  - 'fn production() { value.unwrap(); }'
  - 'fn production() { value.expect("reason"); }'
  - 'fn production() { value.unwrap().expect("reason"); }'
  - 'mod tests { fn production() { value.unwrap(); } }'
  - '#[cfg(test)] mod tests {} fn production() { value.unwrap(); }'
  - '#[test] fn case() {} fn production() { value.expect("reason"); }'
  - '#[cfg(any(test, feature = "runtime"))] fn production() { value.unwrap(); }'
  - '#[cfg(not(test))] fn production() { value.unwrap(); }'
  - 'fn production() { println!("{}", value.unwrap()); }'
  - 'fn production() { json!({"id": value.expect("id")}); }'
  - 'fn production() { outer!(inner!(value.unwrap())); }'
  - 'fn production() { println!("{}", value /*a*/ . /*b*/ unwrap /*c*/ ()); }'
  - 'fn production() { println!("{}", value.unwrap().expect("reason")); }'
  - 'macro_rules! production { () => { value.unwrap() }; }'
  - 'fn production() { Option::unwrap(Some(1)); }'
  - 'fn production() { Result::<i32, &str>::expect(value, "reason"); }'
  - 'fn production() { <Option<i32>>::unwrap(Some(1)); }'
  - 'fn production() { println!("{}", Option::unwrap(Some(1))); }'
  - 'fn production() { Some(1).r#unwrap(); }'
  - 'fn production() { value.r#expect("reason"); }'
  - 'fn production() { Option::r#unwrap(Some(1)); }'
  - 'fn production() { Result::<i32, &str>::r#expect(value, "reason"); }'
  - 'fn production() { println!("{}", value.r#unwrap()); }'
  - 'fn production() { println!("{}", Result::r#expect(value, "reason")); }'
  - 'fn production() { println!("{}", custom::stringify!(value.unwrap())); }'
  - '#[cfg(all(any(test, unix), feature = "runtime"))] fn production() { value.unwrap(); }'
  - '#[cfg(all(not(test), unix))] fn production() { value.unwrap(); }'
  - '#[cfg(all(test, unix))] fn helper() {} fn production() { value.unwrap(); }'
  - '#[cfg(all(test = "fixture", unix))] fn production() { value.unwrap(); }'
  - '#[cfg(all(test /* feature */ = "fixture", unix))] fn production() { value.unwrap(); }'
