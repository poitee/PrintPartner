# cargo-deny configuration for the Print Partner rust/ workspace (AGPL-3.0-only).
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Policy summary:
# - Licenses: allow permissive/OSI-friendly licenses that are compatible with
#   distributing this AGPL-3.0-only workspace; first-party AGPL is via exceptions.
# - Advisories: vulnerabilities / unsound / notices fail the check. Unmaintained
#   crates are downgraded to warnings in CI via `cargo deny check -W unmaintained`
#   (cargo-deny 0.20 has no `unmaintained = "warn"` lint level).
# - Bans: duplicate versions warn only (report-only).
# - Sources: crates.io only.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Fail on vulnerability / unsound / notice advisories (cargo-deny 0.20 defaults).
# Unmaintained: keep default (error) in-config; CI passes `-W unmaintained` so
# unmaintained crates warn without failing the job.
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.8
# Allowlist: permissive licenses present in the current rust/ dependency graph
# that are compatible with an AGPL-3.0-only distribution (not a substitute for
# legal review — just the deny gate for this workspace).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "MIT-0",
]

# Exceptions (documented): copyleft licenses scoped per crate.
# Do not blanket-allow AGPL/GPL/LGPL tree-wide.
#
# Exception: AGPL-3.0-only on every first-party workspace crate.
# Reason: rust/Cargo.toml [workspace.package] sets license = "AGPL-3.0-only".
# cargo-deny also checks first-party crates; AGPL is allowed only for these
# crates, not for third-party dependencies. Crates covered: pp-api-types,
# pp-compat, pp-contracts, pp-core, pp-desktop, pp-domain, pp-drivers,
# pp-gateway, pp-net, pp-server, pp-services.
exceptions = [
    { crate = "pp-api-types", allow = ["AGPL-3.0-only"] },
    { crate = "pp-compat", allow = ["AGPL-3.0-only"] },
    { crate = "pp-contracts", allow = ["AGPL-3.0-only"] },
    { crate = "pp-core", allow = ["AGPL-3.0-only"] },
    { crate = "pp-desktop", allow = ["AGPL-3.0-only"] },
    { crate = "pp-domain", allow = ["AGPL-3.0-only"] },
    { crate = "pp-drivers", allow = ["AGPL-3.0-only"] },
    { crate = "pp-gateway", allow = ["AGPL-3.0-only"] },
    { crate = "pp-net", allow = ["AGPL-3.0-only"] },
    { crate = "pp-server", allow = ["AGPL-3.0-only"] },
    { crate = "pp-services", allow = ["AGPL-3.0-only"] },
]

[bans]
# Duplicate versions: warn only (report-only); do not fail CI.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
