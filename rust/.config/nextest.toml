[[profile.default.overrides]]
filter = 'binary(=ticket_t_3_drain) & test(=scratch_root_is_empty_after_drain_tests)'
threads-required = "num-test-threads"

[profile.pp-local-linux]
test-threads = 3

# Real-process suites must not compete for the three-vCPU runner's test capacity.
[[profile.pp-local-linux.overrides]]
filter = 'binary(=runtime_m0) | package(=pp-compat)'
threads-required = "num-test-threads"
