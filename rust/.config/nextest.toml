# Bound hung tests: mark slow at 60s, terminate after 10 periods (10m).
# working_draft_* tests are normally 1–10s; this only fires on hangs.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

# Tests that start real Node children (pp-core runtime_m0, pp-compat's ticket_t_2
# supervisor tests). Under a loaded runner they time out when four run at once
# (GRE-956), so at most two run together. Other tests keep the remaining threads.
[test-groups]
process-heavy = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'binary(=runtime_m0) | (package(=pp-compat) & test(/^ticket_t_2::/))'
test-group = "process-heavy"

# Flaky list: nextest retries each test once and reports a retried pass as FLAKY.
# docs/development/ci.md has the policy. Empty: every known flake is fixed.
# Add a test only with its open Linear ticket and owner in a comment, e.g.
#   filter = 'none() | (binary(=runtime_m0) & test(=some_test))'  # GRE-n, owner
# Quarantine (retried twice in a week) moves the test from here to a default-filter
# under [profile.default]; nextest applies it on top of CI's -E filter:
#   default-filter = 'not (binary(=runtime_m0) & test(=some_test))'  # GRE-n, owner
[[profile.default.overrides]]
filter = 'none()'
retries = 1

[[profile.default.overrides]]
filter = 'binary(=ticket_t_3_drain) & test(=scratch_root_is_empty_after_drain_tests)'
threads-required = "num-test-threads"

# Its 60s verification budget assumes an idle runner; see the budget comment in ticket_t_2.rs.
[[profile.default.overrides]]
filter = 'package(=pp-compat) & test(=ticket_t_2::ticket_t_3_drain_measured_release_startup_parent_death)'
threads-required = "num-test-threads"

# Six waits of up to CRASH_CYCLE_DEADLINE (150s) each, plus startup, must end in the
# test's own diagnostic panic before nextest terminates it.
[[profile.default.overrides]]
filter = 'binary(=runtime_m0) & test(=crash_guard_stops_after_five_failures_and_recovers_explicitly)'
slow-timeout = { period = "60s", terminate-after = 17 }

[profile.pp-local-linux]
test-threads = 3

# Real-process suites must not compete for the three-vCPU runner's test capacity.
[[profile.pp-local-linux.overrides]]
filter = 'binary(=runtime_m0) | package(=pp-compat)'
threads-required = "num-test-threads"
