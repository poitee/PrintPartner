[package]
name = "pp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop_rebuild = ["pp-storage/desktop_rebuild", "dep:ryu-js", "dep:regress", "dep:pp-source", "pp-source/desktop_rebuild", "dep:reqwest"]

[dependencies]
pp-storage = { path = "../pp-storage" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
libc.workspace = true
tokio-util.workspace = true
pp-compat = { path = "../pp-compat" }
pp-gateway = { path = "../pp-gateway" }
ryu-js = { version = "=1.0.2", optional = true }
regress = { version = "=0.11.1", optional = true }

pp-source = { path = "../pp-source", optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
