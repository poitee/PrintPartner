[package]
name = "pp-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop_rebuild = ["pp-core/desktop_rebuild"]
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
pp-core = { path = "../pp-core" }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.1", features = ["tray-icon"] }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[build-dependencies]
tauri-build = "=2.7.1"

# cargo-machete --with-metadata can miss build-script use that backs tauri::generate_context!.
[package.metadata.cargo-machete]
ignored = [
  "tauri-build", # false positive: required by build.rs for tauri::generate_context! macro
]
