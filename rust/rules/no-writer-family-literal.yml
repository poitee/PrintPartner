id: no-writer-family-literal
language: Rust
severity: warning
message: 'GRE-402: review this no-writer family literal; update the manifest rust_writes declaration if Rust starts writing this family.'
files:
  - crates/**/*.rs
ignores:
  - crates/*/tests/**
  # Out-of-line unit tests follow the src/**/tests.rs or src/**/tests/** convention.
  - crates/*/src/**/tests.rs
  - crates/*/src/**/tests/**
utils:
  disabled-cfg-item:
    follows:
      kind: attribute_item
      has:
        kind: attribute
        has:
          kind: identifier
          regex: '^(r#)?cfg$'
        all:
          - has:
              field: arguments
              has:
                kind: token_tree
                follows:
                  kind: identifier
                  regex: '^(r#)?any$'
                  stopBy:
                    matches: non-comment
                not:
                  has:
                    all:
                      - matches: non-comment
                      - regex: '[^()]'
      stopBy:
        not:
          any:
            - kind: attribute_item
            - kind: line_comment
            - kind: block_comment
  test-cfg-any:
    has:
      kind: attribute
      has:
        kind: identifier
        regex: '^(r#)?cfg$'
      all:
        - has:
            field: arguments
            has:
              kind: token_tree
              follows:
                kind: identifier
                regex: '^(r#)?any$'
                stopBy:
                  matches: non-comment
              has:
                kind: identifier
                regex: '^(r#)?test$'
              not:
                has:
                  all:
                    - matches: non-comment
                    - not:
                        regex: '^(r#)?test$|^[(),]$'
  test-attribute:
    has:
      kind: attribute
      not:
        has:
          field: value
          regex: '.'
      has:
        any:
          - kind: identifier
            regex: '^(r#)?test$'
          - kind: scoped_identifier
            has:
              field: name
              regex: '^(r#)?test$'
  test-cfg-direct:
    has:
      kind: attribute
      has:
        kind: identifier
        regex: '^(r#)?cfg$'
      all:
        - has:
            field: arguments
            has:
              kind: identifier
              regex: '^(r#)?test$'
              not:
                precedes:
                  regex: '^=$'
                  stopBy:
                    matches: non-comment
  test-cfg-all:
    has:
      kind: attribute
      has:
        kind: identifier
        regex: '^(r#)?cfg$'
      all:
        - has:
            field: arguments
            has:
              kind: token_tree
              follows:
                kind: identifier
                regex: '^(r#)?all$'
                stopBy:
                  matches: non-comment
              has:
                kind: identifier
                regex: '^(r#)?test$'
                not:
                  precedes:
                    regex: '^=$'
                    stopBy:
                      matches: non-comment
  non-comment:
    not:
      any:
        - kind: line_comment
        - kind: block_comment
rule:
  all:
    - any:
        - kind: string_literal
        - kind: raw_string_literal
    - regex: '(?i)(^|["/\\])(covers|kit-catalog|path-hints|manifests)([./\\"#]|$)'
    - not:
        any:
          - matches: disabled-cfg-item
          - inside:
              matches: disabled-cfg-item
              stopBy: end
    # Inner cfg attributes apply to the containing file, module, or block.
    - not:
        inside:
          any:
            - kind: source_file
            - kind: declaration_list
            - kind: block
          has:
            kind: inner_attribute_item
            any:
              - matches: test-cfg-any
              - matches: test-cfg-direct
              - matches: test-cfg-all
          stopBy: end
    - not:
        inside:
          stopBy: end
          follows:
            kind: attribute_item
            any:
              - matches: test-cfg-any
              - matches: test-attribute
              - matches: test-cfg-direct
              # A direct test term in all(...) makes every build test-only.
              - matches: test-cfg-all
            # Attributes apply only to the next item, including other attributes
            # and comments between them; never exempt subsequent production code.
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
