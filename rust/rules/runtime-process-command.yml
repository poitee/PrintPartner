id: runtime-process-command
language: Rust
severity: warning
message: std::process::Command belongs in pp-compat, pp-core, or pp-desktop.
files:
  - crates/**/*.rs
ignores:
  - crates/pp-compat/**
  - crates/pp-core/**
  - crates/pp-desktop/**
utils:
  std-process-path:
    regex: '^(::)?std\s*::\s*process$'
  std-list:
    kind: scoped_use_list
    has:
      field: path
      regex: '^(::)?std$'
  std-process-list:
    kind: scoped_use_list
    has:
      field: path
      any:
        - matches: std-process-path
        - all:
            - regex: '^process$'
            - inside:
                matches: std-list
                stopBy: end
  # $MODULE is bound by the Command use site and must match its imported name.
  process-module-import:
    any:
      - kind: use_declaration
        has:
          field: argument
          matches: std-process-path
          has:
            field: name
            pattern: $MODULE
      - kind: use_declaration
        has:
          field: argument
          kind: use_as_clause
          has:
            field: path
            matches: std-process-path
          all:
            - has:
                field: alias
                pattern: $MODULE
      - all:
          - any:
              - kind: identifier
                regex: '^process$'
                pattern: $MODULE
              - kind: use_as_clause
                has:
                  field: path
                  regex: '^process$'
                all:
                  - has:
                      field: alias
                      pattern: $MODULE
          - inside:
              kind: use_list
              inside:
                matches: std-list
      - kind: use_as_clause
        has:
          field: path
          kind: self
        all:
          - has:
              field: alias
              pattern: $MODULE
          - inside:
              kind: use_list
              inside:
                matches: std-process-list
      - kind: self
        inside:
          kind: use_list
          inside:
            matches: std-process-list
            has:
              field: path
              any:
                - matches: std-process-path
                  has:
                    field: name
                    pattern: $MODULE
                - regex: '^process$'
                  pattern: $MODULE
  import-tree:
    any:
      - kind: use_declaration
      - kind: scoped_use_list
      - kind: use_list
      - kind: use_as_clause
      - kind: scoped_identifier
      - kind: identifier
      - kind: self
  lexical-scope:
    any:
      - kind: source_file
      - kind: declaration_list
      - kind: block
  process-import-scope:
    matches: lexical-scope
    has:
      matches: process-module-import
      stopBy:
        not:
          matches: import-tree
  std-import-scope:
    matches: lexical-scope
    has:
      kind: use_as_clause
      has:
        field: path
        regex: '^(::)?std$'
      all:
        - has:
            field: alias
            pattern: $MODULE
      stopBy:
        not:
          matches: import-tree
  # Stop at a nested module boundary or a closer definition/import of the name.
  import-boundary:
    any:
      - kind: declaration_list
        inside:
          kind: mod_item
      - matches: lexical-scope
        has:
          any:
            - any:
                - kind: mod_item
                - kind: struct_item
                - kind: enum_item
                - kind: type_item
                - kind: trait_item
              has:
                field: name
                pattern: $MODULE
            - kind: use_as_clause
              has:
                field: alias
                pattern: $MODULE
            - kind: scoped_identifier
              has:
                field: name
                pattern: $MODULE
            - kind: identifier
              pattern: $MODULE
              inside:
                kind: use_list
          stopBy:
            not:
              matches: import-tree
rule:
  any:
    - all:
        - any:
            - kind: scoped_identifier
            - kind: scoped_type_identifier
        - regex: '^(::)?std\s*::\s*process\s*::\s*Command$'
    # Grouped and renamed imports still introduce the same runtime capability.
    - kind: identifier
      regex: '^Command$'
      any:
        - inside:
            kind: use_list
        - inside:
            kind: use_as_clause
            has:
              field: path
              regex: '^Command$'
      inside:
        matches: std-process-list
        stopBy: end
    - pattern: process::Command
      inside:
        matches: std-list
        stopBy: end
    # Parsed paths and unparsed macro tokens use the same import resolution.
    - all:
        - any:
            - all:
                - any:
                    - kind: scoped_identifier
                    - kind: scoped_type_identifier
                - has:
                    field: name
                    regex: '^Command$'
                - has:
                    field: path
                    pattern: $MODULE
            - kind: identifier
              regex: '^Command$'
              inside:
                kind: token_tree
              follows:
                regex: '^::$'
                follows:
                  kind: identifier
                  pattern: $MODULE
        - inside:
            matches: process-import-scope
            stopBy:
              matches: import-boundary
    # An alias of std preserves the process::Command path beneath that alias.
    - all:
        - any:
            - all:
                - any:
                    - kind: scoped_identifier
                    - kind: scoped_type_identifier
                - has:
                    field: name
                    regex: '^Command$'
                - has:
                    field: path
                    has:
                      field: name
                      regex: '^process$'
                    all:
                      - has:
                          field: path
                          pattern: $MODULE
            - kind: identifier
              regex: '^Command$'
              inside:
                kind: token_tree
              follows:
                regex: '^::$'
                follows:
                  kind: identifier
                  regex: '^process$'
                  follows:
                    regex: '^::$'
                    follows:
                      kind: identifier
                      pattern: $MODULE
        - inside:
            matches: std-import-scope
            stopBy:
              matches: import-boundary
    - kind: identifier
      regex: '^Command$'
      inside:
        kind: token_tree
      follows:
        regex: '^::$'
        follows:
          kind: identifier
          regex: '^process$'
          follows:
            regex: '^::$'
            follows:
              kind: identifier
              regex: '^std$'
    # A wildcard import includes Command, even if referenced through an alias.
    - kind: use_wildcard
      any:
        - regex: '^(::)?std\s*::\s*process\s*::\s*\*$'
        - regex: '^process\s*::\s*\*$'
          inside:
            matches: std-list
            stopBy: end
