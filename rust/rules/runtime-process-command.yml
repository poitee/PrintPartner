id: runtime-process-command
language: Rust
severity: warning
message: std::process::Command belongs in pp-compat, pp-core, or pp-desktop.
files:
  - crates/**/*.rs
ignores:
  - crates/pp-compat/**
  - crates/pp-core/**
  - crates/pp-desktop/**
rule:
  any:
    - all:
        - any:
            - kind: scoped_identifier
            - kind: scoped_type_identifier
        - regex: '^(::)?std\s*::\s*process\s*::\s*Command$'
    # Grouped and renamed imports still introduce the same runtime capability.
    - all:
        - kind: identifier
        - regex: '^Command$'
        - inside:
            kind: scoped_use_list
            has:
              field: path
              regex: '^(::)?std\s*::\s*process$'
            stopBy: end
    - all:
        - any:
            - pattern: process::Command
            - all:
                - kind: identifier
                - regex: '^Command$'
                - inside:
                    kind: scoped_use_list
                    has:
                      field: path
                      regex: '^process$'
                    stopBy: end
        - inside:
            kind: scoped_use_list
            has:
              field: path
              regex: '^(::)?std$'
            stopBy: end
    # Resolve a module import in the same file before matching its Command path.
    - all:
        - any:
            - kind: scoped_identifier
            - kind: scoped_type_identifier
        - has:
            field: name
            regex: '^Command$'
        - has:
            field: path
            pattern: $MODULE
        - inside:
            kind: source_file
            has:
              any:
                - all:
                    - any:
                        - pattern: use std::process;
                        - pattern: use ::std::process;
                    - has:
                        stopBy: end
                        kind: identifier
                        pattern: $MODULE
                        regex: '^process$'
                - pattern: use std::process as $MODULE;
                - pattern: use ::std::process as $MODULE;
                - all:
                    - any:
                        - all:
                            - kind: identifier
                            - pattern: $MODULE
                            - regex: '^process$'
                            - inside:
                                kind: use_list
                        - all:
                            - kind: use_as_clause
                            - has:
                                field: path
                                regex: '^process$'
                            - has:
                                field: alias
                                pattern: $MODULE
                    - inside:
                        kind: scoped_use_list
                        has:
                          field: path
                          regex: '^(::)?std$'
                        stopBy: end
              stopBy: end
            stopBy: end
    # A wildcard import includes Command, even if referenced through an alias.
    - all:
        - kind: use_wildcard
        - any:
            - regex: '^(::)?std\s*::\s*process\s*::\s*\*$'
            - all:
                - regex: '^process\s*::\s*\*$'
                - inside:
                    kind: scoped_use_list
                    has:
                      field: path
                      regex: '^(::)?std$'
                    stopBy: end
