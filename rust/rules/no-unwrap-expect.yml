id: no-unwrap-expect
language: Rust
severity: warning
message: Propagate or handle errors instead of unwrap()/expect() outside tests.
files:
  - crates/**/*.rs
ignores:
  - crates/*/tests/**
  # Out-of-line unit tests follow the src/**/tests.rs or src/**/tests/** convention.
  - crates/*/src/**/tests.rs
  - crates/*/src/**/tests/**
utils:
  non-comment:
    not:
      any:
        - kind: line_comment
        - kind: block_comment
rule:
  all:
    - any:
        - pattern: $VALUE.unwrap()
        - pattern: $VALUE.expect($$$ARGS)
        - pattern: $TYPE::unwrap($$$ARGS)
        - pattern: $TYPE::expect($$$ARGS)
        - pattern: $VALUE.r#unwrap()
        - pattern: $VALUE.r#expect($$$ARGS)
        - pattern: $TYPE::r#unwrap($$$ARGS)
        - pattern: $TYPE::r#expect($$$ARGS)
        # Macro arguments are token trees, not parsed call expressions. Match
        # the method-name token between a dot and its argument list instead.
        - all:
            - kind: identifier
            - regex: '^(r#)?(unwrap|expect)$'
            - inside:
                kind: token_tree
            - follows:
                regex: '^(\.|::)$'
                stopBy:
                  not:
                    any:
                      - kind: line_comment
                      - kind: block_comment
            - precedes:
                kind: token_tree
                regex: '^\('
                stopBy:
                  not:
                    any:
                      - kind: line_comment
                      - kind: block_comment
    # stringify! returns the argument tokens without evaluating any calls.
    - not:
        inside:
          any:
            - kind: macro_invocation
              has:
                field: macro
                regex: '^(::)?((std|core)\s*::\s*)?stringify$'
            # Nested invocations in another macro are token trees too.
            - kind: token_tree
              follows:
                regex: '^!$'
                follows:
                  kind: identifier
                  regex: '^stringify$'
                  any:
                    - not:
                        follows:
                          regex: '^::$'
                    - follows:
                        regex: '^::$'
                        follows:
                          kind: identifier
                          regex: '^(std|core)$'
          stopBy: end
    - not:
        inside:
          stopBy: end
          follows:
            kind: attribute_item
            any:
              - regex: '^#\s*\[\s*(cfg\s*\(\s*test\s*\)|([A-Za-z_][A-Za-z_0-9]*::)*test(\s*\([^]]*\))?)\s*\]$'
              # A direct test term in all(...) makes every build test-only.
              - has:
                  kind: attribute
                  has:
                    kind: identifier
                    regex: '^cfg$'
                  all:
                    - has:
                        field: arguments
                        has:
                          kind: token_tree
                          follows:
                            kind: identifier
                            regex: '^all$'
                            stopBy:
                              matches: non-comment
                          has:
                            kind: identifier
                            regex: '^test$'
                            not:
                              precedes:
                                regex: '^=$'
                                stopBy:
                                  matches: non-comment
            # Attributes apply only to the next item, including other attributes
            # and comments between them; never exempt subsequent production code.
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
