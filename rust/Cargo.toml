[workspace]
members = ["crates/pp-storage", "crates/pp-core", "crates/pp-compat", "crates/pp-gateway", "crates/pp-server", "crates/pp-contracts", "crates/pp-source", "crates/pp-desktop"]
default-members = ["crates/pp-storage", "crates/pp-core", "crates/pp-compat", "crates/pp-gateway", "crates/pp-server", "crates/pp-contracts", "crates/pp-source"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
anyhow = "=1.0.100"
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_path_to_error = "=0.1.20"
hyper = { version = "=1.7.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.17", features = ["tokio"] }
http-body-util = "=0.1.3"
http-body = "=1.0.1"
rand = "=0.9.2"
hmac = "=0.12.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
fs2 = "=0.4.3"
libc = "=0.2.189"
tower-http = { version = "=0.6.11", features = ["fs"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }

[profile.dev.package.sha2]
opt-level = 3
