<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Partner — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, sans-serif;
        background: #1a1b1e;
        color: #e9ebee;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        margin: 0;
        gap: 1rem;
        text-align: center;
        padding: 1rem;
      }
      h1 { color: #f7f8f9; margin: 0; font-size: 1.25rem; }
      p  { margin: 0; font-size: 0.875rem; color: #a4a8ad; max-width: 22rem; }
      .icon { display: block; width: 3rem; height: 3rem; }
    </style>
  </head>
  <body>
    <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 4.4H6.5A2.1 2.1 0 0 0 4.4 6.5V12H12Z" fill="#50cae2"/>
      <rect x="3.1" y="3.1" width="17.8" height="17.8" rx="3.4" stroke="#e9ebee" stroke-width="1.7"/>
      <path d="M12 4V20M4 12H20" stroke="#e9ebee" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <h1>You're offline</h1>
    <p>
      Checkoffs you make will be queued and synced automatically when your
      connection returns.
    </p>
    <p>Navigate to <strong>/progress</strong> to use the cached floor view.</p>
  </body>
</html>
