<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Partner — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #cbd5e1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        margin: 0;
        gap: 1rem;
        text-align: center;
        padding: 1rem;
      }
      h1 { color: #f8fafc; margin: 0; font-size: 1.25rem; }
      p  { margin: 0; font-size: 0.875rem; color: #94a3b8; max-width: 22rem; }
      .icon { font-size: 2.5rem; }
    </style>
  </head>
  <body>
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>
      Checkoffs you make will be queued and synced automatically when your
      connection returns.
    </p>
    <p>Navigate to <strong>/progress</strong> to use the cached floor view.</p>
  </body>
</html>
