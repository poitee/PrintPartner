# Kit catalog — base printers, addon categories and stack presets.
#
# What ships here is the generic slot taxonomy only. Print Partner is agnostic
# about what you build, so no machine, vendor or mod is compiled into the
# product: `bases`, the `sources` under each category, and `stack_presets` are
# all yours to fill in.
#
# To supply your own catalog, drop a `kit-catalog.yaml` (or `.json`) into your
# data directory — `PRINT_PARTNER_DATA_DIR`, or `<dataDir>/manifests/`. It is
# read in preference to this file, so upgrades never clobber it. See
# services/kit-catalog.ts for the full search order.
#
# bases:
#   <base_id>:
#     label: Human name shown in the Kit Configurator
#     source_name: exact Source name as it appears in list_sources
#     default_addons: [<source_name>, ...]
#     compatible_addons: [<category_id>, ...]
#
# addon_categories.<category_id>.sources:
#   - name: exact Source name
#     variant_id: id used in kit manifest selections
#     compatible_bases: [<base_id>, ...]
version: 1

bases: {}

addon_categories:
  toolhead:
    label: Toolhead
    rule: pick_one
    replaces_slot: toolhead
    sources: []

  extruder:
    label: Extruder / filament path
    rule: pick_one
    replaces_slot: extruder
    sources: []

  hotend:
    label: Hotend mount
    rule: pick_one
    replaces_slot: hotend
    sources: []

  toolhead_electronics:
    label: Toolhead electronics
    rule: pick_one
    replaces_slot: toolhead_electronics
    sources: []

  probe:
    label: Z probe
    rule: pick_one
    replaces_slot: probe
    sources: []

  controller:
    label: Controller / electronics
    rule: pick_one
    replaces_slot: controller
    sources: []

  cable_routing:
    label: Cable routing / chains
    rule: pick_one
    replaces_slot: cable_routing
    sources: []

  z_drives:
    label: Z drives
    rule: pick_one
    replaces_slot: z_drives
    sources: []

  skirts_panels:
    label: Skirts / screen / panels
    rule: pick_any
    sources: []

  accent:
    label: Cosmetic / optional
    rule: pick_any
    sources: []

# Suggested base + addon combos. Add your own; the user may always override.
stack_presets: {}
