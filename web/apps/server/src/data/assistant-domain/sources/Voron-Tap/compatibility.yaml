schema: print-partner/compat@1
source_name: Voron-Tap
kind: addon_probe
attaches_to:
  - {base: Voron-2, ref: Voron2.4}
  - {base: Voron-Trident, ref: main/VTr2}
requirements:
  - "MGN-12H X axis"
  - "front mounted extruder (Clockwork2, LGX, Galileo)"
  - "5V at toolhead or 24V sensor PCB"
not_for: ["Voron-Switchwire", "Voron-Legacy (V1.8)", "Voron-0"]   # beds not rigid enough per README
replaces:
  - "stock X carriage (Tap replaces the carriage assembly)"
  - "Voron-2 STLs/Z_Endstop/nozzle_probe.stl"
  - "Voron-Trident STLs/Z_Assembly/z_endstop.stl (as virtual Z endstop)"
  - "inductive probe"
conflicts: ["Klicky-Probe", "Boop"]
ldo_pairing: "LDO V2/Trident 'Rev' kits commonly include Tap hardware; LDOVoron2 nozzle_probe_ldo is the NON-Tap LDO alternative"
