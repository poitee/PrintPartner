schema: print-partner/compat@1
source_name: Voron-Trident
kind: base
toolhead_policy: "No toolhead STLs in this repo; pair with Voron-Stealthburner (X carriage is in THIS repo under STLs/Gantry/X_Axis per SB STLs/README.md)"
recommended_addons:
  - {source: Voron-Stealthburner, ref: main, required: true}
  - {source: Voron-Tap, ref: main, optional: true, replaces: [STLs/Z_Assembly/z_endstop.stl], note: "Tap supported: 'nozzle-based z-probe for the V2 and Trident printer designs'"}
  - {source: Klicky-Probe, ref: main, optional: true, path_scope: Printers/Voron/v1.8_v2.4_Legacy_Trident, conflicts_with: Voron-Tap}
  - {source: Galileo2, ref: main, optional: true, path_scope: galileo2_extruder, replaces: "Stealthburner Clockwork2 rear section"}
ldo_pairing:
  kit_supplement: {source: LDOVoronTrident, ref: master}
  electronics: {source: Leviathan, ref: master, note: "Klipper_config/trident_leviathan.cfg exists upstream in Leviathan repo"}
  rule: "LDO Trident kit = Voron-Trident upstream STLs + LDOVoronTrident supplement parts; LDO repo is additive/replacement, never a full mirror"
conflicts:
  - "Voron-Tap vs Klicky-Probe vs stock z_endstop: pick exactly one Z-probe strategy"
  - "superseded_parts must be excluded from any stack"
