version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # knip is exact-pinned. 6.41.0 reports 55 unused exported types, one
      # unused export and two unlisted binaries that 6.5.0 accepts, so
      # `npm run lint:dead` fails. Upgrade it in its own PR with that cleanup
      # (GRE-664).
      - dependency-name: "knip"

  - package-ecosystem: pip
    directory: /manifests
    open-pull-requests-limit: 3
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /slicer-sidecar
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /rust
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Direct crates are pinned with "=", so a lockfile-only major bump cannot build.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
