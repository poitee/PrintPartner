name: Optional integration smoke

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/integration-smoke.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "web/**"
      - ".github/workflows/integration-smoke.yml"
  workflow_dispatch:
    inputs:
      postgres:
        description: Run the live Postgres adapter smoke test
        type: boolean
        default: true
      slicer_sidecar:
        description: Build and health-check the pinned OrcaSlicer sidecar
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  postgres:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || inputs.postgres)
    runs-on: ubuntu-latest
    # npm 10 waits fetch-timeout (300s) on a stalled socket and prints nothing
    # when CI hides the progress bar. A 5 minute job cancelled `npm ci` before
    # that wait could fail or retry (run 39713832065, job 119611149797).
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: printpartner
          POSTGRES_PASSWORD: postgres-smoke-only
          POSTGRES_DB: printpartner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U printpartner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Node version
        run: test "$(node --version)" = "v22.23.3"
      - name: Install web dependencies
        working-directory: web
        run: |
          set -euo pipefail
          install() {
            local cache="$1"
            mkdir -p "$cache"
            timeout 120s npm ci --ignore-scripts --cache "$cache" --fetch-timeout=60000 --fetch-retries=2 || return $?
            timeout 180s npm rebuild --cache "$cache" || return $?
          }
          if install "${HOME}/.npm"; then
            exit 0
          fi
          echo "npm ci attempt 1 failed; retrying with a fresh cache" >&2
          rm -rf node_modules
          install "${RUNNER_TEMP}/npm-cache-retry"
      - run: npm run build
        working-directory: web
      - name: Start SaaS server against Postgres
        working-directory: web
        env:
          DATABASE_URL: postgresql://printpartner:postgres-smoke-only@127.0.0.1:5432/printpartner
          DEPLOY_MODE: saas
          POSTGRES_EXPERIMENTAL: "1"
          MULTI_USER: "1"
          SESSION_SECRET: postgres-smoke-session-secret-not-for-production
          ALLOWED_ORIGINS: http://127.0.0.1:18765
          SESSION_COOKIE_SECURE: "0"
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: "18765"
          STATIC_DIR: ${{ github.workspace }}/web/apps/web/dist
        run: |
          node apps/server/dist/current/index.js >"${RUNNER_TEMP}/postgres-server.log" 2>&1 &
          COOKIE_JAR="${RUNNER_TEMP}/postgres-smoke.cookies"
          for ((attempt = 1; attempt <= 60; attempt++)); do
            if curl --fail --silent http://127.0.0.1:18765/health \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["db"]["driver"] == "postgres"; assert data["db"]["connected"] is True'
            then
              if curl --fail --silent --show-error -c "${COOKIE_JAR}" \
                -H "Content-Type: application/json" \
                -d '{"email":"postgres-smoke@example.com","password":"correct-horse-battery"}' \
                http://127.0.0.1:18765/auth/register \
                | python3 -c 'import json,sys; data=json.load(sys.stdin); user=data.get("user") or {}; assert user.get("user_id"); assert user.get("user_id") != "default"' \
                && curl --fail --silent --show-error -b "${COOKIE_JAR}" \
                -H "Content-Type: application/json" \
                -d '{"name":"Postgres CI smoke"}' \
                http://127.0.0.1:18765/plans \
                | python3 -c 'import json,sys; data=json.load(sys.stdin); assert isinstance(data.get("id"), int); assert data.get("name") == "Postgres CI smoke"' \
                && curl --fail --silent --show-error -b "${COOKIE_JAR}" http://127.0.0.1:18765/plans \
                | python3 -c 'import json,sys; data=json.load(sys.stdin); profiles=data.get("profiles"); assert isinstance(profiles, list) and len(profiles) == 1; profile=profiles[0]; assert isinstance(profile.get("id"), int); assert profile.get("name") == "Postgres CI smoke"; assert isinstance(profile.get("part_count"), int); assert isinstance(profile.get("build_stale"), bool); progress=profile.get("accepted_progress"); assert isinstance(progress, dict) and progress.get("kind") == "empty"'
              then
                exit 0
              fi
              break
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/postgres-server.log"
          exit 1

  slicer-sidecar:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'workflow_dispatch' && inputs.slicer_sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned sidecar
        run: docker build --tag print-partner-slicer-sidecar:smoke slicer-sidecar
      - name: Verify sidecar health
        run: |
          docker run --detach --name slicer-sidecar-smoke \
            --publish 127.0.0.1:2814:2814 \
            print-partner-slicer-sidecar:smoke
          for ((attempt = 1; attempt <= 90; attempt++)); do
            if curl --fail --silent http://127.0.0.1:2814/health \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "ok"; assert data["exists"] is True'
            then
              exit 0
            fi
            sleep 2
          done
          docker logs slicer-sidecar-smoke
          exit 1
