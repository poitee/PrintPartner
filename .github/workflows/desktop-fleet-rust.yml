name: Desktop Rust (fleet)

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/desktop-fleet-rust.yml'
  workflow_dispatch:
    inputs:
      build_jobs:
        description: Cargo build jobs (default 6 for 8 cores / 16 GiB)
      cache_root:
        description: Persistent writable cache root on the fleet VM
      cache_key:
        description: Use a fresh key for cold, then the same key and VM for warm

permissions:
  contents: read

concurrency:
  group: fleet-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.FLEET_RUST_RUNNER_LABELS || '["self-hosted", "linux", "x64", "agent-fleet"]') }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: ${{ inputs.build_jobs || vars.FLEET_RUST_BUILD_JOBS || '6' }}
      CACHE_ROOT: ${{ inputs.cache_root || vars.FLEET_RUST_CACHE_ROOT || '/persist/cargo-cache/PrintPartner' }}
      CACHE_KEY: ${{ inputs.cache_key || 'default' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find Rust workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f rust/Cargo.toml ]]; then
            echo 'manifest=rust/Cargo.toml' >> "$GITHUB_OUTPUT"
          else
            echo 'No Rust workspace (rust/Cargo.toml); skipping.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and test with persistent Cargo cache
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        env:
          MANIFEST: ${{ steps.workspace.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$CARGO_BUILD_JOBS" =~ ^[1-9][0-9]*$ ]] || { echo 'build_jobs must be a positive integer'; exit 1; }
          CACHE_ROOT=$(realpath -m -- "$CACHE_ROOT")
          [[ "$CACHE_ROOT" == /persist/* ]] || { echo 'cache_root must resolve under /persist/'; exit 1; }
          [[ "$CACHE_KEY" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo 'cache_key must contain only letters, digits, underscores or hyphens'; exit 1; }
          command -v cargo
          cargo nextest --version
          export CARGO_TARGET_DIR="$CACHE_ROOT/$CACHE_KEY/target"
          mkdir -p "$CARGO_TARGET_DIR"
          # Serialize this cache across workflows sharing a VM; different VMs have separate caches.
          exec 9>"$CACHE_ROOT/$CACHE_KEY/build.lock"
          flock 9
          start=$SECONDS
          cargo build --workspace --locked --manifest-path "$MANIFEST"
          cargo nextest run --workspace --locked --manifest-path "$MANIFEST"
          elapsed=$((SECONDS - start))
          {
            echo "Rust build + nextest: ${elapsed}s"
            echo "Runner: $RUNNER_NAME; jobs: $CARGO_BUILD_JOBS; cache key: $CACHE_KEY"
            echo "Target cache: $CARGO_TARGET_DIR"
            echo 'For proof, compare the same commit, inputs and VM: a fresh cache key (cold), then reuse it (warm). Warm must take <=50% of cold.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
