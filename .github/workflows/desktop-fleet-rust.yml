name: Desktop Rust (hosted)

on:
  pull_request:
    paths:
      - 'rust/**'
      # Desktop Rust CI always runs `npm --prefix web ci` + `build`, then
      # `rust/scripts/build-desktop-manifest.py`, which hashes built artifacts under
      # web/apps/{web,server} and web/packages/{contracts,domain} plus root lockfiles.
      # Contracts/domain/server builds extend web/tsconfig.base.json and invoke
      # web/scripts/atomic-package-build.mjs (no other web/scripts participate in
      # `npm run build`). `pp-compat` embeds that manifest; `pp-contracts` tests read
      # web/packages/contracts/test-fixtures. Omit unrelated web-only paths (e.g.
      # knip/eslint config) so ordinary web PRs do not always pay for a full Rust job.
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/tsconfig.base.json'
      - 'web/scripts/atomic-package-build.mjs'
      - 'web/apps/**'
      - 'web/packages/**'
      - '.github/workflows/desktop-fleet-rust.yml'
  workflow_dispatch:
    inputs:
      build_jobs:
        description: Cargo build jobs (repository variable or default 6)

permissions:
  contents: read

env:
  # Linux-only sccache + mold for the Rust jobs (GRE-533). Set repository variable
  # FLEET_RUST_ACCEL=off to disable both without a workflow change.
  FLEET_RUST_ACCEL: ${{ vars.FLEET_RUST_ACCEL || 'on' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-partition-1:
    name: Rust partition (1/2)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: ${{ inputs.build_jobs || vars.CARGO_BUILD_JOBS || '6' }}
      PARTITION: '1'
    steps: &rust-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Find Rust workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f rust/Cargo.toml ]]; then
            echo 'manifest=rust/Cargo.toml' >> "$GITHUB_OUTPUT"
          else
            echo 'No Rust workspace (rust/Cargo.toml); skipping.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.workspace.outputs.manifest != ''
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: steps.workspace.outputs.manifest != ''
        with:
          tool: nextest
      - name: Install Linux desktop dependencies
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Install sccache and mold
        if: steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: sccache
      - name: Install mold linker
        if: steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        shell: bash
        run: sudo apt-get install -y --no-install-recommends mold
      - name: Restore sccache directory
        if: steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Enable sccache and mold for Rust
        if: steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.workspace.outputs.manifest != ''
        with:
          node-version: '24.21.0'
      - name: Build desktop assets and generate measured manifest
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
        run: |
          set -euo pipefail
          sudo ln -sf "$(command -v node)" /usr/bin/node
          test "$(/usr/bin/node --version)" = v24.21.0
          npm --prefix web ci
          npm --prefix web run build
          python3 rust/scripts/build-desktop-manifest.py --web web --node /usr/bin/node --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      - name: Build Rust
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        env:
          MANIFEST: ${{ steps.workspace.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$CARGO_BUILD_JOBS" =~ ^[1-9][0-9]*$ ]] || { echo 'build_jobs must be a positive integer'; exit 1; }
          start=$SECONDS
          cargo build --workspace --locked --manifest-path "$MANIFEST"
          elapsed=$((SECONDS - start))
          {
            echo "Rust build: ${elapsed}s"
            echo "Runner: $RUNNER_NAME; jobs: $CARGO_BUILD_JOBS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test Rust with nextest
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        env:
          MANIFEST: ${{ steps.workspace.outputs.manifest }}
          # Snapshots are reviewed and committed locally; CI must never accept them.
          INSTA_UPDATE: 'no'
        run: |
          set -euo pipefail
          start=$SECONDS
          cargo nextest run --workspace --locked --manifest-path "$MANIFEST" --partition "count:${PARTITION}/2"
          elapsed=$((SECONDS - start))
          {
            echo "Rust nextest partition ${PARTITION}/2: ${elapsed}s"
            echo 'Target: warm Rust build + nextest <=90s per partition. Compare a cold run and warm rerun of the same commit and inputs.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report sccache stats
        if: always() && steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '```'; sccache --show-stats; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            sccache --stop-server || true
          fi

  rust-partition-2:
    name: Rust partition (2/2)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: ${{ inputs.build_jobs || vars.CARGO_BUILD_JOBS || '6' }}
      PARTITION: '2'
    steps: *rust-steps

  # Explicit dependencies preserve each result when only one partition is rerun.
  rust:
    needs: [rust-partition-1, rust-partition-2]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Rust partitions
        env:
          PARTITION_1_RESULT: ${{ needs.rust-partition-1.result }}
          PARTITION_2_RESULT: ${{ needs.rust-partition-2.result }}
        run: test "$PARTITION_1_RESULT" = success && test "$PARTITION_2_RESULT" = success

  macos-storage-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - name: Install locked dependencies and build measured desktop assets
        shell: bash
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web rebuild better-sqlite3
          cargo fetch --locked --manifest-path rust/Cargo.toml
          npm --prefix web run build
          echo "PP_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python3 rust/scripts/build-desktop-manifest.py --web web --node "$(command -v node)" --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      - name: Verify macOS identity and core-death storage gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --lib
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --test runtime_m0 core_death_with_live_child_refuses_standalone_node -- --exact --nocapture
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --test runtime_m0 dead_core_marker_without_child_info_allows_start -- --exact
          npm --prefix web run test -w @print-partner/server -- src/desktop-context.test.ts
