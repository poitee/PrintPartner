name: Desktop Rust (hosted)

# Builds and tests run once, in Rust cross-OS. This workflow only runs the
# ast-grep ratchet, which reads Rust sources and the rules under rust/.
on:
  pull_request:
    paths: &fleet-paths
      - 'rust/**'
      - '.github/workflows/desktop-fleet-rust.yml'
  # Same inputs on main, so a merge of two individually green PRs gets checked.
  push:
    branches: [main]
    paths: *fleet-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ast-grep:
    name: ast-grep ratchet
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: ast-grep@0.50.0
      - name: Check Rust ast-grep ratchet
        env:
          # A main push compares against the main it replaced, not a newer main
          # that may have lowered the baseline since.
          RATCHET_BASE: ${{ github.event_name == 'push' && github.event.before || 'refs/heads/main' }}
        run: |
          git fetch --no-tags --depth=1 origin "+$RATCHET_BASE:refs/remotes/origin/main"
          ast-grep test --config rust/sgconfig.yml --skip-snapshot-tests
          python3 -m unittest discover -s rust/scripts -p 'test_ast_grep.py' -v
          python3 rust/scripts/check-ast-grep.py
