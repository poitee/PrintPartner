name: Desktop Rust (hosted)

on:
  pull_request:
    paths:
      - 'rust/**'
      # Desktop Rust CI always runs `npm --prefix web ci` + `build`, then
      # `rust/scripts/build-desktop-manifest.py`, which hashes built artifacts under
      # web/apps/{web,server} and web/packages/{contracts,domain} plus root lockfiles.
      # Contracts/domain/server builds extend web/tsconfig.base.json and invoke
      # web/scripts/atomic-package-build.mjs (no other web/scripts participate in
      # `npm run build`). `pp-compat` embeds that manifest; `pp-contracts` tests read
      # web/packages/contracts/test-fixtures. Omit unrelated web-only paths (e.g.
      # knip/eslint config) so ordinary web PRs do not always pay for a full Rust job.
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/tsconfig.base.json'
      - 'web/scripts/atomic-package-build.mjs'
      - 'web/scripts/storage-fixtures/**'
      - 'web/apps/**'
      - 'web/packages/**'
      - '.github/workflows/desktop-fleet-rust.yml'
  workflow_dispatch:
    inputs:
      build_jobs:
        description: Cargo build jobs (repository variable or default 6)

permissions:
  contents: read

env:
  # Snapshot baselines must be committed; CI must never accept or create them.
  INSTA_UPDATE: 'no'
  # Linux-only sccache + mold for the Rust jobs (GRE-533). Set repository variable
  # FLEET_RUST_ACCEL=off to disable both without a workflow change.
  FLEET_RUST_ACCEL: ${{ vars.FLEET_RUST_ACCEL || 'on' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-partition-1:
    name: Rust partition (1/2)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: ${{ inputs.build_jobs || vars.CARGO_BUILD_JOBS || '6' }}
      PARTITION: '1'
    steps: &rust-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned historical schema commits
        shell: bash
        run: rust/scripts/fetch-historical-schema-commits.sh
      - name: Find Rust workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f rust/Cargo.toml ]]; then
            echo 'manifest=rust/Cargo.toml' >> "$GITHUB_OUTPUT"
          else
            echo 'No Rust workspace (rust/Cargo.toml); skipping.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.workspace.outputs.manifest != ''
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: steps.workspace.outputs.manifest != ''
        with:
          tool: nextest@0.9.148
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: steps.workspace.outputs.manifest != '' && env.PARTITION == '1'
        with:
          tool: ast-grep@0.50.0
      - name: Check Rust ast-grep ratchet
        if: steps.workspace.outputs.manifest != '' && env.PARTITION == '1'
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          ast-grep test --config rust/sgconfig.yml --skip-snapshot-tests
          python3 -m unittest discover -s rust/scripts -p 'test_ast_grep.py' -v
          python3 rust/scripts/check-ast-grep.py
      - name: Install Linux desktop dependencies
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Install sccache and mold
        if: steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: sccache@0.18.0
      - name: Install mold linker
        if: steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        shell: bash
        run: sudo apt-get install -y --no-install-recommends mold
      - name: Restore sccache directory
        if: steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Enable sccache and mold for Rust
        if: steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache"
            echo "CARGO_INCREMENTAL=0"
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold"
          } >> "$GITHUB_ENV"
      - name: Install pinned storage-fixture Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.workspace.outputs.manifest != ''
        with:
          node-version: '22.23.3'
      - name: Record storage-fixture executable
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        run: |
          test "$(node --version)" = v22.23.3
          echo "PP_SCHEMA_PARITY_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.workspace.outputs.manifest != ''
        with:
          node-version: '24.21.0'
      - name: Build desktop assets and generate measured manifest
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
        run: |
          set -euo pipefail
          sudo ln -sf "$(command -v node)" /usr/bin/node
          test "$(/usr/bin/node --version)" = v24.21.0
          npm --prefix web ci
          npm --prefix web run build
          python3 rust/scripts/build-desktop-manifest.py --web web --node /usr/bin/node --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      - name: Build Rust
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        env:
          MANIFEST: ${{ steps.workspace.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$CARGO_BUILD_JOBS" =~ ^[1-9][0-9]*$ ]] || { echo 'build_jobs must be a positive integer'; exit 1; }
          start=$SECONDS
          cargo build --workspace --locked --manifest-path "$MANIFEST"
          elapsed=$((SECONDS - start))
          {
            echo "Rust build: ${elapsed}s"
            echo "Runner: $RUNNER_NAME; jobs: $CARGO_BUILD_JOBS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test desktop rebuild gates
        if: steps.workspace.outputs.manifest != '' && env.PARTITION == '1'
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-contracts --features desktop_rebuild
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-domain --features desktop_rebuild
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-source --features desktop_rebuild --test archive
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --lib features
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --test profiles
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --test job_feature_admission
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --test catalog_operations -- --test-threads=2
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --lib manifest_text -- --test-threads=2
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --lib manifest_options -- --test-threads=2
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --test manifest_options_model -- --test-threads=2
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --test build_graph_operations -- --test-threads=2
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --lib build_graph -- --test-threads=2
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --lib required_units -- --test-threads=2
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --lib read_model::context::tests::plate_overlap_budget_is_distinct_from_integrity -- --exact --test-threads=2
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --test working_draft_observation
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --lib working_drafts:: -- --test-threads=2
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage --features desktop_rebuild --doc
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --lib --features desktop_rebuild
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --test profile_interpreter --features desktop_rebuild
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --test profile_interpreter_parity --features desktop_rebuild
          cargo nextest run --locked --manifest-path rust/Cargo.toml -p pp-core --test runtime_m0 --features desktop_rebuild --no-tests=fail -E 'test(ticket_t_3_drain)' --success-output immediate
      - name: Test Rust with nextest
        if: steps.workspace.outputs.manifest != ''
        shell: bash
        env:
          MANIFEST: ${{ steps.workspace.outputs.manifest }}
          # Snapshots are reviewed and committed locally; CI must never accept them.
          INSTA_UPDATE: 'no'
        run: |
          set -euo pipefail
          start=$SECONDS
          status=0
          cargo nextest run --workspace --locked --profile ci --manifest-path "$MANIFEST" --partition "count:${PARTITION}/2" || status=$?
          elapsed=$((SECONDS - start))
          {
            echo "Rust nextest partition ${PARTITION}/2: ${elapsed}s"
            echo 'Target: warm Rust build + nextest <=90s per partition. Compare a cold run and warm rerun of the same commit and inputs.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 rust/scripts/nextest-junit-summary.py --junit rust/target/nextest/ci/junit.xml --partition "$PARTITION"
          exit "$status"
      - name: Upload nextest JUnit report
        if: always() && steps.workspace.outputs.manifest != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-junit-partition-${{ env.PARTITION }}-${{ github.run_attempt }}
          path: rust/target/nextest/ci/junit.xml
          if-no-files-found: warn
      - name: Report sccache stats
        if: always() && steps.workspace.outputs.manifest != '' && env.FLEET_RUST_ACCEL == 'on'
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '```'; sccache --show-stats; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            sccache --stop-server || true
          fi

  rust-partition-2:
    name: Rust partition (2/2)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: ${{ inputs.build_jobs || vars.CARGO_BUILD_JOBS || '6' }}
      PARTITION: '2'
    steps: *rust-steps

  # Explicit dependencies preserve each result when only one partition is rerun.
  rust:
    needs: [rust-partition-1, rust-partition-2]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Rust partitions
        env:
          PARTITION_1_RESULT: ${{ needs.rust-partition-1.result }}
          PARTITION_2_RESULT: ${{ needs.rust-partition-2.result }}
        run: test "$PARTITION_1_RESULT" = success && test "$PARTITION_2_RESULT" = success

  # macos-storage-gate moved to desktop-native-macos.yml (same job name), where it
  # runs post-merge, nightly, on `ci:macos`, and on PRs touching macOS/native paths.
