name: Rust deps weekly

on:
  schedule:
    # Weekly Monday 06:00 UTC — gardener unused-deps report (not a PR gate).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-machete:
    name: cargo-machete (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-machete@0.9.2

      - name: Run cargo-machete on rust/ (report-only)
        working-directory: rust
        run: |
          set +e
          output="$(cargo machete 2>&1)"
          status=$?
          printf '%s\n' "$output"
          {
            echo '## cargo-machete (report-only)'
            echo
            # shellcheck disable=SC2016 # literal markdown backticks for the step summary
            echo 'Pinned tool: `cargo-machete@0.9.2` (via `taiki-e/install-action`).'
            echo
            # shellcheck disable=SC2016 # literal markdown code fence, not command substitution
            echo '```text'
            printf '%s\n' "$output"
            # shellcheck disable=SC2016 # literal markdown code fence, not command substitution
            echo '```'
            echo
            if [[ "$status" -eq 0 ]]; then
              echo 'No unused dependencies reported.'
            else
              echo "Findings above (tool exit \`$status\`). Report-only: this job stays green."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Never fail the workflow — findings are for humans/gardeners.
          exit 0
