name: Main red

on:
  # No checkout and no artifacts: the job only reads run metadata and calls gh.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Actionlint
      - Auth admission freshness
      - Desktop contracts
      - Desktop embedded driver smoke
      - Desktop Rust (hosted)
      - Desktop runtime
      - Desktop WebKitGTK WebGL smoke
      - Native macOS bundle
      - PR evidence tests
      - Rust cross-OS
      - Validate manifests
      - Web CI
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: main-red-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
    steps:
      - name: Rerun failed jobs once
        if: github.event.workflow_run.run_attempt == 1
        run: gh run rerun "$RUN_ID" --failed

      - name: Open or update the main-red issue
        if: github.event.workflow_run.run_attempt >= 2
        run: |
          set -euo pipefail
          failing=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"')
          body=$(printf '%s\n' \
            "**Workflow:** $WORKFLOW_NAME" \
            "**Run:** $RUN_URL (attempt $RUN_ATTEMPT)" \
            "**Head SHA:** \`$HEAD_SHA\`" \
            "" \
            "**Failing jobs:**" \
            "${failing:-- (none reported)}")

          has_label=$(gh label list --search main-red --json name --jq '[.[] | select(.name == "main-red")] | length')
          if [ "$has_label" -gt 0 ]; then
            issue=$(gh issue list --state open --label main-red --limit 1 --json number --jq '.[0].number // empty')
          else
            issue=$(gh issue list --state open --search '"[main-red]" in:title' --limit 20 --json number,title \
              --jq '[.[] | select(.title | startswith("[main-red]"))][0].number // empty')
          fi

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          elif [ "$has_label" -gt 0 ]; then
            gh issue create --title "[main-red] main is failing" --label main-red --body "$body"
          else
            gh issue create --title "[main-red] main is failing" --body "$body"
          fi
