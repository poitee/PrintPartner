name: GRE-671 lifecycle trace
on:
  workflow_dispatch:
  push:
    branches: [gre-671-supervisor-state-trace]
permissions:
  contents: read
jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '3'
      PP_GRE671_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Trace ten consecutive runs of the exact paused-clock test
        shell: bash
        run: |
          set -euo pipefail
          # launch_shell never reads the embedded release manifest.
          echo '{}' > "$RUNNER_TEMP/unused-manifest.json"
          export PP_DESKTOP_RELEASE_MANIFEST="$RUNNER_TEMP/unused-manifest.json"
          for iteration in {1..10}; do
            echo "GRE-671 iteration $iteration/10" | tee -a gre671-trace.log
            cargo test --locked --manifest-path rust/Cargo.toml -p pp-compat ticket_t_2::ticket_t_2_process_exit_obeys_every_backoff_deadline_and_cap -- --exact --nocapture 2>&1 | tee -a gre671-trace.log
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gre671-trace-${{ matrix.os }}
          path: gre671-trace.log
