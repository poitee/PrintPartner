name: PR evidence

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr-body:
    name: Lint Evidence block
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","pp-local"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Stack bases may predate the checker. Use default-branch tooling.
          # The pull_request workflow itself remains PR-controlled. See
          # docs/development/pr-evidence-trust.md for the trust assessment.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Verify Node version
        run: test "$(node --version)" = "v22.23.3"
      - name: Unit-test PR evidence lint
        run: node --test scripts/lint-pr-evidence.test.mjs
      - name: Lint pull request Evidence block
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/lint-pr-evidence.mjs
