name: PR evidence

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-pr-body:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Lint Evidence block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept previously linted merge group
        if: github.event_name == 'merge_group'
        run: echo "Evidence was already linted on the pull request. Merge group check passed."
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Stack bases may predate the checker. Use default-branch tooling.
          # The pull_request workflow itself remains PR-controlled. See
          # docs/development/pr-evidence-trust.md for the trust assessment.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Verify Node version
        run: test "$(node --version)" = "v22.23.3"
      - name: Lint pull request Evidence block
        # Dependabot bodies are generated and carry no Evidence block. Every other PR is linted.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/lint-pr-evidence.mjs
