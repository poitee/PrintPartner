name: Ephemeral Windows Rust smoke
on:
  push:
    branches:
      - ci/runner-smoke-win
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: no
jobs:
  rust-windows:
    name: rust (windows)
    runs-on:
      - self-hosted
      - windows
      - x64
      - pp-local-win
    env:
      RUST_OS: windows
      CARGO_SCOPE: --workspace --exclude pp-storage --exclude pp-source --exclude
        pp-compat --exclude pp-core --exclude pp-api --exclude pp-gateway
        --exclude pp-server --exclude pp-desktop
      NEXTEST_FILTER: all()
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: e033218948f550c1ced759fc9fd4eb56b1f30ab2
      - name: Set up ephemeral Linux prerequisites
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        run: bash "$GITHUB_WORKSPACE/scripts/setup-ci-linux.sh"
      - name: Prepare Python tool cache for the VM user
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        run: |
          sudo mkdir -p /Users/runner/hostedtoolcache
          sudo chown "$(id -un):$(id -gn)" /Users/runner/hostedtoolcache
      - name: Set up Python 3.12 on ephemeral macOS
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify macOS manifest Python
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        env:
          MANIFEST_PYTHON: ${{ steps.py.outputs.python-path }}
        run: >
          "$MANIFEST_PYTHON" -c 'import hashlib, sys; assert sys.version_info >=
          (3, 11); assert hasattr(hashlib, "file_digest"); print(sys.executable,
          sys.version)'

          python3 -c 'import hashlib, sys; assert sys.version_info >= (3, 11);
          assert hasattr(hashlib, "file_digest")'
      - name: Verify preinstalled Python on ephemeral Windows
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        id: py-windows
        run: >
          py -3.13 --version

          py -3.13 -c 'import hashlib, sys; assert sys.version_info >= (3, 11);
          assert hasattr(hashlib, "file_digest"); print("python-path=" +
          sys.executable)' >> "$GITHUB_OUTPUT"
      - name: Set up Rust on ephemeral runners
        if: runner.environment == 'self-hosted'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Fetch pinned historical schema commits
        run: rust/scripts/fetch-historical-schema-commits.sh
      - name: Install the pinned toolchain from rust-toolchain.toml
        id: toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: nextest@0.9.148
      - name: Install Linux desktop dependencies
        if: env.RUST_OS == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Install pinned storage-fixture Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
      - name: Record storage-fixture executable
        run: >
          test "$(node --version)" = v22.23.3

          echo "PP_SCHEMA_PARITY_NODE=$(node -p process.execPath)" >>
          "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Build desktop assets and generate measured manifest
        id: assets
        env:
          VITE_PRINT_PARTNER_DESKTOP: "1"
          MANIFEST_PYTHON: ${{ steps.py.outputs.python-path ||
            steps.py-windows.outputs.python-path || 'python3' }}
        run: >
          set -euo pipefail

          node_path=$(node -p process.execPath)

          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo ln -sf "$node_path" /usr/bin/node
          fi

          echo "PP_TEST_NODE=$node_path" >> "$GITHUB_ENV"

          npm --prefix web ci

          npm --prefix web run build

          "$MANIFEST_PYTHON" rust/scripts/build-desktop-manifest.py --web web
          --node "$node_path" --output rust/bundle-manifest.json --commit
          "$GITHUB_SHA"
      - name: Mount a short case-sensitive TMPDIR
        if: env.RUST_OS == 'macos'
        run: >
          set -euo pipefail

          hdiutil create -size 8g -type SPARSE -fs 'Case-sensitive APFS'
          -volname pptmp "$RUNNER_TEMP/pptmp.sparseimage"

          hdiutil attach -nobrowse -owners on "$RUNNER_TEMP/pptmp.sparseimage"

          mkdir /Volumes/pptmp/tmp

          echo 'TMPDIR=/Volumes/pptmp/tmp' >> "$GITHUB_ENV"
      - name: cargo fmt
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: clippy (desktop_rebuild off)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        run: cargo clippy --manifest-path rust/Cargo.toml --locked ${{ env.CARGO_SCOPE
          }} --all-targets --keep-going -- -D warnings
      - name: clippy (desktop_rebuild on)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' && (env.RUST_OS !=
          'macos' || github.event_name != 'pull_request') }}
        run: cargo clippy --manifest-path rust/Cargo.toml --locked ${{ env.CARGO_SCOPE
          }} --all-targets --keep-going --features desktop_rebuild -- -D
          warnings
      - name: nextest (desktop_rebuild off)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        run: cargo nextest run --manifest-path rust/Cargo.toml --locked ${{
          env.CARGO_SCOPE }} --no-fail-fast -E "$NEXTEST_FILTER"
      - name: nextest (desktop_rebuild on)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' && (env.RUST_OS !=
          'macos' || github.event_name != 'pull_request') }}
        run: cargo nextest run --manifest-path rust/Cargo.toml --locked ${{
          env.CARGO_SCOPE }} --no-fail-fast -E "$NEXTEST_FILTER" --features
          desktop_rebuild
      - name: doctests (desktop_rebuild off)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        run: cargo test --manifest-path rust/Cargo.toml --locked ${{ env.CARGO_SCOPE }}
          --no-fail-fast --doc
      - name: doctests (desktop_rebuild on)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' && (env.RUST_OS !=
          'macos' || github.event_name != 'pull_request') }}
        run: cargo test --manifest-path rust/Cargo.toml --locked ${{ env.CARGO_SCOPE }}
          --no-fail-fast --doc --features desktop_rebuild
