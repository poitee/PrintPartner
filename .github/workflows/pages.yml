# Deploy the project landing page to GitHub Pages.
# Enable: Settings → Pages → Source → GitHub Actions
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/logo.png"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage landing page
        run: |
          mkdir -p _site/screenshots
          cp docs/index.html docs/logo.png _site/
          cp -a docs/screenshots/light docs/screenshots/dark _site/screenshots/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
