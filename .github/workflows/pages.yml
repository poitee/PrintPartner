# Deploy the project landing page to GitHub Pages.
# Enable: Settings → Pages → Source → GitHub Actions
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/logo.png"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage landing page
        run: |
          mkdir -p _site/screenshots
          cp docs/index.html docs/logo.png _site/
          cp -a docs/screenshots/light docs/screenshots/dark _site/screenshots/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
