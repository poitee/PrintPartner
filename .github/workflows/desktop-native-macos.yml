name: Native macOS bundle

on:
  workflow_dispatch:
  # No workflow-level paths filter: a PR-level `paths:` skip leaves the
  # "bundle (...)" checks absent and pending if required. The `changes` job
  # decides instead: macOS jobs conclude `skipped` (or, for server-smoke, a
  # cheap Linux stub succeeds) when they are not selected. GitHub accepts
  # `skipped` for required status checks, so PRs never hang on them.
  #
  # Runner policy applies to every event; native work is selected below:
  #   - push to main, nightly, and manual dispatch select native work;
  #   - PRs only when macOS/desktop-native inputs change (arm64 only) or the
  #     PR carries the `ci:macos` label (arm64 only). Intel never runs on PRs.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, master]
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

# One run per ref: a newer push supersedes an older run (PRs and main alike).
# Nightly runs get their own group so a merge cannot cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ci-plan:
    uses: ./.github/workflows/ci-runner-plan.yml

  changes:
    needs: [ci-plan]
    if: ${{ needs.ci-plan.outputs.linux == 'true' }}
    runs-on: ${{ fromJSON(needs.ci-plan.outputs.linux-runner) }}
    timeout-minutes: 10
    outputs:
      native: ${{ steps.select.outputs.native }}
      # 'true' when any macOS job should do real work in this run.
      macos: ${{ steps.plan.outputs.macos }}
      # 'true' only off-PR (push to main, nightly, dispatch).
      intel: ${{ steps.plan.outputs.intel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select native macOS inputs
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m unittest discover -s scripts -p test_macos_bundle_path_filter.py
          python3 -m unittest discover -s scripts -p test_ci_runner_policy.py
          python3 scripts/macos-bundle-path-filter.py
      - name: Decide which macOS jobs run
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          NATIVE: ${{ steps.select.outputs.native }}
          HAS_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            macos=true intel=true
          elif [[ "$HAS_LABEL" == true || "$NATIVE" != false ]]; then
            # Fail open: an unknown selection still runs arm64.
            macos=true intel=false
          else
            macos=false intel=false
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "intel=$intel" >> "$GITHUB_OUTPUT"
          echo "macOS jobs: $macos (intel: $intel; native inputs: $NATIVE; ci:macos label: $HAS_LABEL)" >> "$GITHUB_STEP_SUMMARY"

  # Fast Linux gate: macOS runners only start once the shared web build and
  # filter tests pass, so doomed commits never burn a macOS queue slot.
  linux-precheck:
    needs: [ci-plan, changes]
    if: ${{ (needs.changes.outputs.macos != 'false') && needs.ci-plan.outputs.linux == 'true' }}
    runs-on: ${{ fromJSON(needs.ci-plan.outputs.linux-runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build desktop web assets on Linux
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          git diff --exit-code -- web/package-lock.json

  server-smoke:
    needs: [ci-plan, changes, linux-precheck]
    if: ${{ (!cancelled() && (needs.changes.outputs.macos == 'false' || needs.linux-precheck.result == 'success')) && ((needs.changes.outputs.macos == 'false' && needs.ci-plan.outputs.linux == 'true') || (needs.changes.outputs.macos != 'false' && needs.ci-plan.outputs.macos == 'true')) }}
    runs-on: ${{ fromJSON(needs.changes.outputs.macos != 'false' && needs.ci-plan.outputs.macos-runner || needs.ci-plan.outputs.linux-runner) }}
    # Report a status on a cheap runner when macOS work is not selected.
    # Unknown/failed selection still runs the full macOS smoke.
    timeout-minutes: 30
    env:
      VITE_PRINT_PARTNER_DESKTOP: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test leftover-process probe status handling
        run: |
          set -euo pipefail
          bash rust/scripts/workflow-smoke-pgrep-test.sh
      - name: Skip native server smoke (no native inputs changed)
        if: needs.changes.outputs.macos == 'false'
        run: echo "No native inputs changed; macOS pp-server smoke skipped." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.macos != 'false'
        with:
          node-version: '24.21.0'
          architecture: arm64
      - name: Build desktop assets and pp-server
        if: needs.changes.outputs.macos != 'false'
        run: |
          set -euo pipefail
          export PP_EVIDENCE="$RUNNER_TEMP/server-smoke-evidence"
          echo "PP_EVIDENCE=$PP_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$PP_EVIDENCE"
          sw_vers > "$PP_EVIDENCE/runner.txt"
          uname -a >> "$PP_EVIDENCE/runner.txt"
          test "$(uname -m)" = arm64
          rustup toolchain install 1.99.0 --profile minimal
          rustc --version --verbose > "$PP_EVIDENCE/rust-version.txt"
          test "$(node -p process.version)" = v24.21.0
          npm --prefix web ci 2>&1 | tee "$PP_EVIDENCE/npm-ci.log"
          npm --prefix web run build 2>&1 | tee "$PP_EVIDENCE/desktop-build.log"
          python3 rust/scripts/build-desktop-manifest.py --web web --node "$(command -v node)" --output rust/bundle-manifest.json --commit "$GITHUB_SHA" 2>&1 | tee "$PP_EVIDENCE/manifest.log"
          cargo build --manifest-path rust/Cargo.toml --locked -p pp-server 2>&1 | tee "$PP_EVIDENCE/server-build.log"
          git diff --exit-code -- rust/Cargo.lock web/package-lock.json
      - name: Smoke pp-server on loopback
        if: needs.changes.outputs.macos != 'false'
        run: |
          set -euo pipefail
          bash rust/scripts/workflow-smoke.sh rust/target/debug/pp-server "$(command -v node)" 2>&1 | tee "$PP_EVIDENCE/workflow-smoke.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.changes.outputs.macos != 'false' }}
        with:
          name: native-macos-server-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/server-smoke-evidence/
          if-no-files-found: ignore
          retention-days: 14

  bundle:
    needs: [ci-plan, changes, linux-precheck]
    if: ${{ (!cancelled() && needs.changes.outputs.macos != 'false' && needs.linux-precheck.result == 'success') && needs.ci-plan.outputs.macos == 'true' }}
    runs-on: ${{ fromJSON(needs.ci-plan.outputs.macos-runner) }}
    # Explicit architecture jobs keep both check names present even when skipped.
    name: bundle (macos-26, arm64, arm64, aarch64-apple-darwin, ee35ee364a0c626df7852d9a5bc0c5394b6440772e9...
    # Honor concurrency cancellation and require an approved runner.
    timeout-minutes: 90
    env:
      ARCH: arm64
      NODE_ARCH: arm64
      RUST_HOST: aarch64-apple-darwin
      TAURI_CLI_SHA256: ee35ee364a0c626df7852d9a5bc0c5394b6440772e9864cfb9b11dcb8d33f527
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      VITE_PRINT_PARTNER_DESKTOP: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      npm_config_build_from_source: 'true'
    steps: &bundle-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record runner and check parser controls
        run: |
          export PP_EVIDENCE="$RUNNER_TEMP/desktop-evidence"
          echo "PP_EVIDENCE=$PP_EVIDENCE" >> "$GITHUB_ENV"
          echo "PP_DESKTOP_STAGE=$RUNNER_TEMP/desktop-stage" >> "$GITHUB_ENV"
          mkdir -p "$PP_EVIDENCE"
          {
            sw_vers
            uname -a
            df -h
            xcodebuild -version
          } > "$PP_EVIDENCE/runner.txt"
          test "$(uname -m)" = '${{ env.ARCH }}'
          python3 rust/scripts/check-macos-bundle.py --self-test 2>&1 | tee "$PP_EVIDENCE/self-tests.log"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: ${{ env.NODE_ARCH }}
      - name: Install pinned Rust and Tauri CLI
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustc --version --verbose | tee "$PP_EVIDENCE/rust-version.txt"
          test "$(rustc --version --verbose | sed -n 's/^host: //p')" = '${{ env.RUST_HOST }}'
          cli_archive="$RUNNER_TEMP/cargo-tauri.zip"
          curl --fail --location --retry 3 --output "$cli_archive" \
            'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.1/cargo-tauri-${{ env.RUST_HOST }}.zip'
          printf '%s  %s\n' '${{ env.TAURI_CLI_SHA256 }}' "$cli_archive" \
            | shasum -a 256 -c - | tee "$PP_EVIDENCE/tauri-install.log"
          mkdir -p "$RUNNER_TEMP/tauri-cli/bin"
          unzip -q "$cli_archive" -d "$RUNNER_TEMP/tauri-cli/bin"
          chmod +x "$RUNNER_TEMP/tauri-cli/bin/cargo-tauri"
          "$RUNNER_TEMP/tauri-cli/bin/cargo-tauri" --version \
            | tee "$PP_EVIDENCE/tauri-version.txt"
          grep -Fx 'tauri-cli 2.12.1' "$PP_EVIDENCE/tauri-version.txt"
          echo "$RUNNER_TEMP/tauri-cli/bin" >> "$GITHUB_PATH"
      - name: Build desktop React and target-native production modules
        run: |
          node -p 'JSON.stringify({node:process.version,abi:process.versions.modules,os:process.platform,arch:process.arch})' | tee "$PP_EVIDENCE/node-version.json"
          test "$(node -p process.arch)" = '${{ env.NODE_ARCH }}'
          test "$(node -p process.version)" = v24.21.0
          test "$(node -p process.versions.modules)" = 137
          npm --version > "$PP_EVIDENCE/npm-version.txt"
          npm --prefix web ci 2>&1 | tee "$PP_EVIDENCE/npm-ci.log"
          npm --prefix web run build 2>&1 | tee "$PP_EVIDENCE/react-build.log"
          git diff --exit-code -- web/package-lock.json
      - name: Measure completed native stage
        run: |
          python3 rust/scripts/stage-desktop.py --web web --node "$(command -v node)" --output "$PP_DESKTOP_STAGE" --commit "$GITHUB_SHA" 2>&1 | tee "$PP_EVIDENCE/stage.log"
          cp "$PP_DESKTOP_STAGE/bundle-manifest.json" "$PP_EVIDENCE/bundle-manifest.json"
          cp "$PP_DESKTOP_STAGE/bundle-config.json" "$PP_EVIDENCE/bundle-config.json"
          cp "$PP_DESKTOP_STAGE/Resources/desktop-runtime/release.json" "$PP_EVIDENCE/release.json"
          shasum -a 256 "$PP_EVIDENCE/bundle-manifest.json" > "$PP_EVIDENCE/manifest.sha256"
      - name: Assemble one unsigned app with the measured inventory
        run: |
          cargo tauri --version | tee "$PP_EVIDENCE/tauri-version.txt"
          cargo fetch --manifest-path rust/Cargo.toml --locked 2>&1 | tee "$PP_EVIDENCE/cargo-fetch.log"
          CARGO_NET_OFFLINE=true bash rust/scripts/desktop-bundle.sh 2>&1 | tee "$PP_EVIDENCE/bundle-build.log"
          cmp "$PP_EVIDENCE/bundle-manifest.json" "$PP_DESKTOP_STAGE/bundle-manifest.json"
          git diff --exit-code -- rust/Cargo.lock
      - name: Verify bundled compatibility lifecycle
        run: |
          set -o pipefail
          app="$GITHUB_WORKSPACE/rust/target/release/bundle/macos/Print Partner.app"
          PP_DESKTOP_RELEASE_MANIFEST="$PP_DESKTOP_STAGE/bundle-manifest.json" \
          PP_COMPAT_BUNDLE_CONTENTS="$app/Contents" \
          PP_COMPAT_TEST_DATA_DIR="$RUNNER_TEMP/compat-data" \
          PP_COMPAT_TEST_RUNTIME_DIR="$RUNNER_TEMP/compat-runtime" \
          PP_COMPAT_TEST_RECEIPT="$PP_EVIDENCE/compat-lifecycle.json" \
          CARGO_NET_OFFLINE=true cargo test --manifest-path rust/Cargo.toml \
            -p pp-compat --test installed_bundle_lifecycle \
            -- --ignored --exact installed_bundle_start_health_shutdown --nocapture \
            2>&1 | tee "$PP_EVIDENCE/compat-lifecycle.log"
          python3 - "$PP_EVIDENCE/compat-lifecycle.json" "$GITHUB_SHA" <<'PY'
          import json
          import pathlib
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if receipt.get('status') != 'passed' or receipt.get('source_commit') != sys.argv[2]:
              raise SystemExit('Compatibility lifecycle receipt identity mismatch')
          if receipt.get('shutdown') != 'stopped_with_observed_accepted_exit':
              raise SystemExit('Compatibility lifecycle shutdown was not observed')
          if not receipt.get('child_pid_absent') or not receipt.get('runtime_socket_absent'):
              raise SystemExit('Compatibility lifecycle cleanup is incomplete')
          PY
      - name: Verify installed app and relocated copy
        run: |
          app="$GITHUB_WORKSPACE/rust/target/release/bundle/macos/Print Partner.app"
          python3 rust/scripts/check-macos-bundle.py --app "$app" --manifest "$PP_EVIDENCE/bundle-manifest.json" --arch '${{ env.ARCH }}' --receipt "$PP_EVIDENCE/bundle-verifier.json" 2>&1 | tee "$PP_EVIDENCE/bundle-verifier.log"
          mkdir -p "$RUNNER_TEMP/relocated app"
          relocated="$RUNNER_TEMP/relocated app/Print Partner.app"
          ditto "$app" "$relocated"
          python3 rust/scripts/check-macos-bundle.py --app "$relocated" --manifest "$PP_EVIDENCE/bundle-manifest.json" --arch '${{ env.ARCH }}' --receipt "$PP_EVIDENCE/relocation-verifier.json" 2>&1 | tee "$PP_EVIDENCE/relocation-verifier.log"
          cmp "$PP_EVIDENCE/bundle-manifest.json" "$PP_DESKTOP_STAGE/bundle-manifest.json"
      - name: Preserve available bundle and receipts
        if: ${{ !cancelled() }}
        run: |
          export PP_EVIDENCE="$RUNNER_TEMP/desktop-evidence"
          export PP_DESKTOP_STAGE="$RUNNER_TEMP/desktop-stage"
          mkdir -p "$PP_EVIDENCE"
          app="$GITHUB_WORKSPACE/rust/target/release/bundle/macos/Print Partner.app"
          if test -d "$app"; then
            tar -czf "$PP_EVIDENCE/Print-Partner-${{ env.ARCH }}-unsigned.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
          fi
          if test -f "$PP_DESKTOP_STAGE/bundle-manifest.json"; then
            cp "$PP_DESKTOP_STAGE/bundle-manifest.json" "$PP_EVIDENCE/stage-manifest-after-build.json"
          fi
          git diff -- rust/Cargo.lock web/package-lock.json > "$PP_EVIDENCE/lockfile-diff.patch"
          df -h > "$PP_EVIDENCE/storage-after.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-macos-${{ env.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  bundle-intel:
    needs: [ci-plan, changes, linux-precheck]
    if: ${{ (!cancelled() && needs.changes.outputs.intel == 'true' && needs.linux-precheck.result == 'success') && needs.ci-plan.outputs.intel == 'true' }}
    runs-on: macos-26-intel
    name: bundle (macos-26-intel, x86_64, x64, x86_64-apple-darwin, e5386ba6dadc3fbbdcf46c1f95b700f28caf03d...
    # Intel is post-merge only: push to main, nightly, dispatch.
    timeout-minutes: 90
    env:
      ARCH: x86_64
      NODE_ARCH: x64
      RUST_HOST: x86_64-apple-darwin
      TAURI_CLI_SHA256: e5386ba6dadc3fbbdcf46c1f95b700f28caf03db979de50a29adb872022b4a57
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      VITE_PRINT_PARTNER_DESKTOP: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      npm_config_build_from_source: 'true'
    steps: *bundle-steps

  macos-storage-gate:
    needs: [ci-plan, changes, linux-precheck]
    if: ${{ (!cancelled() && needs.changes.outputs.macos != 'false' && needs.linux-precheck.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || needs.ci-plan.outputs.hosted == 'true')) && needs.ci-plan.outputs.macos == 'true' }}
    runs-on: ${{ fromJSON(needs.ci-plan.outputs.macos-runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned historical schema commits
        shell: bash
        run: rust/scripts/fetch-historical-schema-commits.sh
      - name: Install pinned storage-fixture Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Record storage-fixture executable
        shell: bash
        run: |
          test "$(node --version)" = v22.23.3
          echo "PP_SCHEMA_PARITY_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest
      - name: Verify source Unicode and case regressions on macOS
        shell: bash
        run: |
          set -euo pipefail
          # Intact legacy snapshots can contain names that default APFS aliases.
          # Keep their bytes distinct so the suite exercises migration policy.
          fixture_root=$(mktemp -d "$RUNNER_TEMP/pp-source-case.XXXXXX")
          fixture_mount="$fixture_root/mount"
          mkdir "$fixture_mount"
          # One archive test retains two 256 MiB copies alongside parallel fixtures.
          hdiutil create -size 4g -type SPARSE -fs 'Case-sensitive APFS' \
            -volname pp-source-fixtures "$fixture_root/fixtures.sparseimage"
          hdiutil attach -nobrowse -owners on -mountpoint "$fixture_mount" \
            "$fixture_root/fixtures.sparseimage"
          trap 'hdiutil detach "$fixture_mount"' EXIT
          df -h "$fixture_mount"
          mkdir "$fixture_mount/tmp"
          TMPDIR="$fixture_mount/tmp" cargo nextest run --locked --manifest-path rust/Cargo.toml -p pp-source
      - name: Install locked dependencies and build measured desktop assets
        shell: bash
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web rebuild better-sqlite3
          cargo fetch --locked --manifest-path rust/Cargo.toml
          npm --prefix web run build
          echo "PP_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python3 rust/scripts/build-desktop-manifest.py --web web --node "$(command -v node)" --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      - name: Verify macOS identity and core-death storage gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --lib
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --test runtime_m0 core_death_with_live_child_refuses_standalone_node -- --exact --nocapture
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --test runtime_m0 dead_core_marker_without_child_info_allows_start -- --exact
          npm --prefix web run test -w @print-partner/server -- src/desktop-context.test.ts
