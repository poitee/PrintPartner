name: Native macOS bundle

on:
  workflow_dispatch:
  # Job conditions keep skipped check reports present. Hosted macOS runs on
  # ready PRs only with the macos label and relevant changed paths. Main, merge groups, nightly and manual
  # runs select every macOS job, including Intel, regardless of changed paths.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  push:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

# Superseded PR runs cancel; every non-PR run has its own group.
concurrency:
  group: native-macos-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      # 'true' when any macOS job should do real work in this run.
      macos: ${{ steps.plan.outputs.macos }}
      # 'true' only off-PR (push to main, nightly, dispatch).
      intel: ${{ steps.plan.outputs.intel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed inputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-path-filter.py native
      - name: Decide which macOS jobs run
        id: plan
        shell: bash
        env:
          RELEVANT: ${{ steps.select.outputs.relevant }}
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'macos') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            macos=true intel=true
          elif [[ "$HAS_LABEL" == true && "$IS_DRAFT" == false && "$RELEVANT" != false ]]; then
            macos=true intel=false
          else
            macos=false intel=false
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "intel=$intel" >> "$GITHUB_OUTPUT"
          echo "macOS jobs: $macos (intel: $intel; macos label: $HAS_LABEL; draft: $IS_DRAFT)" >> "$GITHUB_STEP_SUMMARY"

  # Fast Linux gate: macOS runners only start once the shared web build passes,
  # so doomed commits never burn a macOS queue slot.
  linux-precheck:
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","pp-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ephemeral Linux prerequisites
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        run: bash "$GITHUB_WORKSPACE/scripts/setup-ci-linux.sh"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Node runtime
        run: test "$(node --version)" = "v24.21.0"
      - name: Build desktop web assets on Linux
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          git diff --exit-code -- web/package-lock.json

  server-smoke:
    needs: [changes, linux-precheck]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'macos'))) && needs.changes.outputs.macos == 'true' && needs.linux-precheck.result == 'success' }}
    concurrency:
      group: native-macos-server-smoke-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macos","arm64","pp-local-mac"]') || 'macos-26' }}
    timeout-minutes: 30
    env:
      VITE_PRINT_PARTNER_DESKTOP: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Python tool cache for the VM user
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        run: |
          sudo mkdir -p /Users/runner/hostedtoolcache
          sudo chown "$(id -un):$(id -gn)" /Users/runner/hostedtoolcache
      - name: Set up Python 3.12 on ephemeral macOS
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify macOS manifest Python
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        env:
          MANIFEST_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          "$MANIFEST_PYTHON" -c 'import hashlib, sys; assert sys.version_info >= (3, 11); assert hasattr(hashlib, "file_digest"); print(sys.executable, sys.version)'
          python3 -c 'import hashlib, sys; assert sys.version_info >= (3, 11); assert hasattr(hashlib, "file_digest")'
      - name: Set up Rust on ephemeral runners
        if: runner.environment == 'self-hosted'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - name: Test leftover-process probe status handling
        run: |
          set -euo pipefail
          bash rust/scripts/workflow-smoke-pgrep-test.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: arm64
      - name: Verify Node runtime
        run: test "$(node --version)" = "v24.21.0"
      - name: Build desktop assets and pp-server
        run: |
          set -euo pipefail
          export PP_EVIDENCE="$RUNNER_TEMP/server-smoke-evidence"
          echo "PP_EVIDENCE=$PP_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$PP_EVIDENCE"
          sw_vers > "$PP_EVIDENCE/runner.txt"
          uname -a >> "$PP_EVIDENCE/runner.txt"
          test "$(uname -m)" = arm64
          rustup toolchain install 1.99.0 --profile minimal
          rustc --version --verbose > "$PP_EVIDENCE/rust-version.txt"
          test "$(node -p process.version)" = v24.21.0
          npm --prefix web ci 2>&1 | tee "$PP_EVIDENCE/npm-ci.log"
          npm --prefix web run build 2>&1 | tee "$PP_EVIDENCE/desktop-build.log"
          python3 rust/scripts/build-desktop-manifest.py --web web --node "$(command -v node)" --output rust/bundle-manifest.json --commit "$GITHUB_SHA" 2>&1 | tee "$PP_EVIDENCE/manifest.log"
          cargo build --manifest-path rust/Cargo.toml --locked -p pp-server 2>&1 | tee "$PP_EVIDENCE/server-build.log"
          git diff --exit-code -- rust/Cargo.lock web/package-lock.json
      - name: Smoke pp-server on loopback
        run: |
          set -euo pipefail
          bash rust/scripts/workflow-smoke.sh rust/target/debug/pp-server "$(command -v node)" 2>&1 | tee "$PP_EVIDENCE/workflow-smoke.log"
      - name: Prove built backend listens only on its private socket
        run: |
          set -euo pipefail
          python3 rust/tests/built_backend_listeners.py --node "$(command -v node)" --evidence "$PP_EVIDENCE/built-backend-listeners" 2>&1 | tee "$PP_EVIDENCE/built-backend-listeners.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: native-macos-server-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/server-smoke-evidence/
          if-no-files-found: ignore
          retention-days: 14

  bundle:
    # Explicit architecture jobs keep both check names present even when skipped.
    name: bundle (macos-26, arm64, arm64, aarch64-apple-darwin, ee35ee364a0c626df7852d9a5bc0c5394b6440772e9...
    needs: [changes, linux-precheck]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'macos'))) && needs.changes.outputs.macos == 'true' && needs.linux-precheck.result == 'success' }}
    concurrency:
      group: native-macos-bundle-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macos","arm64","pp-local-mac"]') || 'macos-26' }}
    timeout-minutes: 90
    env:
      ARCH: arm64
      NODE_ARCH: arm64
      RUST_HOST: aarch64-apple-darwin
      TAURI_CLI_SHA256: ee35ee364a0c626df7852d9a5bc0c5394b6440772e9864cfb9b11dcb8d33f527
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      VITE_PRINT_PARTNER_DESKTOP: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      npm_config_build_from_source: 'true'
    steps: &bundle-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Python tool cache for the VM user
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        run: |
          sudo mkdir -p /Users/runner/hostedtoolcache
          sudo chown "$(id -un):$(id -gn)" /Users/runner/hostedtoolcache
      - name: Set up Python 3.12 on ephemeral macOS
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify macOS manifest Python
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        env:
          MANIFEST_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          "$MANIFEST_PYTHON" -c 'import hashlib, sys; assert sys.version_info >= (3, 11); assert hasattr(hashlib, "file_digest"); print(sys.executable, sys.version)'
          python3 -c 'import hashlib, sys; assert sys.version_info >= (3, 11); assert hasattr(hashlib, "file_digest")'
      - name: Set up Rust on ephemeral runners
        if: runner.environment == 'self-hosted'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - name: Record runner and check parser controls
        run: |
          export PP_EVIDENCE="$RUNNER_TEMP/desktop-evidence"
          echo "PP_EVIDENCE=$PP_EVIDENCE" >> "$GITHUB_ENV"
          echo "PP_DESKTOP_STAGE=$RUNNER_TEMP/desktop-stage" >> "$GITHUB_ENV"
          mkdir -p "$PP_EVIDENCE"
          {
            sw_vers
            uname -a
            df -h
            xcodebuild -version
          } > "$PP_EVIDENCE/runner.txt"
          test "$(uname -m)" = '${{ env.ARCH }}'
          python3 rust/scripts/check-macos-bundle.py --self-test 2>&1 | tee "$PP_EVIDENCE/self-tests.log"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: ${{ env.NODE_ARCH }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Node runtime
        run: test "$(node --version)" = "v24.21.0"
      # Cached Tauri CLI archive; the pinned SHA-256 below is still verified
      # on every run, so a poisoned cache entry fails closed.
      - name: Restore Tauri CLI archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tauri-cli-cache
          key: tauri-cli-2.12.1-${{ env.RUST_HOST }}-${{ env.TAURI_CLI_SHA256 }}
      - name: Install pinned Rust and Tauri CLI
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustc --version --verbose | tee "$PP_EVIDENCE/rust-version.txt"
          test "$(rustc --version --verbose | sed -n 's/^host: //p')" = '${{ env.RUST_HOST }}'
          mkdir -p "$RUNNER_TEMP/tauri-cli-cache"
          cli_archive="$RUNNER_TEMP/tauri-cli-cache/cargo-tauri.zip"
          test -s "$cli_archive" || curl --fail --location --retry 3 --output "$cli_archive" \
            'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.1/cargo-tauri-${{ env.RUST_HOST }}.zip'
          printf '%s  %s\n' '${{ env.TAURI_CLI_SHA256 }}' "$cli_archive" \
            | shasum -a 256 -c - | tee "$PP_EVIDENCE/tauri-install.log"
          mkdir -p "$RUNNER_TEMP/tauri-cli/bin"
          unzip -q "$cli_archive" -d "$RUNNER_TEMP/tauri-cli/bin"
          chmod +x "$RUNNER_TEMP/tauri-cli/bin/cargo-tauri"
          "$RUNNER_TEMP/tauri-cli/bin/cargo-tauri" --version \
            | tee "$PP_EVIDENCE/tauri-version.txt"
          grep -Fx 'tauri-cli 2.12.1' "$PP_EVIDENCE/tauri-version.txt"
          echo "$RUNNER_TEMP/tauri-cli/bin" >> "$GITHUB_PATH"
      # Per-arch Rust cache (release target dir + registry). Saved only from
      # main/nightly so PR runs restore but never evict the shared entry.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          key: macos-bundle-${{ env.ARCH }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build desktop React and target-native production modules
        run: |
          node -p 'JSON.stringify({node:process.version,abi:process.versions.modules,os:process.platform,arch:process.arch})' | tee "$PP_EVIDENCE/node-version.json"
          test "$(node -p process.arch)" = '${{ env.NODE_ARCH }}'
          test "$(node -p process.version)" = v24.21.0
          test "$(node -p process.versions.modules)" = 137
          npm --version > "$PP_EVIDENCE/npm-version.txt"
          npm_config_nodedir="$(node -p 'require("path").dirname(require("path").dirname(process.execPath))')"
          export npm_config_nodedir
          test -f "$npm_config_nodedir/include/node/node.h"
          test -f "$npm_config_nodedir/include/node/config.gypi"
          npm --prefix web ci 2>&1 | tee "$PP_EVIDENCE/npm-ci.log"
          npm --prefix web run build 2>&1 | tee "$PP_EVIDENCE/react-build.log"
          git diff --exit-code -- web/package-lock.json
      - name: Measure completed native stage
        run: |
          python3 rust/scripts/stage-desktop.py --web web --node "$(command -v node)" --output "$PP_DESKTOP_STAGE" --commit "$GITHUB_SHA" 2>&1 | tee "$PP_EVIDENCE/stage.log"
          cp "$PP_DESKTOP_STAGE/bundle-manifest.json" "$PP_EVIDENCE/bundle-manifest.json"
          cp "$PP_DESKTOP_STAGE/bundle-config.json" "$PP_EVIDENCE/bundle-config.json"
          cp "$PP_DESKTOP_STAGE/Resources/desktop-runtime/release.json" "$PP_EVIDENCE/release.json"
          shasum -a 256 "$PP_EVIDENCE/bundle-manifest.json" > "$PP_EVIDENCE/manifest.sha256"
      - name: Assemble one unsigned app with the measured inventory
        run: |
          cargo tauri --version | tee "$PP_EVIDENCE/tauri-version.txt"
          cargo fetch --manifest-path rust/Cargo.toml --locked 2>&1 | tee "$PP_EVIDENCE/cargo-fetch.log"
          CARGO_NET_OFFLINE=true bash rust/scripts/desktop-bundle.sh 2>&1 | tee "$PP_EVIDENCE/bundle-build.log"
          cmp "$PP_EVIDENCE/bundle-manifest.json" "$PP_DESKTOP_STAGE/bundle-manifest.json"
          git diff --exit-code -- rust/Cargo.lock
      - name: Verify bundled compatibility lifecycle
        run: |
          set -o pipefail
          app="$GITHUB_WORKSPACE/rust/target/release/bundle/macos/Print Partner.app"
          PP_DESKTOP_RELEASE_MANIFEST="$PP_DESKTOP_STAGE/bundle-manifest.json" \
          PP_COMPAT_BUNDLE_CONTENTS="$app/Contents" \
          PP_COMPAT_TEST_DATA_DIR="$RUNNER_TEMP/compat-data" \
          PP_COMPAT_TEST_RUNTIME_DIR="$RUNNER_TEMP/compat-runtime" \
          PP_COMPAT_TEST_RECEIPT="$PP_EVIDENCE/compat-lifecycle.json" \
          CARGO_NET_OFFLINE=true cargo test --manifest-path rust/Cargo.toml \
            -p pp-compat --test installed_bundle_lifecycle \
            -- --ignored --exact installed_bundle_start_health_shutdown --nocapture \
            2>&1 | tee "$PP_EVIDENCE/compat-lifecycle.log"
          python3 - "$PP_EVIDENCE/compat-lifecycle.json" "$GITHUB_SHA" <<'PY'
          import json
          import pathlib
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if receipt.get('status') != 'passed' or receipt.get('source_commit') != sys.argv[2]:
              raise SystemExit('Compatibility lifecycle receipt identity mismatch')
          if receipt.get('shutdown') != 'stopped_with_observed_accepted_exit':
              raise SystemExit('Compatibility lifecycle shutdown was not observed')
          if not receipt.get('child_pid_absent') or not receipt.get('runtime_socket_absent'):
              raise SystemExit('Compatibility lifecycle cleanup is incomplete')
          PY
      - name: Verify installed app and relocated copy
        run: |
          app="$GITHUB_WORKSPACE/rust/target/release/bundle/macos/Print Partner.app"
          python3 rust/scripts/check-macos-bundle.py --app "$app" --manifest "$PP_EVIDENCE/bundle-manifest.json" --arch '${{ env.ARCH }}' --receipt "$PP_EVIDENCE/bundle-verifier.json" 2>&1 | tee "$PP_EVIDENCE/bundle-verifier.log"
          mkdir -p "$RUNNER_TEMP/relocated app"
          relocated="$RUNNER_TEMP/relocated app/Print Partner.app"
          ditto "$app" "$relocated"
          python3 rust/scripts/check-macos-bundle.py --app "$relocated" --manifest "$PP_EVIDENCE/bundle-manifest.json" --arch '${{ env.ARCH }}' --receipt "$PP_EVIDENCE/relocation-verifier.json" 2>&1 | tee "$PP_EVIDENCE/relocation-verifier.log"
          cmp "$PP_EVIDENCE/bundle-manifest.json" "$PP_DESKTOP_STAGE/bundle-manifest.json"
      - name: Preserve available bundle and receipts
        if: ${{ !cancelled() }}
        run: |
          export PP_EVIDENCE="$RUNNER_TEMP/desktop-evidence"
          export PP_DESKTOP_STAGE="$RUNNER_TEMP/desktop-stage"
          mkdir -p "$PP_EVIDENCE"
          app="$GITHUB_WORKSPACE/rust/target/release/bundle/macos/Print Partner.app"
          if test -d "$app"; then
            tar -czf "$PP_EVIDENCE/Print-Partner-${{ env.ARCH }}-unsigned.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
          fi
          if test -f "$PP_DESKTOP_STAGE/bundle-manifest.json"; then
            cp "$PP_DESKTOP_STAGE/bundle-manifest.json" "$PP_EVIDENCE/stage-manifest-after-build.json"
          fi
          git diff -- rust/Cargo.lock web/package-lock.json > "$PP_EVIDENCE/lockfile-diff.patch"
          df -h > "$PP_EVIDENCE/storage-after.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-macos-${{ env.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  bundle-intel:
    name: bundle (macos-26-intel, x86_64, x64, x86_64-apple-darwin, e5386ba6dadc3fbbdcf46c1f95b700f28caf03d...
    needs: [changes, linux-precheck]
    # Intel runs on every non-PR event, including merge groups.
    if: ${{ !cancelled() && needs.changes.outputs.intel == 'true' && needs.linux-precheck.result == 'success' }}
    concurrency:
      group: native-macos-bundle-intel-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      ARCH: x86_64
      NODE_ARCH: x64
      RUST_HOST: x86_64-apple-darwin
      TAURI_CLI_SHA256: e5386ba6dadc3fbbdcf46c1f95b700f28caf03db979de50a29adb872022b4a57
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      VITE_PRINT_PARTNER_DESKTOP: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      npm_config_build_from_source: 'true'
    steps: *bundle-steps

  macos-storage-gate:
    needs: [changes, linux-precheck]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'macos'))) && needs.changes.outputs.macos == 'true' && needs.linux-precheck.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    concurrency:
      group: native-macos-storage-gate-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macos","arm64","pp-local-mac"]') || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Python tool cache for the VM user
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        run: |
          sudo mkdir -p /Users/runner/hostedtoolcache
          sudo chown "$(id -un):$(id -gn)" /Users/runner/hostedtoolcache
      - name: Set up Python 3.12 on ephemeral macOS
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify macOS manifest Python
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        env:
          MANIFEST_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          "$MANIFEST_PYTHON" -c 'import hashlib, sys; assert sys.version_info >= (3, 11); assert hasattr(hashlib, "file_digest"); print(sys.executable, sys.version)'
          python3 -c 'import hashlib, sys; assert sys.version_info >= (3, 11); assert hasattr(hashlib, "file_digest")'
      - name: Set up Rust on ephemeral runners
        if: runner.environment == 'self-hosted'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - name: Fetch pinned historical schema commits
        shell: bash
        run: rust/scripts/fetch-historical-schema-commits.sh
      - name: Install pinned storage-fixture Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Verify Node runtime
        run: test "$(node --version)" = "v22.23.3"
      - name: Record storage-fixture executable
        shell: bash
        run: |
          test "$(node --version)" = v22.23.3
          echo "PP_SCHEMA_PARITY_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Verify Node runtime
        run: test "$(node --version)" = "v24.21.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Test owned image cleanup and native holder reporting
        run: |
          python3 scripts/test_native_image_cleanup.py -v
          for attempt in {1..10}; do
            echo "Native holder cleanup repetition $attempt/10"
            python3 scripts/test_native_image_cleanup.py CleanupTest.test_native_busy_image_reports_real_holder_before_force -v
          done
      - name: Verify source Unicode and case regressions on macOS
        shell: bash
        run: |
          set -euo pipefail
          # Intact legacy snapshots can contain names that default APFS aliases.
          # Keep their bytes distinct so the suite exercises migration policy.
          fixture_root=$(mktemp -d "$RUNNER_TEMP/pp-source-case.XXXXXX")
          fixture_mount="$fixture_root/mount"
          mkdir "$fixture_mount"
          # One archive test retains two 256 MiB copies alongside parallel fixtures.
          hdiutil create -size 4g -type SPARSE -fs 'Case-sensitive APFS' \
            -volname pp-source-fixtures "$fixture_root/fixtures.sparseimage"
          fixture_device=$(hdiutil attach -nobrowse -owners on -mountpoint "$fixture_mount" \
            "$fixture_root/fixtures.sparseimage" | awk '/^\/dev\// && !device { device = $1 } END { print device }')
          cleanup_source_fixture() {
            result=$?
            for attempt in 1 2 3; do
              if hdiutil detach "$fixture_mount"; then
                exit "$result"
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep 2
              fi
            done
            echo "Open files on owned test fixture at $fixture_mount before forced detach:"
            lsof +f -- "$fixture_mount" || echo "::warning::lsof found no holders or failed at $fixture_mount (status $?)"
            # A forced unmount can succeed while ejecting the backing device still returns EBUSY.
            # The mount path is then an ordinary directory, so retry with the attached device.
            for attempt in 1 2 3; do
              if hdiutil detach -force "$fixture_device"; then
                exit "$result"
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep 2
              fi
            done
            echo "::warning::Could not detach owned test fixture at $fixture_mount"
            exit "$result"
          }
          trap cleanup_source_fixture EXIT
          df -h "$fixture_mount"
          mkdir "$fixture_mount/tmp"
          TMPDIR="$fixture_mount/tmp" cargo nextest run --locked --manifest-path rust/Cargo.toml -p pp-source
      - name: Install locked dependencies and build measured desktop assets
        shell: bash
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web rebuild better-sqlite3
          cargo fetch --locked --manifest-path rust/Cargo.toml
          npm --prefix web run build
          echo "PP_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          python3 rust/scripts/build-desktop-manifest.py --web web --node "$(command -v node)" --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      - name: Verify macOS identity and core-death storage gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --lib
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-storage
          run_one() {
            local name="$1"
            shift
            "$@" -- --exact --nocapture | tee "$RUNNER_TEMP/gre570-test.log"
            grep -Fx "test $name ... ok" "$RUNNER_TEMP/gre570-test.log"
            grep -F "test result: ok. 1 passed; 0 failed;" "$RUNNER_TEMP/gre570-test.log"
          }
          run_one core_death_terminates_stopped_node_and_allows_recovery cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --test runtime_m0 core_death_terminates_stopped_node_and_allows_recovery
          run_one tests::separate_group_child_dies_with_force_killed_parent cargo test --locked --manifest-path rust/Cargo.toml -p pp-compat --lib tests::separate_group_child_dies_with_force_killed_parent
          cargo build --locked --manifest-path rust/Cargo.toml -p pp-server
          PP_TEST_REAL_SERVER="$GITHUB_WORKSPACE/rust/target/debug/pp-server" python3 -m unittest discover -s .cursor/skills/verify-print-partner-rust/helpers -p test_launch.py -k ForceKillTest
          cargo test --locked --manifest-path rust/Cargo.toml -p pp-core --test runtime_m0 dead_core_marker_without_child_info_allows_start -- --exact
          npm --prefix web run test -w @print-partner/server -- src/desktop-context.test.ts

  alert-macos-main:
    needs: [changes, linux-precheck, server-smoke, bundle, bundle-intel, macos-storage-gate]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the macOS main failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_KIND: native
        run: python3 scripts/alert-macos-main.py
