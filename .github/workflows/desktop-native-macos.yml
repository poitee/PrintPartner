name: GRE-401 throwaway unlink observations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gre401-unlink-experiment-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  observations:
    runs-on: macos-26
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record native observations beneath a fresh private root
        id: probe
        run: |
          set -euo pipefail
          umask 077
          probe_root=$(mktemp -d "$RUNNER_TEMP/gre401-unlink.XXXXXXXX")
          chmod 0700 "$probe_root"
          echo "root=$probe_root" >> "$GITHUB_OUTPUT"
          mkdir -m 0700 "$probe_root/objects"
          {
            printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
            uname -a
            sw_vers
            shasum -a 256 diagnostics/gre401-unlink/* .github/workflows/desktop-native-macos.yml
          } > "$probe_root/source-and-host.txt"
          set +e
          python3 -B diagnostics/gre401-unlink/native-vnode-probe.py --root "$probe_root/objects" \
            > "$probe_root/stdout.log" 2> "$probe_root/stderr.log"
          probe_status=$?
          set -e
          printf '%s\n' "$probe_status" > "$probe_root/exit-code.txt"
          cat "$probe_root/stdout.log" "$probe_root/stderr.log"
          exit "$probe_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.probe.outputs.root != '' }}
        with:
          name: gre401-unlink-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.probe.outputs.root }}/*.txt
            ${{ steps.probe.outputs.root }}/*.log
            ${{ steps.probe.outputs.root }}/objects/*.json
          if-no-files-found: error
          retention-days: 7
