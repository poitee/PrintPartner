name: Actionlint

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-plan:
    uses: ./.github/workflows/ci-runner-plan.yml

  actionlint:
    needs: [ci-plan]
    if: ${{ needs.ci-plan.outputs.linux == 'true' }}
    runs-on: ${{ fromJSON(needs.ci-plan.outputs.linux-runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned native actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Install pinned native ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $archive" | sha256sum -c -
          python3 - "$archive" "$RUNNER_TEMP/actionlint-bin/shellcheck" <<'PYTHON'
          from pathlib import Path
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], 'r:xz') as archive:
              binary = archive.extractfile('shellcheck-v0.11.0/shellcheck')
              Path(sys.argv[2]).write_bytes(binary.read())
          PYTHON
          chmod 755 "$RUNNER_TEMP/actionlint-bin/shellcheck"
      - name: Run actionlint
        run: actionlint
