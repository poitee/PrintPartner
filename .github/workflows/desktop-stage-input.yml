name: Desktop stage input

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-stage-input.yml"
      - "rust/scripts/stage-desktop.py"
      - "rust/scripts/test_stage_desktop.py"
  push:
    paths:
      - ".github/workflows/desktop-stage-input.yml"
      - "rust/scripts/stage-desktop.py"
      - "rust/scripts/test_stage_desktop.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run stage-desktop self-test
        run: python3 rust/scripts/stage-desktop.py --self-test
