name: Web CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "fixtures/**"
      - "fixtures/drivers/bambu/**"
      - "scripts/**"
      - "manifests/**"
      - "Caddyfile"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose*.yml"
      - "pp-compose.yml"
      - "slicer-sidecar/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "web/**"
      - "fixtures/**"
      - "fixtures/drivers/bambu/**"
      - "scripts/**"
      - "manifests/**"
      - "Caddyfile"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose*.yml"
      - "pp-compose.yml"
      - "slicer-sidecar/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      actions: read
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","pp-local"]') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 45 || 20 }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ephemeral Linux prerequisites
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        run: bash "$GITHUB_WORKSPACE/scripts/setup-ci-linux.sh"
      - name: Check GitHub Actions are SHA-pinned
        working-directory: .
        run: bash scripts/check-github-actions-pinned.sh
      - name: Test Linear PR status sync
        working-directory: .
        run: python3 -B -m unittest discover -s scripts/linear -p 'test_*.py' -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify pinned Node version
        run: test "$(node --version)" = "v22.23.3"
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate immutable event workflows before lifecycle scripts
        working-directory: .
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node web/scripts/check-ci-tool-pins.mjs --event-sha "$EVENT_SHA"
          node web/scripts/check-desktop-workflow-state.mjs
      - name: Run dependency lifecycle scripts
        run: npm rebuild
      - name: Check Action SHAs and CI installer tool pins
        working-directory: .
        run: |
          node --test web/scripts/check-ci-tool-pins.test.mjs web/scripts/check-ci-event-tree.test.mjs web/scripts/check-desktop-workflow-state.test.mjs
          node web/scripts/check-ci-tool-pins.mjs
      - name: Check workaround ratchet
        run: node ../scripts/workaround-ratchet.mjs && node --test ../scripts/workaround-ratchet.test.mjs
      - name: Check MCP tool inventory golden
        run: |
          npm run mcp:inventory -w @print-partner/server
          golden=apps/server/fixtures/mcp/tools-inventory.json
          if [ -n "$(git status --porcelain -- "$golden")" ]; then
            git --no-pager diff -- "$golden"
            echo "::error file=web/$golden::MCP tool inventory drifted. Run 'npm run mcp:inventory -w @print-partner/server' in web/ and commit the result."
            exit 1
          fi
      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Check dependency notices
        run: node ../scripts/update-third-party-notices.mjs --check
      # `npm run quality` is split across two parallel jobs; together they run
      # the same steps. `web` keeps its name so required checks are unchanged.
      - name: Lint, dead code, typecheck and unit tests
        run: npm run lint && npm run lint:dead && npm run typecheck && npm test

  web-build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      actions: read
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","pp-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ephemeral Linux prerequisites
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        run: bash "$GITHUB_WORKSPACE/scripts/setup-ci-linux.sh"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify pinned Node version
        run: test "$(node --version)" = "v22.23.3"
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate immutable event workflows before lifecycle scripts
        working-directory: .
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node web/scripts/check-ci-tool-pins.mjs --event-sha "$EVENT_SHA"
          node web/scripts/check-desktop-workflow-state.mjs
      - name: Run dependency lifecycle scripts
        run: npm rebuild
      - name: Install Chrome libraries on ephemeral Linux
        if: runner.environment == 'self-hosted'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcairo2 \
            libcups2t64 libdbus-1-3 libexpat1 libgbm1 libglib2.0-0t64 \
            libnss3 libpango-1.0-0 libxcomposite1 libxdamage1 libxfixes3 \
            libxkbcommon0 libxrandr2
      - name: Install Chrome on ephemeral Linux
        if: runner.environment == 'self-hosted'
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: false
      - name: Build, bundle, runtime and browser checks
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path || '/usr/bin/google-chrome' }}
        run: npm run build && npm run test:workflow-smoke && npm run test:bundles -w @print-partner/web && npm run test:runtime && npm run test:browser

  # The OrcaSlicer base image is about 1.7 GB. When the Actions cache has evicted it, the
  # registry pull alone can take 4 minutes, so this job has its own time limit (GRE-638).
  sidecar:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build pinned OrcaSlicer sidecar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: slicer-sidecar
          tags: print-partner-slicer-sidecar:ci
          load: true
          push: false
          cache-from: type=gha,scope=slicer-sidecar
          cache-to: type=gha,scope=slicer-sidecar,mode=max
      - name: Test sidecar request handling
        run: |
          docker run --rm --entrypoint /lsiopy/bin/python3 \
            --mount "type=bind,src=${PWD}/slicer-sidecar,dst=/checks,readonly" \
            --workdir /checks print-partner-slicer-sidecar:ci \
            -B -m unittest discover -v -p 'test_*.py'

  docker:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: [web, web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose definitions
        run: |
          docker compose config
          docker compose -f docker-compose.saas.yml config
          SESSION_SECRET=ci ALLOWED_ORIGINS=https://plan.example.com docker compose -f docker-compose.hosted.yml config
          docker compose -f docker-compose.yml -f pp-compose.yml config
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # BuildKit layer cache in the GitHub Actions cache (scoped per image).
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: print-partner:ci
          load: true
          push: false
          cache-from: type=gha,scope=print-partner
          cache-to: type=gha,scope=print-partner,mode=max
      - name: Verify fresh-volume ownership and restart persistence
        run: bash scripts/docker-startup-smoke.sh print-partner:ci
      - name: Create local smoke source
        run: |
          mkdir -p "${RUNNER_TEMP}/smoke-source"
          cat > "${RUNNER_TEMP}/smoke-source/cube.stl" <<'STL'
          solid cube
            facet normal 0 0 1
              outer loop
                vertex 0 0 0
                vertex 1 0 0
                vertex 0 1 0
              endloop
            endfacet
          endsolid cube
          STL
      - name: Start production container
        run: |
          docker run --detach --name print-partner-ci \
            --publish 127.0.0.1:8080:8080 \
            --volume "${RUNNER_TEMP}/smoke-source:/smoke-source:ro" \
            --env PRINT_PARTNER_API_KEY=ci-smoke-key \
            print-partner:ci
          for ((attempt = 1; attempt <= 60; attempt++)); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs print-partner-ci
          exit 1
      - name: Run workflow smoke test
        env:
          BASE: http://127.0.0.1:8080
          PRINT_PARTNER_API_KEY: ci-smoke-key
          SOURCE_KIND: local
          SOURCE_URL: /smoke-source
          SOURCE_UPLOAD_FILE: ${{ runner.temp }}/smoke-source/cube.stl
        run: ./web/scripts/workflow-smoke.sh
