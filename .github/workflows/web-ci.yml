name: Web CI

on:
  workflow_call:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose*.yml"
      - "pp-compose.yml"
      - "slicer-sidecar/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "web/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose*.yml"
      - "pp-compose.yml"
      - "slicer-sidecar/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Full quality suite
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: npm run quality

  docker:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose definitions
        run: |
          docker compose config
          docker compose -f docker-compose.saas.yml config
          docker compose -f docker-compose.yml -f pp-compose.yml config
      - name: Build production image
        run: docker build --tag print-partner:ci .
      - name: Build pinned OrcaSlicer sidecar
        run: docker build --tag print-partner-slicer-sidecar:ci slicer-sidecar
      - name: Create local smoke source
        run: |
          mkdir -p "${RUNNER_TEMP}/smoke-source"
          cat > "${RUNNER_TEMP}/smoke-source/cube.stl" <<'STL'
          solid cube
            facet normal 0 0 1
              outer loop
                vertex 0 0 0
                vertex 1 0 0
                vertex 0 1 0
              endloop
            endfacet
          endsolid cube
          STL
      - name: Start production container
        run: |
          docker run --detach --name print-partner-ci \
            --publish 127.0.0.1:8080:8080 \
            --volume "${RUNNER_TEMP}/smoke-source:/smoke-source:ro" \
            --env PRINT_PARTNER_API_KEY=ci-smoke-key \
            print-partner:ci
          for ((attempt = 1; attempt <= 60; attempt++)); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs print-partner-ci
          exit 1
      - name: Run workflow smoke test
        env:
          BASE: http://127.0.0.1:8080
          PRINT_PARTNER_API_KEY: ci-smoke-key
          SOURCE_KIND: local
          SOURCE_URL: /smoke-source
          SOURCE_UPLOAD_FILE: ${{ runner.temp }}/smoke-source/cube.stl
        run: ./web/scripts/workflow-smoke.sh
