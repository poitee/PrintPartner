name: Auth admission freshness

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: &paths
      - ".nvmrc"
      - "fixtures/parity/auth-admission/**"
      - "web/apps/server/**"
      - "web/packages/contracts/**"
      - "web/packages/domain/**"
      - "web/package*.json"
      - "web/tsconfig.base.json"
      - "web/scripts/atomic-package-build.mjs"
      - "scripts/setup-ci-linux.sh"
      - ".github/workflows/auth-admission-freshness.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canonical:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify canonical Node version
        run: test "$(node --version)" = v22.23.3
      # Native modules must be built by the same Node that captures the golden.
      - name: Install locked dependencies
        run: npm ci && npm rebuild better-sqlite3
      - name: Build authority packages
        run: npm run build -w @print-partner/contracts && npm run build -w @print-partner/domain
      - name: Check auth admission golden on canonical Node
        run: node --conditions=development ../fixtures/parity/auth-admission/generate.mjs --check
