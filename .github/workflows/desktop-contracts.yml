name: Desktop contracts

on:
  workflow_dispatch:
  push:
    branches: [main, master, "desktop/**"]
    paths:
      - "fixtures/http/routes-inventory.json"
      - "rust/**"
      - "rust-toolchain.toml"
      - "web/packages/contracts/**"
      - "web/packages/domain/**"
      - "web/apps/server/**"
      - "web/apps/web/src/api/planReview.ts"
      - "web/scripts/desktop-parity/**"
      - "web/scripts/desktop-contracts/**"
      - "web/scripts/rust-contracts/**"
      - "web/package*.json"
      - "docs/adr/0006-autosave-text-contract.md"
      - ".github/workflows/desktop-contracts.yml"
  pull_request:
    paths:
      - "fixtures/http/routes-inventory.json"
      - "rust/**"
      - "rust-toolchain.toml"
      - "web/packages/contracts/**"
      - "web/packages/domain/**"
      - "web/apps/server/**"
      - "web/apps/web/src/api/planReview.ts"
      - "web/scripts/desktop-parity/**"
      - "web/scripts/desktop-contracts/**"
      - "web/scripts/rust-contracts/**"
      - "web/package*.json"
      - "docs/adr/0006-autosave-text-contract.md"
      - ".github/workflows/desktop-contracts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fleet: ${{ steps.runner.outputs.self-hosted }}
    steps:
      - name: Select contracts runner
        id: runner
        shell: bash
        env:
          RUNNER_OPT_IN: ${{ vars.FLEET_LINUX_RUNNERS }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          enabled=false
          if [[ "$RUNNER_OPT_IN" == on && ( "$EVENT_NAME" != pull_request || "$HEAD_REPO" == "$REPOSITORY" ) ]]; then
            enabled=true
          fi
          echo "self-hosted=$enabled" >> "$GITHUB_OUTPUT"

  parity:
    needs: runner-plan
    runs-on: ${{ needs.runner-plan.outputs.fleet == 'true' && fromJSON('["self-hosted","linux","fleet"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    strategy:
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci && npm rebuild better-sqlite3
      - name: Build authority packages
        run: npm run build -w @print-partner/contracts && npm run build -w @print-partner/domain
      - name: Verify golden Node HTTP route inventory
        run: |
          npm run build -w @print-partner/server
          node ../rust/scripts/inspect-node-routes.mjs "${RUNNER_TEMP}/routes-inventory.json"
          diff -u ../fixtures/http/routes-inventory.json "${RUNNER_TEMP}/routes-inventory.json"
      - name: Install pinned Rust checks
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Verify contracts and frozen corpus
        run: npm run contracts:verify -- "${RUNNER_TEMP}/contract-receipts" && npm run test:desktop-parity
      - name: Retain per-run parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-node-${{ matrix.node }}
          path: ${{ runner.temp }}/contract-receipts/
