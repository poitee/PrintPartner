name: Desktop contracts

on:
  workflow_dispatch:
  push:
    branches: [main, master, "desktop/**"]
    paths:
      - "fixtures/http/routes-inventory.json"
      - "fixtures/parity/auth-key/**"
      - "fixtures/parity/auth-login/**"
      - "fixtures/parity/auth-registration/**"
      - "fixtures/parity/catalog-http/**"
      - "fixtures/parity/drafts-http/**"
      - "fixtures/parity/github-sync/**"
      - "fixtures/parity/jobs-http/**"
      - "fixtures/parity/jobs-ws/**"
      - "fixtures/parity/layers-http/**"
      - "fixtures/parity/manifest-http/**"
      - "fixtures/parity/manifest-checkouts-http/**"
      - "fixtures/parity/plans-http/**"
      - "fixtures/parity/profile-sync/**"
      - "rust/**"
      - "rust-toolchain.toml"
      - 'scripts/setup-ci-linux.sh'
      - "web/packages/contracts/**"
      - "web/packages/domain/**"
      - "web/apps/server/**"
      - "web/apps/web/src/api/planReview.ts"
      - "web/scripts/desktop-parity/**"
      - "web/scripts/desktop-contracts/**"
      - "web/scripts/rust-contracts/**"
      - "web/package*.json"
      - "docs/adr/0006-autosave-text-contract.md"
      - ".github/workflows/desktop-contracts.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "fixtures/http/routes-inventory.json"
      - "fixtures/parity/auth-key/**"
      - "fixtures/parity/auth-login/**"
      - "fixtures/parity/auth-registration/**"
      - "fixtures/parity/catalog-http/**"
      - "fixtures/parity/drafts-http/**"
      - "fixtures/parity/github-sync/**"
      - "fixtures/parity/jobs-http/**"
      - "fixtures/parity/jobs-ws/**"
      - "fixtures/parity/layers-http/**"
      - "fixtures/parity/manifest-http/**"
      - "fixtures/parity/manifest-checkouts-http/**"
      - "fixtures/parity/plans-http/**"
      - "fixtures/parity/profile-sync/**"
      - "rust/**"
      - "rust-toolchain.toml"
      - 'scripts/setup-ci-linux.sh'
      - "web/packages/contracts/**"
      - "web/packages/domain/**"
      - "web/apps/server/**"
      - "web/apps/web/src/api/planReview.ts"
      - "web/scripts/desktop-parity/**"
      - "web/scripts/desktop-contracts/**"
      - "web/scripts/rust-contracts/**"
      - "web/package*.json"
      - "docs/adr/0006-autosave-text-contract.md"
      - ".github/workflows/desktop-contracts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  parity:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 30 || 5 }}
    strategy:
      matrix:
        node: ["22.23.3", "24.21.0"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify pinned Node version
        run: test "$(node --version)" = "v${{ matrix.node }}"
      - name: Install locked dependencies
        run: npm ci && npm rebuild better-sqlite3
      - name: Build authority packages
        run: npm run build -w @print-partner/contracts && npm run build -w @print-partner/domain
      - name: Verify auth Node fixtures
        run: |
          case "$(node --version)" in
            v22.*)
              node ../fixtures/parity/auth-key/generate.mjs --check
              node ../fixtures/parity/auth-login/generate.mjs --check
              node ../fixtures/parity/auth-registration/generate.mjs --check
              ;;
          esac
      - name: Verify GRE-451 parity Node fixtures
        run: |
          TMPDIR="$RUNNER_TEMP" node ../fixtures/parity/accepted-http/generate.mjs --check
          TMPDIR="$RUNNER_TEMP" node ../fixtures/parity/catalog-http/generate.mjs --check
          TMPDIR="$RUNNER_TEMP" node ../fixtures/parity/drafts-http/generate.mjs --check
          node ../fixtures/parity/github-sync/generate.mjs --check
          TMPDIR="$RUNNER_TEMP" node ../fixtures/parity/jobs-http/generate.mjs --check
          TMPDIR="$RUNNER_TEMP" node ../fixtures/parity/jobs-ws/generate.mjs --check
          TMPDIR="$RUNNER_TEMP" node ../fixtures/parity/layers-http/generate.mjs --check
          TMPDIR="$RUNNER_TEMP" node ../fixtures/parity/manifest-http/generate.mjs --check
          TMPDIR="$RUNNER_TEMP" node ../fixtures/parity/manifest-checkouts-http/generate.mjs --check
          TMPDIR="$RUNNER_TEMP" node ../fixtures/parity/plans-http/generate.mjs --check
      - name: Verify required-unit Node fixtures
        run: |
          node ../rust/crates/pp-storage/tests/fixtures/required-units/messages-node.mjs --check
          TMPDIR="$RUNNER_TEMP" node --conditions=development --import tsx ../rust/crates/pp-storage/tests/fixtures/required-units/gaps-node.mjs --check
      - name: Verify profile-sync Node fixtures
        run: node --conditions=development --import tsx ../fixtures/parity/profile-sync/generate.mjs --check
      - name: Verify builder glob Node fixtures
        run: |
          node ../rust/crates/pp-storage/tests/fixtures/manifest-globs-node.mjs --check
          node ../rust/crates/pp-storage/tests/fixtures/manifest-case-node.mjs --check
      - name: Verify golden Node HTTP route inventory
        run: |
          npm run build -w @print-partner/server
          node ../rust/scripts/inspect-node-routes.mjs "${RUNNER_TEMP}/routes-inventory.json"
          diff -u ../fixtures/http/routes-inventory.json "${RUNNER_TEMP}/routes-inventory.json"
      - name: Install pinned Rust checks
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      # PR CI skips the desktop_rebuild nextest on self-hosted Linux, so the
      # GRE-451 replay of these goldens runs here, once per run.
      - name: Replay GRE-451 parity fixtures against Rust
        run: |
          case "$(node --version)" in
            v22.*)
              cargo test --locked --manifest-path ../rust/Cargo.toml -p pp-api --features desktop_rebuild --test ticket_t_10_fixtures
              ;;
          esac
      - name: Verify contracts and frozen corpus
        run: npm run contracts:verify -- "${RUNNER_TEMP}/contract-receipts" && npm run test:desktop-parity
      - name: Retain per-run parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-node-${{ matrix.node }}
          path: ${{ runner.temp }}/contract-receipts/
