name: Desktop embedded driver smoke

on:
  pull_request:
    paths:
      - 'desktop/e2e/**'
      - 'web/**'
      - 'rust/crates/**'
      - 'rust/scripts/**'
      - 'rust-toolchain.toml'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - '.github/workflows/desktop-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      VITE_PRINT_PARTNER_DESKTOP: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config \
            webkit2gtk-driver xvfb xauth dbus-x11 libgl1-mesa-dri libegl1 binutils file
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/e2e/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - name: Install the staged Node 24.21.0 runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/node24"
          curl -fsSL -o "$RUNNER_TEMP/node24.tar.xz" \
            https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/node24.tar.xz" -C "$RUNNER_TEMP/node24" --strip-components=1
          node24="$RUNNER_TEMP/node24/bin/node"
          file "$node24" | grep -q 'ELF 64-bit'
          identity="$("$node24" -p 'process.version+" "+process.versions.modules+" "+process.execPath')"
          test "$identity" = "v24.21.0 137 $node24"
          echo "NODE24=$node24" >> "$GITHUB_ENV"
      - name: Build and stage the desktop assets
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          python3 rust/scripts/stage-desktop.py --web web --node "$NODE24" \
            --output "$RUNNER_TEMP/desktop-stage" --commit "$GITHUB_SHA"
      - name: Build the automation app and the release app
        env:
          PP_DESKTOP_RELEASE_MANIFEST: ${{ runner.temp }}/desktop-stage/bundle-manifest.json
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path rust/Cargo.toml -p pp-desktop --features desktop-e2e
          cargo build --locked --manifest-path rust/Cargo.toml -p pp-desktop --release
      - name: Prove the release binary excludes the embedded driver
        run: |
          set -euo pipefail
          npm --prefix desktop/e2e ci
          npm --prefix desktop/e2e test
          (cd desktop/e2e && npx tsc)
          (
            cd desktop/e2e
            node --import tsx assert-release-exclusion.ts \
              "$GITHUB_WORKSPACE/rust/target/release/pp-desktop" \
              "$GITHUB_WORKSPACE/rust/target/debug/pp-desktop"
          ) | tee "$RUNNER_TEMP/release-exclusion.json"
      - name: Run the native smoke
        env:
          GRE492_OUTPUT: ${{ runner.temp }}/gre492-proof
          GRE492_APP_BINARY: ${{ github.workspace }}/rust/target/debug/pp-desktop
          GRE492_STAGE: ${{ runner.temp }}/desktop-stage
          GRE492_STAGED_NODE: ${{ runner.temp }}/desktop-stage/bin/node
        run: |
          set -euo pipefail
          mkdir -p "$GRE492_OUTPUT"
          cp "$RUNNER_TEMP/release-exclusion.json" "$GRE492_OUTPUT/release-exclusion.json"
          dbus-run-session -- bash -c 'cd desktop/e2e && python3 src/run-owned.py'
      - name: Upload the screenshot and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-e2e-smoke
          path: ${{ runner.temp }}/gre492-proof/
          if-no-files-found: error
