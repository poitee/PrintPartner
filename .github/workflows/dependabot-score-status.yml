name: Dependabot score status

# Dependabot PRs have no model score, so this posts the pp/score status that
# the main ruleset requires. The required CI checks still gate every merge.
# A Dependabot pull_request run gets a read-only token by default; the job's
# permissions key raises it to statuses: write. It checks out nothing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions: {}

jobs:
  post-pp-score:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (
      github.event.pull_request.user.login == 'dependabot[bot]')
    name: Post pp/score for Dependabot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Post success status on the Dependabot head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Only a head Dependabot made and GitHub verified counts: a human commit
        # pushed to a Dependabot branch needs a real model score.
        run: |
          made_by=$(gh api "repos/$REPO/commits/$HEAD_SHA" \
            --jq '"\(.author.login) \(.commit.verification.verified)"')
          if [ "$made_by" != "dependabot[bot] true" ]; then
            echo "::notice::Head $HEAD_SHA is not a verified Dependabot commit ($made_by); no pp/score posted."
            exit 0
          fi
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=pp/score \
            -f "description=Dependabot PR: no model score; required CI checks gate the merge"
