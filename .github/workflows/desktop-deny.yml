name: Desktop cargo-deny

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'rust/**'
      - '.github/workflows/desktop-deny.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-deny-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: cargo deny check
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          command: check
          # --all-features matches [graph].all-features. Advisory exceptions are
          # limited to the two documented GTK3 IDs in rust/deny.toml.
          arguments: --all-features
          rust-version: '1.99.0'
      # The fuzz crate is excluded from the workspace and keeps its own
      # Cargo.lock. --locked fails when that lock no longer satisfies the
      # workspace's exact pins (it sat on tokio 1.53.2 after #1144, GRE-989).
      # Advisories only: libfuzzer-sys is NCSA, outside the shipped licenses.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: rust/fuzz/Cargo.toml
          command: check
          arguments: --all-features --locked
          command-arguments: advisories
          rust-version: '1.99.0'
