name: Desktop cargo-deny

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/desktop-deny.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-deny-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: cargo deny check
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pin EmbarkStudios/cargo-deny-action@v2.1.1 (cargo-deny 0.20.2).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: rust/Cargo.toml
          command: check
          # --all-features matches [graph].all-features; -W unmaintained maps the
          # GRE-534 "unmaintained = warn" policy onto cargo-deny 0.20 (no warn lint).
          arguments: --all-features
          command-arguments: -W unmaintained
          rust-version: '1.99.0'
