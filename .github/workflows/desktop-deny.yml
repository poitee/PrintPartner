name: Desktop cargo-deny

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/desktop-deny.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-deny-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: cargo deny check
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pin EmbarkStudios/cargo-deny-action@v2.1.1 (cargo-deny 0.20.2).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: rust/Cargo.toml
          command: check
          # --all-features matches [graph].all-features. Advisory exceptions are
          # limited to the two documented GTK3 IDs in rust/deny.toml.
          arguments: --all-features
          rust-version: '1.99.0'
