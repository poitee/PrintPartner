# Read-only auth smoke for the fleet-wake T3 tokens. Manual only; never starts, sends or steers threads.
# Per VM: MCP initialize + tools/list with T3_TOKEN_<vm>. Prints only VM, step, HTTP status and pass/fail.
name: t3-auth-smoke
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: t3-auth-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: [pp-intake]
    environment: fleet-wake
    timeout-minutes: 5
    env:
      T3_TOKEN_133: ${{ secrets.T3_TOKEN_133 }}
      T3_TOKEN_134: ${{ secrets.T3_TOKEN_134 }}
      T3_TOKEN_135: ${{ secrets.T3_TOKEN_135 }}
      T3_TOKEN_136: ${{ secrets.T3_TOKEN_136 }}
      T3_URL_133: ${{ vars.T3_URL_133 || 'https://agent-fleet-1.taild6d5d6.ts.net' }}
      T3_URL_134: ${{ vars.T3_URL_134 || 'https://agent-fleet-2.taild6d5d6.ts.net' }}
      T3_URL_135: ${{ vars.T3_URL_135 || 'https://agent-fleet-3.taild6d5d6.ts.net' }}
      T3_URL_136: ${{ vars.T3_URL_136 || 'https://agent-fleet-4.taild6d5d6.ts.net' }}
    steps:
      - name: Authenticated read-only MCP calls
        shell: python3 {0}
        run: |
          import json, os, sys, urllib.request, urllib.error
          fails = 0
          def call(url, tok, body, sid=None):
              h = {"Authorization": "Bearer " + tok, "Content-Type": "application/json",
                   "Accept": "application/json, text/event-stream"}
              if sid: h["Mcp-Session-Id"] = sid
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=h, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, r.headers.get("Mcp-Session-Id"), r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, None, ""
              except Exception as e:
                  return "ERR:" + type(e).__name__, None, ""
          for vm in ("133", "134", "135", "136"):
              tok = os.environ.get("T3_TOKEN_" + vm, "")
              url = os.environ["T3_URL_" + vm].rstrip("/") + "/mcp"
              if not tok:
                  print(f"VM{vm} token=missing FAIL"); fails += 1; continue
              s1, sid, _ = call(url, tok, {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
                  "protocolVersion": "2025-06-18", "capabilities": {},
                  "clientInfo": {"name": "t3-auth-smoke", "version": "1"}}})
              if sid:
                  call(url, tok, {"jsonrpc": "2.0", "method": "notifications/initialized"}, sid)
              s2, _, body = call(url, tok, {"jsonrpc": "2.0", "id": 2, "method": "tools/list"}, sid)
              ok = s1 == 200 and s2 == 200 and '"tools"' in body
              print(f"VM{vm} initialize={s1} tools/list={s2} {'PASS' if ok else 'FAIL'}")
              fails += 0 if ok else 1
          sys.exit(1 if fails else 0)
