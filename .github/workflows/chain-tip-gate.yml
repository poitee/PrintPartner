name: Chain tip gate

# Manual gate: runs the desktop Rust and contracts checks against any ref
# (branch, tag or SHA) and writes one summary table. Reads only; no secrets.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to gate
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: chain-tip-gate-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VITE_PRINT_PARTNER_DESKTOP: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Save only when the gated commit is the main commit that dispatched this run.
      - name: Check whether the gated commit is main
        id: tree
        run: |
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then echo is-main=true; else echo is-main=false; fi >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' && steps.tree.outputs.is-main == 'true' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.148
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Build desktop assets and generate measured manifest
        run: |
          set -euo pipefail
          sudo ln -sf "$(command -v node)" /usr/bin/node
          test "$(/usr/bin/node --version)" = v24.21.0
          npm --prefix web ci
          npm --prefix web rebuild better-sqlite3
          npm --prefix web run build
          python3 rust/scripts/build-desktop-manifest.py --web web --node /usr/bin/node --output rust/bundle-manifest.json --commit "$(git rev-parse HEAD)"
      - name: cargo fmt --check
        id: fmt
        continue-on-error: true
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: clippy (-D warnings)
        id: clippy
        continue-on-error: true
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - name: cargo nextest (full workspace)
        id: nextest
        continue-on-error: true
        run: cargo nextest run --manifest-path rust/Cargo.toml --locked --workspace
      - name: check-boundaries
        id: boundaries
        continue-on-error: true
        run: python3 rust/scripts/check-boundaries.py --self-test
      - name: pp-domain dependency guard
        id: domain_deps
        continue-on-error: true
        run: python3 rust/scripts/check-domain-deps.py --self-test
      - name: Build contracts and domain packages
        id: contracts_build
        continue-on-error: true
        working-directory: web
        run: |
          set -euo pipefail
          npm run build -w @print-partner/contracts
          npm run build -w @print-partner/domain
      - name: Contracts verify
        id: contracts_verify
        continue-on-error: true
        working-directory: web
        run: npm run contracts:verify -- "${RUNNER_TEMP}/contract-receipts"
      - name: Desktop parity
        id: parity
        continue-on-error: true
        working-directory: web
        run: npm run test:desktop-parity
      - name: Write gate summary
        if: always()
        shell: bash
        env:
          REF_INPUT: ${{ inputs.ref }}
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          NEXTEST: ${{ steps.nextest.outcome }}
          BOUNDARIES: ${{ steps.boundaries.outcome }}
          DOMAIN_DEPS: ${{ steps.domain_deps.outcome }}
          CONTRACTS_BUILD: ${{ steps.contracts_build.outcome }}
          CONTRACTS_VERIFY: ${{ steps.contracts_verify.outcome }}
          PARITY: ${{ steps.parity.outcome }}
        run: |
          set -uo pipefail
          row() {
            case "$2" in
              success) result='✅ pass' ;;
              failure) result='❌ fail' ;;
              *) result="⚪ not run ($2)" ;;
            esac
            echo "| $1 | $result |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo '## Chain tip gate'
            echo
            echo "- Ref: \`$REF_INPUT\`"
            echo "- Resolved SHA: \`$(git rev-parse HEAD)\`"
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          row 'cargo fmt --check' "$FMT"
          row 'clippy (-D warnings)' "$CLIPPY"
          row 'cargo nextest (workspace)' "$NEXTEST"
          row 'check-boundaries' "$BOUNDARIES"
          row 'pp-domain dependency guard' "$DOMAIN_DEPS"
          row 'contracts build' "$CONTRACTS_BUILD"
          row 'contracts verify' "$CONTRACTS_VERIFY"
          row 'desktop parity' "$PARITY"
          for outcome in "$FMT" "$CLIPPY" "$NEXTEST" "$BOUNDARIES" "$DOMAIN_DEPS" "$CONTRACTS_BUILD" "$CONTRACTS_VERIFY" "$PARITY"; do
            test "$outcome" = success || exit 1
          done
