name: linear-pr-sync
# Deterministic Linear status sync (scripts/linear/pr_status_sync.py). No LLM.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: linear-pr-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR events use the immutable base commit; scheduled runs use the default branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then echo "LINEAR_API_KEY secret not set; skipping"; exit 0; fi
          if [ ! -f scripts/linear/pr_status_sync.py ]; then
            echo "Sync script absent at trusted base; scheduled reconciliation will retry"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            python3 scripts/linear/pr_status_sync.py event --pr "$PR_NUMBER"
          else
            python3 scripts/linear/pr_status_sync.py reconcile --hours 3
          fi
