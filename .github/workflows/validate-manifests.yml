name: Validate manifests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - "web/apps/server/src/data/manifests/**"
      - ".github/workflows/validate-manifests.yml"
  pull_request:
    paths:
      - "manifests/**"
      - "web/apps/server/src/data/manifests/**"
      - ".github/workflows/validate-manifests.yml"

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manifests/requirements.txt
      - name: Install validator dependencies
        run: python -m pip install -r manifests/requirements.txt
      - name: Test validator fixtures
        run: python -m unittest manifests.tests.test_validate
      - name: Validate schemas and embedded-copy drift
        run: python manifests/scripts/validate.py
