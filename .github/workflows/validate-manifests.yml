name: Validate manifests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - "web/apps/server/src/data/manifests/**"
      - ".github/workflows/validate-manifests.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "manifests/**"
      - "web/apps/server/src/data/manifests/**"
      - ".github/workflows/validate-manifests.yml"

permissions:
  contents: read

concurrency:
  group: validate-manifests-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  schema:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manifests/requirements.txt
      - name: Install validator dependencies
        run: python -m pip install -r manifests/requirements.txt
      - name: Test validator fixtures
        run: python -m unittest manifests.tests.test_validate
      - name: Validate schemas and embedded-copy drift
        run: python manifests/scripts/validate.py
