name: PR264 Postgres HTTP proof

on:
  pull_request:
    paths:
      - ".github/workflows/pr264-postgres-proof.yml"
      - ".github/scripts/pr264-postgres-proof.mjs"
      - ".github/scripts/pr264-postgres-proof.test.mjs"

permissions:
  contents: read

concurrency:
  group: pr264-postgres-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-http-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: printpartner
          POSTGRES_PASSWORD: postgres-smoke-only
          POSTGRES_DB: printpartner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U printpartner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout product tree at f6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f6d4e394376031dd8da18995aa27154f0ea76483
          path: app
          persist-credentials: false
      - name: Checkout proof driver at PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proof
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Assert Node runtime shape
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          file -b "$node_path" | grep -q ELF
          test "$(node -p "process.version")" = "v22.23.3"
          test "$(node -p "process.versions.modules")" = "127"
          readlink -f "$node_path" | grep -q node
      - name: Build product server at f6
        working-directory: app/web
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Run hosted Postgres HTTP proof
        working-directory: app/web
        env:
          APP_ROOT: ${{ github.workspace }}/app/web/apps/server
          WEB_ROOT: ${{ github.workspace }}/app/web
          PROOF_ROOT: ${{ github.workspace }}/proof
          PRODUCT_GIT_SHA: f6d4e394376031dd8da18995aa27154f0ea76483
          PROOF_GIT_SHA: ${{ github.event.pull_request.head.sha }}
          PP_COMMIT: f6d4e394376031dd8da18995aa27154f0ea76483
          DATABASE_URL: postgresql://printpartner:postgres-smoke-only@127.0.0.1:5432/printpartner
          DEPLOY_MODE: saas
          POSTGRES_EXPERIMENTAL: "1"
          MULTI_USER: "1"
          SESSION_SECRET: postgres-smoke-session-secret-not-for-production
          SESSION_COOKIE_SECURE: "0"
          NODE_ENV: production
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node "${{ github.workspace }}/proof/.github/scripts/pr264-postgres-proof.mjs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pr264-postgres-http-proof-${{ github.run_id }}
          path: proof/.github/scripts/out/pr264-postgres-proof/
          if-no-files-found: error
