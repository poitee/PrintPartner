name: Desktop runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'web/apps/server/**'
      - 'web/apps/web/**'
      - 'web/packages/domain/**'
      - 'web/packages/contracts/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/scripts/**'
      - '.cursor/skills/verify-print-partner-rust/**'
      - '.github/workflows/desktop-runtime.yml'
  push:
    branches: [main, master]
    paths:
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'web/apps/server/**'
      - 'web/apps/web/**'
      - 'web/packages/domain/**'
      - 'web/packages/contracts/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/scripts/**'
      - '.cursor/skills/verify-print-partner-rust/**'
      - '.github/workflows/desktop-runtime.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_PRINT_PARTNER_DESKTOP: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize evidence
        run: |
          export PP_EVIDENCE="$RUNNER_TEMP/desktop-runtime-evidence"
          echo "PP_EVIDENCE=$PP_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$PP_EVIDENCE"
          uname -a > "$PP_EVIDENCE/runner.txt"
          git rev-parse HEAD > "$PP_EVIDENCE/head.txt"
      - name: Run rust/scripts self-tests
        run: |
          python3 rust/scripts/stage-desktop.py --self-test 2>&1 | tee "$PP_EVIDENCE/stage-desktop-self-tests.log"
          python3 rust/scripts/gateway-operations.py rust/crates/pp-gateway/operations.json --self-test 2>&1 | tee "$PP_EVIDENCE/gateway-operations-self-tests.log"
          python3 rust/scripts/native-process-probe.py --self-test 2>&1 | tee "$PP_EVIDENCE/native-process-probe-self-tests.log"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install pinned tools and build desktop assets
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustc --version --verbose > "$PP_EVIDENCE/rust-version.txt"
          sudo ln -sf "$(command -v node)" /usr/bin/node
          test "$(/usr/bin/node --version)" = v24.21.0
          /usr/bin/node -p 'JSON.stringify({node:process.version,abi:process.versions.modules,os:process.platform,arch:process.arch})' > "$PP_EVIDENCE/node-version.json"
          npm --prefix web ci 2>&1 | tee "$PP_EVIDENCE/npm-ci.log"
          npm --prefix web run build 2>&1 | tee "$PP_EVIDENCE/desktop-build.log"
          python3 rust/scripts/build-desktop-manifest.py --web web --node /usr/bin/node --output rust/bundle-manifest.json --commit "$GITHUB_SHA" 2>&1 | tee "$PP_EVIDENCE/manifest.log"
          cp rust/bundle-manifest.json "$PP_EVIDENCE/bundle-manifest.json"
      - name: Build real server and check crate boundaries
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked -p pp-server 2>&1 | tee "$PP_EVIDENCE/server-build.log"
          python3 rust/scripts/check-boundaries.py --self-test 2>&1 | tee "$PP_EVIDENCE/boundaries.log"
          python3 rust/scripts/check-domain-deps.py --self-test 2>&1 | tee "$PP_EVIDENCE/domain-deps.log"
          cargo fmt --manifest-path rust/Cargo.toml --all --check 2>&1 | tee "$PP_EVIDENCE/fmt.log"
          git diff --exit-code -- rust/Cargo.lock web/package-lock.json
      - name: Run eight real core lifecycle tests
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked -p pp-core --test runtime_m0 -- --nocapture --test-threads=1 2>&1 | tee "$PP_EVIDENCE/core-runtime.log"
      - name: Run backend units and lint
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked -p pp-core -p pp-compat -p pp-gateway -p pp-server --lib --bins 2>&1 | tee "$PP_EVIDENCE/backend-units.log"
          cargo clippy --manifest-path rust/Cargo.toml --locked -p pp-core -p pp-compat -p pp-gateway -p pp-server --all-targets -- -D warnings 2>&1 | tee "$PP_EVIDENCE/backend-clippy.log"
      - name: Verify authenticated workflow and process cleanup
        run: |
          python3 rust/tests/workflow_m0.py 2>&1 | tee "$PP_EVIDENCE/workflow.log"
          python3 rust/tests/lifecycle_m0.py 2>&1 | tee "$PP_EVIDENCE/lifecycle.log"
      - name: Verify gateway effects and product routes
        run: |
          python3 rust/tests/gateway_effects.py 2>&1 | tee "$PP_EVIDENCE/gateway-effects.log"
          python3 rust/tests/gateway_product.py 2>&1 | tee "$PP_EVIDENCE/gateway-product.log"
      - name: Verify gateway streaming and shutdown
        run: |
          python3 rust/tests/gateway_product.py --streams 2>&1 | tee "$PP_EVIDENCE/gateway-streams.log"
      - name: Preserve final inventory and lockfile state
        if: always()
        run: |
          export PP_EVIDENCE="$RUNNER_TEMP/desktop-runtime-evidence"
          mkdir -p "$PP_EVIDENCE"
          if test -f rust/bundle-manifest.json; then
            cp rust/bundle-manifest.json "$PP_EVIDENCE/manifest-after-checks.json"
          fi
          git diff -- rust/Cargo.lock web/package-lock.json > "$PP_EVIDENCE/lockfile-diff.patch"
          df -h > "$PP_EVIDENCE/storage-after.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-runtime-evidence/
          if-no-files-found: error
          retention-days: 14

  source-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install source artifact validation tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace time
      - name: Build Node and Rust snapshot implementations
        id: source_artifacts_build
        run: |
          npm --prefix web ci
          npm --prefix web run build -w @print-partner/contracts
          npm --prefix web run build -w @print-partner/domain
          npm --prefix web run build -w @print-partner/server
          cargo build --manifest-path rust/Cargo.toml --locked -p pp-source
      - name: Verify source artifact compatibility and crash recovery
        run: |
          python3 rust/tests/source-artifacts/verify.py \
            --output "$RUNNER_TEMP/source-artifacts-evidence" \
            --node "$(command -v node)" \
            --node-snapshot web/apps/server/dist/current/services/local-source-snapshot.js \
            --binary rust/target/debug/pp-source
      - name: Verify source archive extraction, limits and crash recovery
        run: |
          python3 rust/tests/source-archive/verify.py \
            --output "$RUNNER_TEMP/source-archive-evidence" \
            --node "$(command -v node)" \
            --node-archive web/apps/server/dist/current/services/archive-import.js \
            --binary rust/target/debug/pp-source-archive
      - name: Replay SourcePath corpus through Node
        if: ${{ !cancelled() && steps.source_artifacts_build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/source-artifacts-evidence"
          cargo run --manifest-path rust/Cargo.toml --locked -q -p pp-source --example source_path_corpus \
            > "$RUNNER_TEMP/source-artifacts-evidence/source-path-corpus.json"
          node rust/tests/source-artifacts/source-path-replay.mjs \
            web/apps/server/dist/current/services/local-source-snapshot.js \
            "$RUNNER_TEMP/source-artifacts-evidence/source-path-corpus.json" \
            "$RUNNER_TEMP/source-artifacts-evidence/source-path-replay.json"
          node --test rust/tests/source-artifacts/source-path-replay.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-artifacts-evidence/checks.json
            ${{ runner.temp }}/source-artifacts-evidence/source-path-replay.json
            ${{ runner.temp }}/source-artifacts-evidence/source-path-corpus.json
            ${{ runner.temp }}/source-artifacts-evidence/*.strace
            ${{ runner.temp }}/source-artifacts-evidence/*.stderr
            ${{ runner.temp }}/source-archive-evidence/checks.json
            ${{ runner.temp }}/source-archive-evidence/*.strace
          if-no-files-found: warn
          retention-days: 14

  rust-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize evidence
        run: |
          export PP_EVIDENCE="$RUNNER_TEMP/rust-verify-evidence"
          echo "PP_EVIDENCE=$PP_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$PP_EVIDENCE"
          uname -a > "$PP_EVIDENCE/runner.txt"
          git rev-parse HEAD > "$PP_EVIDENCE/head.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install pinned tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustc --version --verbose > "$PP_EVIDENCE/rust-version.txt"
          node -p 'JSON.stringify({node:process.version,abi:process.versions.modules,os:process.platform,arch:process.arch})' > "$PP_EVIDENCE/node-version.json"
          python3 --version > "$PP_EVIDENCE/python-version.txt"
      - name: Block private LAN egress (loopback only)
        run: |
          # verify.py must only talk to the 127.0.0.1 origin Rust prints; any
          # attempt to reach a LAN printer (192.168.*, incl. .80/.81) is rejected
          # and counted, then fails the job below.
          sudo iptables -N PP_LAN_GUARD
          sudo iptables -A PP_LAN_GUARD -j REJECT
          sudo iptables -I OUTPUT -d 192.168.0.0/16 -m conntrack --ctstate NEW -j PP_LAN_GUARD
          sudo iptables -L OUTPUT -n -v | tee "$PP_EVIDENCE/egress-guard-before.txt"
      - name: Run Rust gateway verify.py end to end
        run: |
          python3 .cursor/skills/verify-print-partner-rust/helpers/verify.py 2>&1 | tee "$PP_EVIDENCE/verify.log"
          grep -qx 'PASS: Rust build, gateway endpoints, persisted Source and shutdown' "$PP_EVIDENCE/verify.log"
          grep -E '^START: pid=[0-9]+ origin=http://127\.0\.0\.1:[0-9]+$' "$PP_EVIDENCE/verify.log"
      - name: Assert no LAN egress was attempted
        if: always()
        run: |
          sudo iptables -L OUTPUT -n -v -x | tee "$PP_EVIDENCE/egress-guard-after.txt"
          blocked="$(sudo iptables -L PP_LAN_GUARD -n -v -x | awk 'NR>2 {sum+=$1} END {print sum+0}')"
          echo "blocked_lan_packets=$blocked" | tee "$PP_EVIDENCE/egress-guard-result.txt"
          test "$blocked" -eq 0
      - name: Summarize verification checks
        if: always()
        run: |
          log="$PP_EVIDENCE/verify.log"
          {
            echo "head=$(cat "$PP_EVIDENCE/head.txt")"
            if test -f "$log"; then
              grep -E '^(START|HTTP|STOP|PASS|CLEANUP ERROR|Traceback|RuntimeError)' "$log" || true
              tail -n 3 "$log"
            else
              echo "verify.log missing"
            fi
          } | tee "$PP_EVIDENCE/summary.txt"
          {
            echo '### Rust gateway verify.py'
            echo '```'
            cat "$PP_EVIDENCE/summary.txt"
            cat "$PP_EVIDENCE/egress-guard-result.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-verify-evidence/
          if-no-files-found: error
          retention-days: 14
