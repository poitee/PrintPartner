name: Ephemeral Linux permissions diagnostic
on:
  push:
    branches: [ci/gre-753-linux-permissions]
permissions:
  contents: read
jobs:
  permissions:
    runs-on: [self-hosted, linux, x64, pp-local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect fixture ancestors
        shell: bash
        run: |
          id
          umask
          python3 - <<'PYTHON'
          import os, pathlib, stat
          paths = {pathlib.Path(os.environ[key]).resolve() for key in ('HOME', 'GITHUB_WORKSPACE', 'RUNNER_TEMP')}
          for path in sorted({p for root in paths for p in (root, *root.parents)}):
              info = path.stat()
              print(path, 'uid=', info.st_uid, 'gid=', info.st_gid, 'mode=', oct(stat.S_IMODE(info.st_mode)))
          probe = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.mode-probe'
          probe.mkdir()
          print('new directory mode=', oct(stat.S_IMODE(probe.stat().st_mode)))
          PYTHON
      - name: Inspect CPU limits and orphan reaping
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, time
          for name in ['/proc/1/comm', '/sys/fs/cgroup/cpu.max', '/sys/fs/cgroup/cpu.stat', '/sys/fs/cgroup/memory.max', '/sys/fs/cgroup/cpuset.cpus.effective']:
              path = pathlib.Path(name)
              print(name, path.read_text().strip() if path.exists() else 'unavailable')
          print('affinity CPUs', len(os.sched_getaffinity(0)))
          read_fd, write_fd = os.pipe()
          parent = os.fork()
          if parent == 0:
              os.close(read_fd)
              child = os.fork()
              if child == 0:
                  os.close(write_fd)
                  time.sleep(0.2)
                  os._exit(0)
              os.write(write_fd, str(child).encode())
              os._exit(0)
          os.close(write_fd)
          child = int(os.read(read_fd, 32))
          os.close(read_fd)
          os.waitpid(parent, 0)
          time.sleep(2)
          status = pathlib.Path(f'/proc/{child}/status')
          print('orphan reaped', not status.exists())
          if status.exists():
              for line in status.read_text().splitlines():
                  if line.startswith(('Name:', 'State:', 'PPid:')):
                      print(line)
          PYTHON
