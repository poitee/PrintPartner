name: Fresh pp-local WebKit software GL proof
'on':
  push:
    branches:
    - ci/gre-753-linux-permissions
permissions:
  contents: read
jobs:
  webkit-proof:
    runs-on:
    - self-hosted
    - linux
    - x64
    - pp-local
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '4'
      VITE_PRINT_PARTNER_DESKTOP: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 03e8d13c258fcb5ad6f26a711a98bbda04238ece
    - name: Set up explicit Linux prerequisites
      run: bash "$GITHUB_WORKSPACE/scripts/setup-ci-linux.sh"
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.0
    - name: Install WebKitGTK, WebDriver, Mesa and virtual display
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\n  libglib2.0-dev libgtk-3-dev\
        \ libwebkit2gtk-4.1-dev libsoup-3.0-dev \\\n  libayatana-appindicator3-dev librsvg2-dev pkg-config \\\n\
        \  webkit2gtk-driver xvfb xauth dbus-x11 libgl1-mesa-dri libegl1 mesa-utils\n"
    - name: Prove software GL under the virtual display
      run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24' glxinfo -B
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.21.0
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Verify Node runtime
      run: test "$(node --version)" = "v24.21.0"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: rust -> target
    - name: Build and stage the production desktop assets
      run: "npm --prefix web ci\nnpm --prefix web run build\npython3 rust/scripts/stage-desktop.py --web web --node\
        \ \"$(command -v node)\" \\\n  --output \"$RUNNER_TEMP/webkit-stage\" --commit \"$GITHUB_SHA\"\n"
    - name: Build pp-desktop
      env:
        PP_DESKTOP_RELEASE_MANIFEST: ${{ runner.temp }}/webkit-stage/bundle-manifest.json
      run: cargo build --locked --manifest-path rust/Cargo.toml -p pp-desktop
    - name: Launch native desktop and prove the STL viewer renders
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/webkit-proof\"\ndbus-run-session -- xvfb-run -a -s '-screen\
        \ 0 1280x1024x24' \\\n  python3 rust/tests/webkit_stl_smoke.py --stage \"$RUNNER_TEMP/webkit-stage\" \\\n\
        \  --output \"$RUNNER_TEMP/webkit-proof\" | tee \"$RUNNER_TEMP/webkit-proof/verify.log\"\ncat \"$RUNNER_TEMP/webkit-proof/receipt.json\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload native screenshot and WebGL proof
      if: always()
      id: proof
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-webkit-stl-proof
        path: ${{ runner.temp }}/webkit-proof/
        if-no-files-found: error
    - name: Link proof artifact
      if: always() && steps.proof.outputs.artifact-url != ''
      env:
        ARTIFACT_URL: ${{ steps.proof.outputs.artifact-url }}
      run: echo "Screenshot and WebGL receipt $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
    name: Fresh pp-local WebKit software GL proof
