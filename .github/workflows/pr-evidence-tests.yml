name: PR evidence tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/pull_request_template.md'
      - 'scripts/lint-pr-evidence.mjs'
      - 'scripts/lint-pr-evidence.test.mjs'
      - '.github/workflows/pr-evidence*.yml'
  push:
    branches: [main]
    paths:
      - '.github/pull_request_template.md'
      - 'scripts/lint-pr-evidence.mjs'
      - 'scripts/lint-pr-evidence.test.mjs'
      - '.github/workflows/pr-evidence*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-checker:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Unit-test Evidence checker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Verify Node version
        run: test "$(node --version)" = "v22.23.3"
      - name: Unit-test PR evidence lint
        run: node --test scripts/lint-pr-evidence.test.mjs
