name: Rust cross-OS

# Every PR builds and tests the Rust workspace on Linux, macOS and Windows,
# with the desktop_rebuild feature off and on. See docs/development/ci.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Snapshot baselines must be committed; CI must never accept or create them.
  INSTA_UPDATE: 'no'

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Runner labels, per-OS package scope and per-OS test filters live only here.
        include:
          - os: linux
            runner: ubuntu-latest
            scope: --workspace
            tests: all()
          # These tests fail on macOS. Delete one when it passes there (docs/development/ci.md).
          - os: macos
            runner: macos-26
            scope: --workspace
            tests: >-
              not (
              test(=ticket_t_2::ticket_t_2_three_health_failures_record_cause_without_cleanup_exit)
              | test(=ticket_t_2::ticket_t_3_drain_force_killed_owner_during_startup_kills_group)
              | test(=ticket_t_2::ticket_t_3_drain_health_failure_after_disarm_is_interrupted)
              | test(=ticket_t_2::ticket_t_3_drain_measured_release_startup_parent_death)
              | test(=ticket_t_2::ticket_t_3_drain_repeated_eof_interrupts_mutation_without_resend)
              | test(=ticket_t_2::ticket_t_3_drain_repeated_eof_joins_unread_response_body)
              | test(=ticket_t_2::ticket_t_3_drain_shutdown_cancels_backpressured_startup_setup)
              | test(=ticket_t_2::ticket_t_3_drain_supervisor_crash_after_disarm_is_not_graceful)
              | test(=ticket_t_2::ticket_t_3_drain_supervisor_recovered_crash_can_shutdown_gracefully)
              | test(=origin_tests::ticket_t_12_missing_config_persists_private_port_and_reuses_it)
              | test(=crash_guard_stops_after_five_failures_and_recovers_explicitly)
              | test(=crash_left_marker_allows_later_start)
              | test(=drain::ticket_t_3_drain_runtime_flag_off_refusal_keeps_running)
              | test(=stable_child_resets_backoff_without_erasing_rapid_crash_escalation)
              | test(=acquisition_labels::raw_long_labels_contract_to_valid_file_and_directory_paths)
              )
          # These crates still use Unix-only APIs or depend on one that does.
          # Delete an --exclude when its Windows port lands (docs/development/ci.md).
          - os: windows
            runner: windows-latest
            scope: >-
              --workspace
              --exclude pp-storage --exclude pp-compat --exclude pp-source
              --exclude pp-api --exclude pp-core --exclude pp-gateway
              --exclude pp-server --exclude pp-desktop
            tests: all()
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned historical schema commits
        run: rust/scripts/fetch-historical-schema-commits.sh
      - name: Install the pinned toolchain from rust-toolchain.toml
        id: toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Install pinned storage-fixture Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Record storage-fixture executable
        run: |
          test "$(node --version)" = v22.23.3
          echo "PP_SCHEMA_PARITY_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Build desktop assets and generate measured manifest
        id: assets
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
        run: |
          set -euo pipefail
          node_path=$(node -p process.execPath)
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo ln -sf "$node_path" /usr/bin/node
          fi
          echo "PP_TEST_NODE=$node_path" >> "$GITHUB_ENV"
          npm --prefix web ci
          npm --prefix web run build
          python3 rust/scripts/build-desktop-manifest.py --web web --node "$node_path" --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      # The default macOS TMPDIR is case-insensitive, sits under the /var symlink and is
      # too long for Unix socket paths. The tests need a TMPDIR that is none of these.
      - name: Mount a short case-sensitive TMPDIR
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          hdiutil create -size 8g -type SPARSE -fs 'Case-sensitive APFS' -volname pptmp "$RUNNER_TEMP/pptmp.sparseimage"
          hdiutil attach -nobrowse -owners on "$RUNNER_TEMP/pptmp.sparseimage"
          mkdir /Volumes/pptmp/tmp
          echo 'TMPDIR=/Volumes/pptmp/tmp' >> "$GITHUB_ENV"
      # Each check below runs even when an earlier one failed, so one run reports every failure.
      - name: cargo fmt
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: clippy (desktop_rebuild off)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        run: cargo clippy --manifest-path rust/Cargo.toml --locked ${{ matrix.scope }} --all-targets --keep-going -- -D warnings
      - name: clippy (desktop_rebuild on)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        run: cargo clippy --manifest-path rust/Cargo.toml --locked ${{ matrix.scope }} --all-targets --keep-going --features desktop_rebuild -- -D warnings
      - name: nextest (desktop_rebuild off)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        run: cargo nextest run --manifest-path rust/Cargo.toml --locked ${{ matrix.scope }} --no-fail-fast -E '${{ matrix.tests }}'
      - name: nextest (desktop_rebuild on)
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        run: cargo nextest run --manifest-path rust/Cargo.toml --locked ${{ matrix.scope }} --no-fail-fast -E '${{ matrix.tests }}' --features desktop_rebuild
