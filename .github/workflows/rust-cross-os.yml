name: Rust cross-OS

# Every PR builds and tests the Rust workspace on Linux, macOS and Windows,
# with the desktop_rebuild feature off and on. See docs/development/ci.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Snapshot baselines must be committed; CI must never accept or create them.
  INSTA_UPDATE: 'no'

jobs:
  rust:
    name: rust (macos)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GRE-671 trap probe
        run: |
          ls -l /bin/sh; /bin/sh --version | head -1
          python3 -I rust/scripts/gre671-trap-probe.py 30
