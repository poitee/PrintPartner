name: Rust cross-OS

# Every PR builds and tests the Rust workspace on Linux, macOS and Windows,
# with the desktop_rebuild feature off and on. See docs/development/ci.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Snapshot baselines must be committed; CI must never accept or create them.
  INSTA_UPDATE: 'no'

jobs:
  rust:
    name: soak (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # Runner labels, per-OS package scope and per-OS test filters live only here.
        include:
          - os: macos
            runner: macos-26
            scope: [--workspace]
            tests: all()
        shard: [a, b]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned historical schema commits
        run: rust/scripts/fetch-historical-schema-commits.sh
      - name: Install the pinned toolchain from rust-toolchain.toml
        id: toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Install pinned storage-fixture Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Record storage-fixture executable
        run: |
          test "$(node --version)" = v22.23.3
          echo "PP_SCHEMA_PARITY_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Build desktop assets and generate measured manifest
        id: assets
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
        run: |
          set -euo pipefail
          node_path=$(node -p process.execPath)
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo ln -sf "$node_path" /usr/bin/node
          fi
          echo "PP_TEST_NODE=$node_path" >> "$GITHUB_ENV"
          npm --prefix web ci
          npm --prefix web run build
          python3 rust/scripts/build-desktop-manifest.py --web web --node "$node_path" --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      # The default macOS TMPDIR is case-insensitive, sits under the /var symlink and is
      # too long for Unix socket paths. The tests need a TMPDIR that is none of these.
      - name: Mount a short case-sensitive TMPDIR
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          hdiutil create -size 8g -type SPARSE -fs 'Case-sensitive APFS' -volname pptmp "$RUNNER_TEMP/pptmp.sparseimage"
          hdiutil attach -nobrowse -owners on "$RUNNER_TEMP/pptmp.sparseimage"
          mkdir /Volumes/pptmp/tmp
          echo 'TMPDIR=/Volumes/pptmp/tmp' >> "$GITHUB_ENV"
      # GRE-645 soak only; this branch is never merged. Ten iterations of the job's two nextest steps.
      - name: Soak the macOS nextest steps
        if: ${{ steps.assets.outcome == 'success' }}
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          failed=0
          for i in $(seq 1 10); do
            for features in "" "--features desktop_rebuild"; do
              start=$SECONDS
              # shellcheck disable=SC2086
              if cargo nextest run --manifest-path rust/Cargo.toml --locked --workspace --no-fail-fast -E "$TESTS" $features > "$RUNNER_TEMP/iter.log" 2>&1; then
                result=PASS
              else
                result=FAIL; failed=$((failed + 1))
                grep -E '^\s+FAIL \[' "$RUNNER_TEMP/iter.log" | sort -u
              fi
              echo "SOAK iteration=$i features=${features:-off} result=$result seconds=$((SECONDS - start)) $(grep -E 'Summary \[' "$RUNNER_TEMP/iter.log" | tail -1)"
            done
          done
          echo "SOAK failed_invocations=$failed"
          test "$failed" -eq 0
