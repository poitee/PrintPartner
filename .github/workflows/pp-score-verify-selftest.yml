name: pp-score-verify self-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/scripts/pp-score-verify.py'
      - '.github/scripts/test/pp-score-verify/**'
      - '.github/workflows/pp-score-verify*.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/pp-score-verify.py'
      - '.github/scripts/test/pp-score-verify/**'
      - '.github/workflows/pp-score-verify*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  self-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Self-test pp-score-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run fixtures
        run: python3 .github/scripts/pp-score-verify.py self-test
