name: Stuck PRs

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: stuck-prs
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The repo is public, so commit, status and check reads need no extra scopes.
    permissions:
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Stuck PRs (daily)
    steps:
      - name: Find stuck PRs and update the issue
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          rows=""
          prs=$(gh pr list --state open --limit 200 \
            --json number,title,url,isDraft,headRefOid,mergeStateStatus \
            --jq '.[] | select(.isDraft | not) | @base64')

          for pr in $prs; do
            j=$(printf '%s' "$pr" | base64 -d)
            num=$(jq -r .number <<<"$j")
            # Escape Markdown so a title can't break the table or add links.
            title=$(jq -r '.title | gsub("(?<c>[\\\\`*_<>\\[\\]|])"; "\\\(.c)")' <<<"$j")
            url=$(jq -r .url <<<"$j")
            sha=$(jq -r .headRefOid <<<"$j")
            merge=$(jq -r .mergeStateStatus <<<"$j")
            reasons=""

            # gh exits 1 when a check failed and 8 while one pends; both still print JSON.
            # With no JSON, tell "no required checks configured" apart from an API error.
            err=$(mktemp)
            rc=0
            buckets=$(gh pr checks "$num" --required --json bucket --jq '[.[].bucket]' 2>"$err") || rc=$?
            if ! { { [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ] || [ "$rc" -eq 8 ]; } \
              && jq -e 'type == "array" and length > 0' <<<"${buckets:-null}" >/dev/null 2>&1; } \
              && ! grep -qE 'no (required )?checks reported' "$err"; then
              reasons="required checks unreadable"
            fi
            rm -f "$err"

            if committed=$(gh api "repos/$GH_REPO/commits/$sha" --jq .commit.committer.date 2>/dev/null); then
              age_h=$(( (now - $(date -u -d "$committed" +%s)) / 3600 ))
              if [ "$age_h" -gt 24 ]; then
                reasons="${reasons:+$reasons; }no commit in ${age_h}h"
              fi
            else
              reasons="${reasons:+$reasons; }head commit unreadable"
            fi
            if [ "$merge" = "BEHIND" ] || [ "$merge" = "DIRTY" ]; then
              reasons="${reasons:+$reasons; }merge state $merge"
            fi

            if [ -n "$reasons" ]; then
              rows+="| [#$num]($url) | $title | \`${sha:0:12}\` | $merge | $reasons |"$'\n'
            fi
          done

          # One tracking issue for good: the newest one with this exact title, open or closed.
          # A failed lookup must stop the run, or it would open a duplicate.
          found=$(gh issue list --state all --search "\"$TITLE\" in:title" --limit 20 \
            --json number,title,state,createdAt)
          issue=$(jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | sort_by(.createdAt) | last | .number // empty' <<<"$found")
          issue_state=$(jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | sort_by(.createdAt) | last | .state // empty' <<<"$found")

          if [ -z "$rows" ]; then
            if [ "${issue_state:-}" = "OPEN" ]; then
              gh issue close "$issue" --comment "Nothing is stuck as of $(date -u +%FT%TZ)."
            fi
            exit 0
          fi

          body=$(printf '%s\n' \
            "Updated $(date -u +%FT%TZ)." \
            "" \
            "| PR | Title | Head | Merge state | Why |" \
            "| --- | --- | --- | --- | --- |" \
            "$rows")
          if [ -z "${issue:-}" ]; then
            gh issue create --title "$TITLE" --body "$body"
            exit 0
          fi
          if [ "$issue_state" = "CLOSED" ]; then
            gh issue reopen "$issue"
          fi
          gh issue edit "$issue" --body "$body"
