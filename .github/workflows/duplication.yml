name: Duplication

# Caps copied code in each app with jscpd. See docs/development/ci.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: &duplication-paths
      - '.prettierignore'
      - '.prettierrc.json'
      - 'web/**'
      - 'rust/crates/**'
      - 'slicer-sidecar/**'
      - 'scripts/check-duplication.mjs'
      - 'scripts/check-duplication.test.mjs'
      - 'scripts/duplication-baseline.json'
      - '.github/workflows/duplication.yml'
  push:
    branches: [main]
    paths: *duplication-paths
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each main push compares with the commit it replaced, so a cancelled push
  # run would let its baseline increase through unchecked.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jscpd:
    name: duplication
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Include the previous main push and the PR base for baseline comparisons.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the pinned jscpd without lifecycle scripts
        run: npm --prefix web ci --ignore-scripts
      - name: Check duplicated code
        env:
          PP_DUPLICATION_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: |
          node --test scripts/check-duplication.test.mjs
          node scripts/check-duplication.mjs
