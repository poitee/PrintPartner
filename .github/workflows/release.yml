name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  quality:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/web-ci.yml

  manifests:
    uses: ./.github/workflows/validate-manifests.yml

  release:
    needs: [quality, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/poitee/print-partner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate tagged commit
        id: identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_object="$(git rev-parse "refs/tags/${TAG}")"
          commit="$(git rev-parse "refs/tags/${TAG}^{}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          test "$commit" = "$head_commit"
          version="${TAG#v}"
          build_date="$(git show -s --format=%cI "$commit")"
          node scripts/release.mjs check --tag "$TAG" --commit "$commit"
          {
            echo "tag=$TAG"
            echo "tag_object=$tag_object"
            echo "commit=$commit"
            echo "version=$version"
            echo "build_date=$build_date"
            echo "candidate_tag=commit-$commit"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Check for an existing candidate image
        id: candidate
        env:
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$CANDIDATE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push candidate image
        if: steps.candidate.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PP_APP_VERSION=${{ steps.identity.outputs.version }}
            PP_COMMIT=${{ steps.identity.outputs.commit }}
            PP_TAG=${{ steps.identity.outputs.tag }}
            PP_BUILD_DATE=${{ steps.identity.outputs.build_date }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.identity.outputs.candidate_tag }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/poitee/PrintPartner
            index:org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            index:org.opencontainers.image.revision=${{ steps.identity.outputs.commit }}
            index:org.opencontainers.image.ref.name=${{ steps.identity.outputs.tag }}
            manifest-descriptor:org.opencontainers.image.source=https://github.com/poitee/PrintPartner
            manifest-descriptor:org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            manifest-descriptor:org.opencontainers.image.revision=${{ steps.identity.outputs.commit }}
            manifest-descriptor:org.opencontainers.image.ref.name=${{ steps.identity.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve and verify candidate digest
        id: image
        env:
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          EXPECTED_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          reference="$IMAGE:$CANDIDATE_TAG"
          digest="$(docker buildx imagetools inspect "$reference" | awk '/^Digest:/ { print $2; exit }')"
          test -n "$digest"
          docker buildx imagetools inspect "$IMAGE@$digest" --raw > candidate-manifest.json
          jq -e \
            --arg version "$EXPECTED_VERSION" \
            --arg commit "$EXPECTED_COMMIT" \
            --arg tag "$EXPECTED_TAG" \
            '.annotations["org.opencontainers.image.version"] == $version and
             .annotations["org.opencontainers.image.revision"] == $commit and
             .annotations["org.opencontainers.image.ref.name"] == $tag and
             ([.manifests[] | select(
               .platform.os == "linux" and
               (.platform.architecture == "amd64" or .platform.architecture == "arm64")
             )] | length) == 2 and
             all(.manifests[] | select(
               .platform.os == "linux" and
               (.platform.architecture == "amd64" or .platform.architecture == "arm64")
             );
               .annotations["org.opencontainers.image.version"] == $version and
               .annotations["org.opencontainers.image.revision"] == $commit and
               .annotations["org.opencontainers.image.ref.name"] == $tag)' \
            candidate-manifest.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

      - name: Render release identity asset
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node scripts/release.mjs render-asset \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --digest "$DIGEST" \
            --output release-identity.json

      - name: Sign release identity asset
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --new-bundle-format \
            --bundle release-identity.json.sigstore.json release-identity.json

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json tagName --jq .tagName)" = "$TAG"
            mkdir -p existing-release
            assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for asset in release-identity.json cosign.pub; do
              if grep -Fxq "$asset" <<< "$assets"; then
                gh release download "$TAG" --pattern "$asset" --dir existing-release
                cmp --silent "$asset" "existing-release/$asset"
              else
                gh release upload "$TAG" "$asset"
              fi
            done
            # Every signing run writes a new bundle, so keep a published bundle that still verifies.
            bundle=release-identity.json.sigstore.json
            if grep -Fxq "$bundle" <<< "$assets"; then
              gh release download "$TAG" --pattern "$bundle" --dir existing-release
              cosign verify-blob --key cosign.pub --bundle "existing-release/$bundle" release-identity.json
              cp "existing-release/$bundle" "$bundle"
            else
              gh release upload "$TAG" "$bundle"
            fi
          else
            gh release create "$TAG" release-identity.json release-identity.json.sigstore.json cosign.pub \
              --verify-tag \
              --target "$COMMIT" \
              --title "Print Partner $TAG" \
              --generate-notes
          fi

      - name: Create or verify immutable version alias
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            existing="$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ { print $2; exit }')"
            test "$existing" = "$DIGEST"
          else
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          fi
          verified="$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ { print $2; exit }')"
          test "$verified" = "$DIGEST"

      - name: Verify public release identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json tagName,isDraft --jq 'select(.isDraft == false) | .tagName')" = "$TAG"
          test "$(jq -r .image.digest release-identity.json)" = "$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ { print $2; exit }')" = "$DIGEST"

      - name: Verify signatures
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" >/dev/null
          cosign verify-blob --key cosign.pub --bundle release-identity.json.sigstore.json release-identity.json

      - name: Advance latest convenience alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          latest_release="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest_release" = "$TAG" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          else
            echo "Skipping latest: GitHub currently marks $latest_release as the latest release."
          fi
