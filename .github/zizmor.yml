rules:
  dangerous-triggers:
    ignore:
      # Linear sync runs trusted base/default-branch tooling for closed PRs.
      - linear-pr-sync.yml:4
      # pp-score-verify must run on PR and comment events to post its check run.
      # It checks out only .github/scripts from the default branch, never PR code,
      # and passes no attacker-controlled text through an expression.
      - pp-score-verify.yml:10
      - pp-score-verify.yml:12
  self-repository:
    ignore:
      # actionlint 1.7.12 rejects the replacement $/ syntax. These local workflows
      # resolve at the same commit as the caller without a mutable external ref.
      - release.yml:20
      - release.yml:23
