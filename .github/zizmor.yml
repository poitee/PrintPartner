rules:
  dangerous-triggers:
    ignore:
      # Both workflows run trusted base/default-branch scripts, never PR-head code.
      # PR evidence needs body edits and Linear sync needs closed events and a secret.
      - pr-evidence.yml:4
      - linear-pr-sync.yml:4
  self-repository:
    ignore:
      # actionlint 1.7.12 rejects the replacement $/ syntax. These local workflows
      # resolve at the same commit as the caller without a mutable external ref.
      - release.yml:20
      - release.yml:23
  dependabot-cooldown:
    ignore:
      # GRE-635 changes only github-actions. Preserve the existing npm, pip,
      # Docker, and Cargo update policies; their cooldown policy needs separate review.
      - dependabot.yml:3
      - dependabot.yml:25
      - dependabot.yml:46
      - dependabot.yml:56
      - dependabot.yml:66
