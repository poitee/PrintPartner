# Path hints: folder and filename patterns for inferred manifest option groups.
version: 1

rules:
  - path: "**/electronics/**"
    option_group: controller
    variant_id: stock
    label: Electronics

  - path: "**/chain/**"
    option_group: cable_routing
    variant_id: umbilical
    label: Cable chain

  - path: "**/stock_toolhead/**"
    option_group: toolhead
    variant_id: stock
    label: Stock toolhead
