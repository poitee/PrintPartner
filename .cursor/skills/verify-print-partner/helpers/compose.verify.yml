# Verification scaffolding only — isolated Print Partner instance for agents.
# Prefer this over the default named volume so verification never touches
# developer or LAN desk-loop data.
services:
  print-partner:
    image: ghcr.io/poitee/print-partner:${PRINT_PARTNER_VERSION:-3.3.0}
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PRINT_PARTNER_DATA_DIR: "/data"
      STATIC_DIR: "/app/web/apps/web/dist"
      DEPLOY_MODE: "self-host"
      MULTI_USER: "0"
      SINGLE_USER_AUTH: "0"
    volumes:
      - ${PP_VERIFY_DATA_DIR}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
