# Development SaaS stack. Anonymous access and Postgres stay on.
# Production hosted planning refuses SAAS_ALLOW_ANONYMOUS=1.
# Private invite host: docker-compose.hosted.yml and web/DEPLOY.md.

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      # Development defaults only. Override every PP_DEV_* value outside an isolated workstation.
      POSTGRES_USER: "${PP_DEV_POSTGRES_USER:-printpartner}"
      POSTGRES_PASSWORD: "${PP_DEV_POSTGRES_PASSWORD:-printpartner-dev-only}"
      POSTGRES_DB: "${PP_DEV_POSTGRES_DB:-printpartner}"
    ports:
      - "${PP_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - pp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PP_DEV_POSTGRES_USER:-printpartner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  print-partner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PP_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    # Reach host services (e.g. native Ollama) via host.docker.internal on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DEPLOY_MODE: "saas"
      SAAS_DATA_DIR: "/data"
      STATIC_DIR: "/app/web/apps/web/dist"
      DATABASE_URL: "postgresql://${PP_DEV_POSTGRES_USER:-printpartner}:${PP_DEV_POSTGRES_PASSWORD:-printpartner-dev-only}@postgres:5432/${PP_DEV_POSTGRES_DB:-printpartner}"
      # Postgres currently uses an experimental synchronous compatibility bridge.
      POSTGRES_EXPERIMENTAL: "1"
      SAAS_ALLOW_ANONYMOUS: "1"
      MULTI_USER: "${PP_DEV_MULTI_USER:-0}"
      SESSION_SECRET: "${PP_DEV_SESSION_SECRET:-print-partner-dev-only-session-secret}"
      CORS_ORIGIN: "true"
      # Optional server-side Ollama runtime (the former in-app advisor UI is removed).
      # AI_ENABLED: "1"
      # AI_PROVIDER: "ollama"
      # AI_MODEL: "llama3.1:latest"
      # OLLAMA_URL: "http://host.docker.internal:11434"
    volumes:
      - print-partner-data:/data
    healthcheck:
      # node:22-bookworm-slim has no curl/wget; use node's built-in fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pp-postgres:
  print-partner-data:
