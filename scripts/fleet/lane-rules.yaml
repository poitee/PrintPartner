# lane-rules.yaml: Print Partner lane intake rules for the Linear webhook listener.
# Owner: Dev Foreman. Approved by Chad Oct 29 2026 11:51 PM ET (via Alfred).
# Readers: ~/bin/next-ticket.py on each VM (lane AUTO-NEXT), the pp-intake runner workflow, Infra Keeper's listener. It decides which Linear tickets become T3 lanes on VMs 133-136.
# States, labels and priorities were verified read-only in Linear on Oct 29 2026, 11:55 PM ET.
# Note: the Linear team is named "Personal" (key GRE, id below), not "Greetz".
# v11 tickets (GRE-1008..1031) have NO labels. They sit in Backlog under milestone
# "9. Later: after parity", so they're matched by id list and title prefix instead.
# P0 Oct 30: this file is the ONLY source for scorer seat order, pick, claim, close-out and lane-state rules; any
# seat list in lane-brief-common.md, CLAUDE.md or a skill defers here. Other fleet rules stay in the brief. Tell Dev Foreman about any conflict.
version: 2
updated: "2026-10-30T12:00:00-04:00"   # claude_guard: Claude weekly pace guard + Fable council (Chad via Alfred 11:47/11:48 AM ET)
# prev updated: "2026-10-30T10:15:00-04:00"   # scorer_policy: size-based seat (Chad 9:56 AM ET via Alfred)
# prev updated: "2026-10-30T09:45:00-04:00"   # P0 auto-pipeline: one seat order, Fixes-only close-out, no update-branch unblock, lane_state
# prev updated: "2026-10-30T08:30:00-04:00"   # wakefix + tailnet wake (scorer-hint trial removed 2026-10-30 09:00 ET)
# prev updated: "2026-10-30T04:30:00-04:00"   # selfclaim fix: umbrella blockers ignored, GRE-595 excluded, GRE-1029 waits on GRE-365   # v2: claim, linear_access, picker (Chad 11:58 PM ET Oct 29: self-driving intake)

source:
  team: {key: GRE, name: Personal, id: 5f575c20-8e60-499a-9b9f-eb0da5fd0011}
  project: "Print Partner Desktop (Rust core)"
  repo: poitee/PrintPartner

states:  # real Linear workflow states (name: type)
  Backlog: backlog
  Todo: unstarted
  In Progress: started
  In Review: started
  Done: completed
  Canceled: canceled
  Duplicate: duplicate
  done_states: [Done]
  excluded_states: [In Progress, In Review, Done, Canceled, Duplicate]

priority_values:  # Linear numeric priority -> rank (lower rank goes first)
  1: {name: Urgent, rank: 0}
  2: {name: High, rank: 1}
  3: {name: Medium, rank: 2}
  4: {name: Low, rank: 3}
  0: {name: No priority, rank: 4}

classes:
  parity:
    pick_states: [Todo]
    require_any_label: [pp:acceptance, pp:delivery, fleet]
    exclude_labels: [umbrella, needs-chad-action, pp:later, post-parity, chad]
    exclude_title_prefixes: ["UI v11:", "Contract:"]
    exclude_ids_range: [1008, 1031]
    exclude_ids: [595]   # GRE-595 is a tracking parent missing its umbrella label (selfclaim fix Oct 30 4 AM ET)
    note: "Umbrella tickets aren't work units. Do their children instead."
  v11:
    ids_range: [1008, 1031]   # all 24 approved by Chad at 11:00 PM ET on Oct 29
    pick_states: [Todo]   # Backlog is never picked; Dev Foreman moves a v11 ticket to Todo once its blockers are Done
    match_title_prefixes: ["UI v11:", "Contract:", "Driver:"]
    exclude_labels: [needs-chad-action]
    flags: {toggle: desktop_rebuild, default: off, per_screen: true, frontend_only: true, no_mocks: true}

exclusions:
  - open_pr: "gh pr list -R poitee/PrintPartner --state open --search GRE-<n> returns any PR"
  - running_lane: "any T3 thread on 133-136 that is running or waiting and names GRE-<n>"
  - already_merged: "a PR on origin/main that says Fixes GRE-<n>"

dependencies:
  rule: "every 'blocked by' relation must be in a done_state"
  ignore_blockers_with_labels: [umbrella]   # selfclaim fix Oct 30 4 AM ET: umbrellas block their own children, a deadlock that left 75 of 76 candidates blocked
  v11_screen_extra: "the screen's parity PR must be merged"
  overrides:
    GRE-1028: {ignore_blocked_by: [GRE-1004]}
    GRE-1009: {add_blocked_by: [GRE-1003]}
    GRE-1029: {add_blocked_by: [GRE-365]}   # spec 'Waits on GRE-365' (send queue store); Linear relation is empty
  v11_order:  # each step starts only after the one before it is Done
    - [GRE-1008]            # design tokens
    - [GRE-1029]            # contract
    - [GRE-1014]            # contract
    - screens_after_parity_pr   # the other v11 tickets, each once its parity PR merges
    - [GRE-1026]            # mobile sheet, last

pick_rule: "the highest-priority Todo ticket in project 'Print Partner Desktop (Rust core)' whose blockers are all Done and that is not In Progress on another lane; priority 1-4, 0 last (Alfred/Chad Oct 30 4:03 AM ET)"
priority_order:  # sort keys, applied in this order
  - linear_priority: rank ascending     # 1 Urgent .. 4 Low, 0 last
  - class: [parity, v11]                # tie-break: Rust parity first
  - root_unblocker: "number of open tickets this one blocks, descending"
  - linear_priority: rank ascending
  - created_at: ascending               # oldest first
ui_lanes:
  max_concurrent_v11: 1
  raise_when_open_parity_below: 8       # about 8; Dev Foreman decides when to raise it

caps:
  threads_per_vm: 2              # running author threads. Scorers and chores aren't counted, but keep them to 3 extra per VM.
  strix_qwen_chores: 3           # running at once, fleet-wide
  retry_rounds: 3                # fix rounds, each on a different model; round 4 Fable only with Claude headroom >= 25%; then label needs-chad-action and escalate
  tickets_per_pr: 1
  max_pr_lines: 1500             # about 1,500
  one_writer_per_crate: true

runtime_mode: full-access        # every thread, no exceptions
models:
  author: {instanceId: claudeAgent, model: claude-opus-5-5, options: {effort: high}}
  author_overflow:                 # Chad 12:09 PM ET Oct 30: only when claude-guard says CAP1 (no slot) or PARK
    modelSelection: {provider: grok, instanceId: grok, model: grok-4.7}   # T3 grok provider on all 4 VMs (Oct 30 12:10 ET)
    only_if: {pool_readout: ~/fleet/usage/pool.json, pool_max_age_hours: 4, pool_used_pct_lt: 60}   # strict <; stale/missing -> no overflow, park
    scorer: "~/bin/scorer-seat <pr> --author grok-4.7 (never the author's model: small -> Qwen, complex -> cursor composer-2.5)"
  council: {instanceId: claudeAgent, model: claude-fable-5-1, options: {effort: high}, runtimeMode: full-access}   # council + design-review asks go to Fable, not Opus
  chores: {instanceId: pi, model: halo/qwen38-flash}
  scorers:
    must_differ_from_author: true   # different model and vendor than the author (Opus); a Grok score never counts
    verify_answering_model: true
    seat_rule: "run ~/bin/scorer-seat <pr>; launch the seat it prints (see scorer_policy below). On 20-min timeout or Cursor unavailable: fallback_seat."


scorer_policy:   # Chad 9:56 AM ET Oct 30 via Alfred; replaces models.scorers.order. Applied by ~/bin/scorer-seat <pr>.
  small:            # all must hold, else complex
    max_changed_lines: 150   # additions+deletions over counted files
    max_files: 3             # counted files
    not_counted: ["**/Cargo.lock", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/*.snap", "**/*.generated.*", "**/generated.rs", "**/permissions/autogenerated/**"]
    no_paths:   # any touched file matching makes it complex (globs: * within a segment, ** any depth; checked on ALL files)
      # CI / workflows
      - ".github/**"
      # auth / security
      - "**/auth/**"
      - "**/native_secrets*"
      - "**/native_secrets/**"
      - "**/*crypto*"
      - "rust/crates/pp-desktop/tauri.conf.json"
      - "rust/crates/pp-desktop/permissions/**"
      # migrations / schema
      - "**/*.sql"
      - "**/*migrat*"
      - "web/apps/server/src/db/schema*"
      # core Rust public APIs and wire contracts
      - "rust/crates/*/src/lib.rs"
      - "rust/crates/pp-api-types/**"
      - "web/packages/contracts/**"
      - "**/Cargo.toml"
      # release / signing
      - "**/*release*"
      - "**/*signing*"
      - "cosign.pub"
      # fleet Linear writer
      - "scripts/linear/**"
  small_seat: {instanceId: pi, model: halo/qwen38-flash, limits: "40 steps, 20 min"}
  complex_seat: {provider: cursor, instanceId: cursor, model: composer-2.5, note: "T3 has no Cursor 'auto' model id (orchestrator_capabilities on 133/134, Oct 30 10:05 ET); composer-2.5 is the closest plan-included Cursor model. Swap to auto when T3 lists it."}
  complex_launch: {modelSelection: {provider: cursor, instanceId: cursor, model: composer-2.5}, runtimeMode: full-access}
  small_launch: {modelSelection: {provider: pi, instanceId: pi, model: halo/qwen38-flash}, runtimeMode: full-access}
  fallback_seat: {instanceId: pi, model: halo/qwen38-flash}
  pool_guard:
    readout: ~/fleet/usage/pool.json   # {"pct_used": <number>, "read_at": "<UTC ISO Z>", "resets_at": "<UTC ISO Z>"}; Dev Foreman refreshes it
    stop_at_pct: 75
    max_age_hours: 4
    on_missing_or_stale_or_over: "fallback_seat, and log 'pool-guard: <reason>' in the PR score comment"
usage_guard:
  grok_cursor_pool_stop_pct: 75     # stop all Grok and Cursor use
  pool_reset: "Monday 17:55 America/New_York"
  claude_headroom_min_pct: 25       # required before heavy Fable or Opus launches
claude_guard:   # Chad via Alfred, Oct 30 11:48 AM ET. Applied by ~/bin/claude-guard; gates NEW Opus authoring (M5-M7, AUTO-NEXT 4).
  readout: ~/fleet/usage/claude.json   # {"left_pct", "read_at" UTC Z, "resets_at" UTC Z, "source"}; Dev Foreman refreshes it (no safe VM self-read)
  time_left_pct: "hours_to_reset / 168 * 100"
  allow: "left_pct >= time_left_pct - 5 -> normal lane count"
  cap1: "below pace, or readout missing/stale (> 6 h) -> 1 Opus authoring lane fleet-wide; others finish in-flight work then park 'claude-weekly-cap1'"
  cap1_slot: "VM 133 only, lock ~/fleet/usage/cap1-slot.lock (atomic create); first VM133 lane to run claude-guard --thread <id> holds it; freed by --release <id> at M3/park, by holder phase done/parked, or after 24 h"
  park: "left_pct <= 10 -> no new authoring on any lane; in-flight finishes; each lane ends with one 'PARK: claude-weekly-park' block line"
  in_flight: "always finishes the current ticket: fix rounds, scoring, merge"
  grok_overflow: "claude-guard prints overflow=grok:grok-4.7 when allowed; see models.author_overflow"
  missing_readout: seat_unavailable

merge_gate:
  review: droid-review              # Factory Droid review on the exact head; every review thread resolved
  ci: green
  required_status: droid-review
  command: "gh pr merge <n> -R poitee/PrintPartner --squash --match-head-commit <sha>"
  on_wake: checks-passed
  pr_keyword: Fixes                 # never merge with "Refs" (close_out below)
  strict_up_to_date: off            # verified ruleset 25285698; BLOCKED with green required checks = missing/queued check, never update-branch
  auto_merge: forbidden             # never --auto
  post_merge_cleanup: same_turn

lane_behavior:
  end_of_wake: start_next_step      # never end a wake at "completed" with nothing next
  watch_pull_request: once          # never re-arm it
  polling: forbidden

never: [force-push, --admin, ruleset changes, branch-protection changes, repo-settings changes, YNAB, "Chad's real plans", cloud agents, printing or asking for secrets]

picker:
  script: "~/bin/next-ticket.py"          # master copy: /workspace/fleet/bin/next-ticket.py on the box
  rules_path_on_vm: "~/fleet/lane-rules.yaml"
  run: "python3 ~/bin/next-ticket.py --finished GRE-<just merged> [--busy GRE-x ...] --json"
  output: "one JSON line {id, class, title, claimed} or nothing; nothing means end quietly"
  needs: [python3, pyyaml, gh]

linear_access:   # how the picker reaches Linear; key value is never printed
  env: LINEAR_API_KEY
  key_files: ["~/.config/pp-fleet/linear.key", "/home/runner/secrets/linear-readonly.key"]
  fallback: "no key: the lane reads Linear through its Linear MCP (list_issues / get_issue includeRelations), writes normalized JSON, runs the picker with --issues-json"

claim:   # makes two lanes never start the same ticket
  move_to_state: In Progress
  assignee: Chad Lynch           # every current In Progress GRE ticket is assigned to Chad (checked Oct 29 11:59 PM ET)
  assignee_id: f6b59af0-6bf7-4885-8e5f-59d97e93b828
  comment_prefix: "fleet-claim:"
  comment_template: "fleet-claim: vm={vm} thread={thread} branch={branch} at={ts}"
  recheck_after_s: 5
  conflict_rule: "re-read the ticket's comments; the earliest fleet-claim comment wins. A lane whose claim is not earliest backs off: no worktree, no PR, picks again with --busy <that ticket>."
  who_claims:
    with_write_key: "next-ticket.py --claim --vm <vm> --thread <thread id> --branch <branch>"
    with_linear_mcp: "save_issue state In Progress + assignee, save_comment with the template, then get_issue and check the earliest fleet-claim comment"
    neither: "t3_thread_send the foreman 'CLAIM GRE-n vm thread branch'; the foreman claims and replies; start only after the reply"
  runner_workflow: "read-only key, so it never claims; the lane it starts claims as its first step"

wake:   # wakefix, Chad via Alfred Oct 30 8:19 AM ET. Event/timer driven only; no polling.
  scorer_deadline:
    minutes: 20
    mechanism: "T3 schedule_task fixed_time (UTC timeOfDay = now+20m), bindToCurrentThread true, created by the lane in the same turn it delegates a scorer"
    prompt: "~/bin/scorer-deadline-prompt <pr> <sha> <taskId> <seat>"
    on_fire: "disable the task; ~/bin/score-posted <sha> == yes -> nothing; else task_cancel scorer, launch scorer_policy.fallback_seat (if the timed-out seat was already fallback, report no score), new deadline"
  park_registry:
    dir: "~/fleet/parked"   # local record only
    register: "~/bin/park-register <threadId> <reason>, then rename own thread 'PARKED · <title>'"
    marker: "thread title prefix 'PARKED ·'"
  wake_parked:
    script: "~/bin/wake-parked   # right after every merge; prints the MCP steps"
    mechanism: "lane's own T3 MCP: t3_environment_links -> per env t3_thread_list titleContains 'PARKED ·' -> t3_thread_send REPICK (environmentId). Existing full-access T3 environment links over the tailnet; no new secrets. Serve /mcp returns 401 without a credential, so shell scripts do not call T3."
    hooks_fallback: "OFF unless WAKE_PARKED_USE_HOOKS=1; fleet-repick webhook tasks and ~/.config/pp-fleet/repick-urls kept until Chad decides (public relay, token in URL)"

close_out:   # P0 Oct 30: never merge with Refs
  pr_body: "Fixes GRE-<claimed id>"
  unmet_needs_mac_display_or_chad: "split first: child ticket 'GRE-<id> follow-up: <unmet items quoted verbatim>', parent GRE-<id>, label needs-chad-action or needs-mac, Backlog"
  unmet_code_items: "keep working the same PR, or split a code child in Todo the same way"
  honesty: "scorer checks the split quotes the exact unmet items"
  linear_writer: "scripts/linear/pr_status_sync.py (linear-pr-sync.yml) is the only Linear writer for PR state; lane M3 only verifies Done once and sets it if missing"

blocked_pr:   # P0 Oct 30: the old AUTO-NEXT 'BLOCKED -> update-branch + rescore' rule is deleted
  rule: "mergeStateStatus BLOCKED with every required check green: keep the watch armed, lane-state phase=ci_wait, end the turn; never gh pr update-branch to unblock"
  conflict_wake: "merge origin/main (no rebase), push, rescore"

lane_state:   # P0 Oct 30, auto-pipeline design section 6
  script: "~/bin/lane-state set thread_id=<id> phase=<phase> [key=value ...]"   # master copy /workspace/fleet/bin/lane-state, tests bin/test_lane_state.py
  file: "~/fleet/state/lanes/<thread_id>.json"
  write: "partial update merged into the existing file; atomic tmp + rename; UTC ISO-8601 times; value null clears"
  fields: [vm, thread_id, ticket, branch, pr, head_sha, phase, last_turn_at, last_commit_at, deadline_at, parked_reason, scorer_task_id, scorer_seat, fix_round, rules_md5, updated_at]
  phases:
    claim: "M6, with ticket and branch"
    author: "M7, coding starts"
    pr_open: "after gh pr create: pr, head_sha, last_commit_at"
    scoring: "D1: head_sha, scorer_task_id, scorer_seat, deadline_at"
    fixing: "score under 8 or real red CI: fix_round"
    ci_wait: "score 8+ but a required check pending or BLOCKED"
    merging: "M2"
    parked: "D3 or usage cap: parked_reason"
    done: "M3"
    blocked: "fix rounds exhausted or a hard limit: parked_reason"
  writer: "the lane only; readers: Infra Keeper on-box timers"
  on_error: "never blocks the lane; note it in the final message"
